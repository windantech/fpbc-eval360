<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eval360 · Future Planning for the Child</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   1. TOKENS — brief §2. Brand sits in --brand / --brand-deep so FPC's real
   colours swap in one place. Nothing below hardcodes a colour.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#f6f4ee; --card:#ffffff; --muted:#ece8de;
  --ink:#0b1f17; --ink-soft:#3a4a40; --ink-mute:#6c7a72;
  --line:#d8d3c6; --line-soft:#e8e4d6;
  --brand:#0d4d2a; --brand-deep:#07331c; --brand-soft:#e3efe4;   /* swap when FPC colours arrive */
  --accent:#d9822b; --accent-soft:#fbecd9;                       /* warm child-friendly accent */
  --ok:#1f7a45; --warn:#c97a0e; --bad:#a32424; --info:#0e7490;
  --ok-soft:#e1f2e7; --warn-soft:#fbecd0; --bad-soft:#f7e2e0; --info-soft:#d6f0f6;
  --radius:10px;
  --shadow:0 1px 2px rgba(11,31,23,.04),0 0 0 1px rgba(11,31,23,.06);
  --shadow-lg:0 10px 32px rgba(11,31,23,.10),0 0 0 1px rgba(11,31,23,.06);
  --sidebar-w:248px;
  --topbar-h:60px;
}

/* ═══════════════════════════════════════════════════════════════════════════
   2. BASE
   ═══════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,'Times New Roman',serif;margin:0;text-wrap:balance}
.mono,code{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
a{color:var(--brand)}
button{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ═══════════════════════════════════════════════════════════════════════════
   3. LAYOUT — fixed sidebar + sticky topbar + content
   ═══════════════════════════════════════════════════════════════════════════ */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}

/* ── Sidebar ───────────────────────────────────────────────────────────── */
.sb{
  background:var(--brand-deep);color:#e8efe9;
  display:flex;flex-direction:column;
  position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);z-index:40;
}
.sb-brand{display:flex;gap:10px;align-items:center;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-mark{
  width:38px;height:38px;border-radius:9px;flex-shrink:0;
  background:#fff;color:var(--brand-deep);display:grid;place-items:center;
  font-family:'Fraunces',serif;font-weight:700;font-size:14px;letter-spacing:-.02em;
}
.sb-brand-name{font-family:'Fraunces',serif;font-size:14px;font-weight:600;line-height:1.2}
.sb-brand-sub{font-size:9.5px;color:rgba(232,239,233,.58);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

.sb-scroll{flex:1;overflow-y:auto;padding:10px 0 6px;scrollbar-width:thin}
.sb-scroll::-webkit-scrollbar{width:6px}
.sb-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}

.sb-group{padding:10px 16px 4px;display:flex;align-items:center;gap:6px}
.sb-group span{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(232,239,233,.44)}
.sb-group i{font-size:10px;color:rgba(232,239,233,.4)}

.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:7px 16px;color:rgba(232,239,233,.84);
  text-decoration:none;font-size:13px;cursor:pointer;
  border-left:3px solid transparent;background:none;border-top:0;border-right:0;border-bottom:0;
  width:100%;text-align:left;
}
.nav-item i.bi{font-size:14px;width:16px;flex-shrink:0;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(255,255,255,.11);color:#fff;border-left-color:var(--accent);font-weight:600}
.nav-item.locked{opacity:.4;cursor:not-allowed}
.nav-item .lockmark{margin-left:auto;font-size:10px;opacity:.8}
.nav-badge{
  margin-left:auto;background:rgba(255,255,255,.16);color:#fff;
  font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;
}
.nav-badge.urgent{background:var(--bad);color:#fff}
.nav-badge.warn{background:var(--warn);color:#fff}

.sb-foot{padding:10px 16px 14px;border-top:1px solid rgba(255,255,255,.1)}
.checkchip{
  display:flex;align-items:center;gap:6px;width:100%;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  color:rgba(232,239,233,.8);border-radius:7px;padding:6px 9px;
  font-size:10.5px;cursor:pointer;text-align:left;
}
.checkchip:hover{background:rgba(255,255,255,.12)}
.checkchip i{color:#7fd3a0}

/* ── Topbar ────────────────────────────────────────────────────────────── */
.tb{
  position:sticky;top:0;z-index:30;height:var(--topbar-h);
  background:rgba(246,244,238,.93);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 22px;
}
.tb-hamburger{display:none;background:none;border:0;font-size:19px;color:var(--ink);cursor:pointer}
.tb-titles{min-width:0;flex:1}
.tb-crumb{font-size:10.5px;color:var(--ink-mute);letter-spacing:.05em;text-transform:uppercase}
.tb-title{font-family:'Fraunces',serif;font-size:17px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-tools{display:flex;align-items:center;gap:9px;flex-shrink:0}

.tb-search{position:relative}
.tb-search i{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink-mute)}
.tb-search input{
  width:168px;padding:6px 10px 6px 27px;border:1px solid var(--line);border-radius:7px;
  background:var(--card);font-size:12.5px;color:var(--ink);
}
.tb-search input::placeholder{color:var(--ink-mute)}

.sel{
  border:1px solid var(--line);border-radius:7px;background:var(--card);
  padding:6px 9px;font-size:12.5px;color:var(--ink);cursor:pointer;max-width:210px;
}
.sel-wrap{display:flex;align-items:center;gap:6px}
.sel-lbl{font-size:10.5px;color:var(--ink-mute);white-space:nowrap}

.avatar{
  width:31px;height:31px;border-radius:50%;flex-shrink:0;
  background:var(--brand);color:#fff;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;
}

/* ── Content ───────────────────────────────────────────────────────────── */
.content{grid-column:2;display:flex;flex-direction:column;min-width:0}
.main{padding:22px;max-width:1400px;width:100%;margin:0 auto;flex:1}

/* ═══════════════════════════════════════════════════════════════════════════
   4. COMPONENTS
   ═══════════════════════════════════════════════════════════════════════════ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-head{padding:13px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-head h3{font-size:14.5px;font-weight:600}
.card-body{padding:16px}

.sec-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin-bottom:3px}
.sec-sub{font-size:12.5px;color:var(--ink-mute);margin-bottom:14px}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:7px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:12.5px;font-weight:500;cursor:pointer;
}
.btn:hover{background:var(--muted)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-deep)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-accent:hover{filter:brightness(.94)}
.btn-ghost{background:none;border-color:transparent;color:var(--ink-soft)}
.btn-ghost:hover{background:var(--muted)}
.btn-sm{padding:4px 9px;font-size:11.5px}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.chip i{font-size:10px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.grey{background:var(--muted);color:var(--ink-mute)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.accent{background:var(--accent-soft);color:#8a4d12}

/* Stage placeholder — each empty view says what lands there and when. */

/* ── Views: only .active is shown ──────────────────────────────────────── */
.view{display:none}
.view.active{display:block}

/* ── Toast ─────────────────────────────────────────────────────────────── */
#toasts{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{
  background:var(--ink);color:#f2f6f3;border-radius:8px;padding:10px 14px;
  font-size:12.5px;box-shadow:var(--shadow-lg);display:flex;align-items:flex-start;gap:8px;
  max-width:340px;animation:toastIn .22s ease-out;
}
.toast i{font-size:13px;flex-shrink:0;margin-top:1px}
.toast.ok i{color:#7fd3a0}
.toast.warn i{color:#f0c070}
.toast.bad i{color:#f09a90}
@keyframes toastIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ── Modal ─────────────────────────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;z-index:80;background:rgba(11,31,23,.46);
  display:none;align-items:flex-start;justify-content:center;padding:40px 18px;overflow-y:auto;
}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:12px;box-shadow:var(--shadow-lg);width:100%;max-width:680px}
.modal.wide{max-width:980px}
.modal-head{padding:15px 19px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-head h3{font-size:15.5px;font-weight:600}
.modal-body{padding:19px}
.modal-foot{padding:13px 19px;border-top:1px solid var(--line-soft);display:flex;justify-content:flex-end;gap:8px}
.modal-x{background:none;border:0;font-size:17px;color:var(--ink-mute);cursor:pointer;line-height:1}
.modal-x:hover{color:var(--ink)}


/* ═══════════════════════════════════════════════════════════════════════════
   4b. STAGE 3 COMPONENTS — hero, tiles, tree, matrix, data tables, charts
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── Hero band ─────────────────────────────────────────────────────────── */
.hero{
  background:linear-gradient(120deg,var(--brand-deep) 0%,var(--brand) 62%,#11633a 100%);
  color:#eef4ef;border-radius:var(--radius);padding:20px 24px;margin-bottom:18px;
  position:relative;overflow:hidden;
}
.hero h2{font-size:20px;font-weight:700;color:#fff;margin-bottom:5px}
.hero .hsub{font-size:12.5px;color:rgba(238,244,239,.76);margin-bottom:14px}
.hero .hpill{
  display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);
  border-radius:99px;padding:2px 10px;font-size:11px;font-weight:600;margin-bottom:10px;
}
.hero .hmeta{display:flex;flex-wrap:wrap;gap:0 26px;margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.16)}
.hero .hmeta div{font-size:11px;color:rgba(238,244,239,.6)}
.hero .hmeta b{display:block;font-size:14px;color:#fff;font-weight:600;margin-top:1px}
.hero .hbars{margin-top:14px;display:grid;gap:7px;max-width:520px}
.hero .hbar-lbl{display:flex;justify-content:space-between;font-size:11px;color:rgba(238,244,239,.74);margin-bottom:3px}
.hero .hbar{height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.hero .hbar i{display:block;height:100%;border-radius:3px;background:#fff}
.hero .hbar i.accent{background:var(--accent)}

/* ── Dashboard grid ────────────────────────────────────────────────────── */
.dash-top{display:grid;grid-template-columns:minmax(0,1fr) 332px;gap:18px;align-items:start}
@media (max-width:1240px){.dash-top{grid-template-columns:minmax(0,1fr)}}

.cta{
  background:var(--card);border:1px solid var(--accent);border-left:4px solid var(--accent);
  border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);
}
.cta .lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.cta h3{font-size:15px;font-weight:600;margin:6px 0 4px}
.cta p{margin:0 0 12px;font-size:12.5px;color:var(--ink-soft);line-height:1.5}
.cta .ready{font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:var(--brand);line-height:1}

.kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:1100px){.kpi-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--shadow)}
.kpi .k-lbl{font-size:10.5px;color:var(--ink-mute);letter-spacing:.03em;text-transform:uppercase;line-height:1.3}
.kpi .k-val{font-family:'Fraunces',serif;font-size:25px;font-weight:700;line-height:1.1;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:11.5px;color:var(--ink-mute);margin-top:3px}

.so-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
@media (max-width:1240px){.so-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.so-grid{grid-template-columns:minmax(0,1fr)}}
.so-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow)}
.so-card .so-code{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-mute)}
.so-card h4{font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;margin:4px 0 8px;line-height:1.4}
.so-card .so-ind{font-size:11.5px;color:var(--ink-soft);line-height:1.45;min-height:48px}
.so-card .so-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft)}
.so-card .so-cnt{font-size:11px;color:var(--ink-mute)}

.prog{height:6px;border-radius:3px;background:var(--muted);overflow:hidden;margin:7px 0 4px}
.prog i{display:block;height:100%;border-radius:3px;background:var(--brand)}
.prog i.ok{background:var(--ok)}.prog i.warn{background:var(--warn)}.prog i.bad{background:var(--bad)}

.panel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:18px}
@media (max-width:1100px){.panel-grid{grid-template-columns:minmax(0,1fr)}}
.chart-wrap{position:relative;height:238px;padding:4px}

.alert-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.alert-item:last-child{border-bottom:none}
.alert-item i{font-size:14px;flex-shrink:0;margin-top:1px}
.alert-item .a-t{font-weight:600}
.alert-item .a-d{color:var(--ink-mute);font-size:11.5px;margin-top:1px}
.alert-item button{margin-left:auto;flex-shrink:0;align-self:center}

.feed-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.feed-item:last-child{border-bottom:none}
.feed-item .f-ic{width:24px;height:24px;border-radius:6px;flex-shrink:0;display:grid;place-items:center;background:var(--muted);font-size:11px}
.feed-item .f-d{color:var(--ink-mute);font-size:11px;margin-top:1px}

/* ── Stylised GVH map (no external tiles) ──────────────────────────────── */
.gvh-map{display:flex;gap:14px;flex-wrap:wrap}
.gvh-map svg{flex:1;min-width:230px;height:150px}

/* ── Logframe tree + matrix ────────────────────────────────────────────── */
.lf-toolbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.lf-node{border-bottom:1px solid var(--line-soft)}
.lf-row{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;cursor:default}
.lf-row.clickable{cursor:pointer}
.lf-row.clickable:hover{background:var(--muted)}
.lf-tw{width:16px;flex-shrink:0;text-align:center;font-size:10px;color:var(--ink-mute);background:none;border:0;cursor:pointer;padding:2px 0}
.lf-code{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-mute);flex-shrink:0;width:52px}
.lf-body{flex:1;min-width:0}
.lf-stmt{font-size:12.5px;line-height:1.45}
.lf-ind{font-size:11.5px;color:var(--ink-mute);margin-top:3px;line-height:1.4}
.lf-tag{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);
  background:var(--muted);padding:1px 6px;border-radius:3px;margin-left:6px;white-space:nowrap}
.lf-right{display:flex;align-items:center;gap:7px;flex-shrink:0}
.lf-children{margin-left:22px;border-left:1px solid var(--line-soft)}
.lf-warn{color:var(--warn);font-size:12px;cursor:help}
.lf-lvl-sub_objective>.lf-row{background:var(--brand-soft)}
.lf-lvl-use_of_output>.lf-row{background:rgba(13,77,42,.035)}

.lf-matrix{width:100%;border-collapse:collapse;font-size:12px}
.lf-matrix th{text-align:left;padding:9px 11px;background:var(--brand-deep);color:#fff;
  font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;vertical-align:bottom}
.lf-matrix td{padding:9px 11px;border:1px solid var(--line);vertical-align:top;line-height:1.45}
.lf-matrix tr.r-sub td{background:var(--brand-soft);font-weight:600}
.lf-matrix tr.r-uoo td{background:rgba(13,77,42,.04)}
.lf-matrix .m-code{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-mute);display:block;margin-bottom:2px}

/* ── Data tables + filters ─────────────────────────────────────────────── */
.dt{width:100%;border-collapse:collapse;font-size:12.5px}
.dt th{text-align:left;padding:9px 11px;background:var(--muted);border-bottom:1px solid var(--line);
  font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-mute);white-space:nowrap}
.dt td{padding:9px 11px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.45}
.dt tbody tr:last-child td{border-bottom:none}
.dt tbody tr.clickable{cursor:pointer}
.dt tbody tr.clickable:hover td{background:var(--muted)}
.dt td.n,.dt th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dt tr.grp td{background:var(--brand-soft);font-weight:600;font-size:11.5px;
  font-family:'Fraunces',serif;color:var(--brand)}
.tbl-scroll{overflow-x:auto}

.filterbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
.filterbar select,.filterbar input[type=search]{
  border:1px solid var(--line);border-radius:7px;background:var(--card);
  padding:6px 9px;font-size:12px;color:var(--ink);font-family:inherit;
}
.fpill{
  border:1px solid var(--line);border-radius:99px;background:var(--card);
  padding:4px 11px;font-size:11.5px;cursor:pointer;color:var(--ink-soft);
}
.fpill.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

.banner{
  display:flex;gap:10px;align-items:flex-start;border-radius:9px;padding:11px 14px;
  font-size:12.5px;line-height:1.5;margin-bottom:14px;
}
.banner i{font-size:14px;flex-shrink:0;margin-top:1px}
.banner.info{background:var(--info-soft);color:#0b5566;border:1px solid #9fd8e4}
.banner.warn{background:var(--warn-soft);color:#7c4a0a;border:1px solid #e8c97a}
.banner button{margin-left:auto;flex-shrink:0}

/* ── Target groups table ───────────────────────────────────────────────── */
.tg{width:100%;border-collapse:collapse;font-size:12px}
.tg th{padding:7px 9px;background:var(--muted);border:1px solid var(--line);
  font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-mute)}
.tg td{padding:8px 9px;border:1px solid var(--line-soft);vertical-align:top}
.tg td.n{text-align:right;font-variant-numeric:tabular-nums}
.tg tr.short td{background:var(--bad-soft)}
.tg tr.total td{background:var(--muted);font-weight:700}
.tg .vin{
  width:100%;border:1px solid var(--line);border-radius:5px;padding:4px 7px;
  font-size:11.5px;font-family:inherit;color:var(--ink);background:var(--card);
}

/* ── Indicator detail ──────────────────────────────────────────────────── */
.kv{width:100%;border-collapse:collapse;font-size:12.5px}
.kv td{padding:7px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
.kv td:first-child{color:var(--ink-mute);width:38%}
.kv tr:last-child td{border-bottom:none}
.spark{display:block}
.num-big{font-family:'Fraunces',serif;font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}


/* ═══════════════════════════════════════════════════════════════════════════
   4c. STAGE 4 COMPONENTS — workplan, activity detail, VCRC/CBCC, CSC stepper
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── Quarterly workplan (Gantt) ─────────────────────────────────────────── */
.gantt{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px}
.gantt th{padding:6px 5px;background:var(--muted);border-bottom:1px solid var(--line);
  font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-mute);
  text-align:center;white-space:nowrap}
.gantt th.gh-act{text-align:left;min-width:300px;position:sticky;left:0;background:var(--muted);z-index:2}
.gantt th.now{background:var(--brand-soft);color:var(--brand)}
.gantt td{padding:5px;border-bottom:1px solid var(--line-soft);height:30px}
.gantt td.g-act{position:sticky;left:0;background:var(--card);z-index:1;line-height:1.35}
.gantt td.g-cell{text-align:center;vertical-align:middle;min-width:48px}
.gantt td.g-cell.past{background:rgba(11,31,23,.018)}
.gantt td.g-cell.now{background:var(--brand-soft)}
.gantt tr.grp td{background:var(--brand-soft);font-family:'Fraunces',serif;font-weight:600;
  color:var(--brand);font-size:11.5px;position:static}
.gbar{display:inline-block;height:9px;border-radius:5px;min-width:26px;width:80%}
.gbar.done{background:var(--ok)}
.gbar.planned{background:var(--line);border:1px dashed var(--ink-mute)}
.gbar.postponed{background:var(--bad-soft);border:1px solid var(--bad)}
.gbar.moved{background:var(--warn)}
.g-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink-mute);margin-top:11px}
.g-legend span{display:inline-flex;align-items:center;gap:5px}
.g-legend i{width:16px;height:8px;border-radius:4px;display:inline-block}

/* ── "This record feeds" strip — the enter-once message ─────────────────── */
.feeds{
  background:var(--brand-soft);border:1px solid #bcd9c4;border-left:4px solid var(--brand);
  border-radius:8px;padding:11px 14px;margin-bottom:16px;font-size:12.5px;line-height:1.6;
}
.feeds .f-h{font-weight:600;color:var(--brand);margin-bottom:4px;font-size:11.5px}
.feeds a{color:var(--brand);text-decoration:none;border-bottom:1px dotted var(--brand);cursor:pointer}
.feeds .f-item{display:inline-block;margin-right:14px;white-space:nowrap}

/* ── Attendance table (CSSF format: M / M-PwD / F / F-PwD / Total) ──────── */
.att{width:100%;border-collapse:collapse;font-size:12px;margin:9px 0}
.att th{padding:6px 9px;background:var(--brand-deep);color:#fff;border:1px solid var(--brand-deep);
  font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:center}
.att td{padding:7px 9px;border:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.att td:first-child{text-align:left}
.att tr.t td{background:var(--muted);font-weight:700}

/* ── VCRC / CBCC cards ─────────────────────────────────────────────────── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(242px,1fr));gap:12px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 13px;box-shadow:var(--shadow)}
.mini .m-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.mini .m-code{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500}
.mini .m-gvh{font-size:10.5px;color:var(--ink-mute)}
.mini .m-score{font-family:'Fraunces',serif;font-size:19px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.mini .m-rows{margin-top:9px;font-size:11.5px}
.mini .m-r{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--line-soft)}
.mini .m-r:last-child{border-bottom:none}
.mini .m-r span:first-child{color:var(--ink-mute)}
.mini .m-r span:last-child{font-variant-numeric:tabular-nums;font-weight:500}

/* ── CSC stepper ───────────────────────────────────────────────────────── */
.stepper{display:flex;flex-wrap:wrap;gap:0;margin:4px 0 2px}
.step{display:flex;align-items:center;gap:8px;flex:1 1 150px;min-width:150px;padding:9px 11px;
  border:1px solid var(--line);border-right:0;background:var(--card);position:relative}
.step:last-child{border-right:1px solid var(--line);border-radius:0 8px 8px 0}
.step:first-child{border-radius:8px 0 0 8px}
.step .s-n{width:21px;height:21px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
  font-size:10px;font-weight:700;background:var(--muted);color:var(--ink-mute)}
.step .s-l{font-size:11px;line-height:1.3}
.step.done{background:var(--ok-soft)}
.step.done .s-n{background:var(--ok);color:#fff}
.step.doing{background:var(--warn-soft)}
.step.doing .s-n{background:var(--warn);color:#fff}
.step.todo{opacity:.62}

.sc-table{width:100%;border-collapse:collapse;font-size:12.5px}
.sc-table th{padding:8px 10px;background:var(--muted);border-bottom:1px solid var(--line);
  font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-mute);text-align:left}
.sc-table td{padding:8px 10px;border-bottom:1px solid var(--line-soft)}
.sc-table td.n{text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.dots{display:inline-flex;gap:2px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.dots i.on{background:var(--brand)}
.dots i.on.prov{background:var(--accent)}
.gap-pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:10.5px;font-weight:700}
.gap-pill.big{background:var(--bad-soft);color:var(--bad)}
.gap-pill.mid{background:var(--warn-soft);color:var(--warn)}
.gap-pill.ok{background:var(--ok-soft);color:var(--ok)}


/* ═══════════════════════════════════════════════════════════════════════════
   4d. STAGE 5 COMPONENTS — kanban, locked screen, referral pathway, audit log
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── Locked screen (brief §7.9) ─────────────────────────────────────────── */
.locked{
  position:relative;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--card);padding:0;overflow:hidden;margin-bottom:18px;
}
.locked-blur{filter:blur(5px);opacity:.42;pointer-events:none;padding:16px;user-select:none}
.redact{display:inline-block;height:9px;border-radius:3px;background:var(--line);
  vertical-align:middle;opacity:.85}
.locked-msg{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:24px;background:rgba(246,244,238,.68);
}
.locked-msg i.big{font-size:26px;color:var(--bad);margin-bottom:9px}
.locked-msg h4{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin-bottom:6px}
.locked-msg p{margin:0;font-size:12.5px;color:var(--ink-soft);max-width:46ch;line-height:1.55}

/* ── Kanban ────────────────────────────────────────────────────────────── */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(158px,1fr));gap:10px;align-items:start}
@media (max-width:1240px){.kanban{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.kanban{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kcol{background:var(--muted);border-radius:9px;padding:8px;min-height:72px}
.kcol-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;padding:0 2px}
.kcol-h span{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-mute);line-height:1.2}
.kcol-h b{font-family:'Fraunces',serif;font-size:14px;font-variant-numeric:tabular-nums}
.kcard{
  background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:7px;padding:8px 9px;margin-bottom:6px;cursor:pointer;font-size:11.5px;
}
.kcard:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.kcard .kc-id{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-mute)}
.kcard .kc-cat{font-weight:600;margin:2px 0 3px;line-height:1.3}
.kcard .kc-meta{color:var(--ink-mute);font-size:10.5px}
.kcard.sev-high{border-left-color:var(--bad)}
.kcard.sev-mid{border-left-color:var(--warn)}
.kcard.sev-low{border-left-color:var(--ok)}

/* ── Referral pathway diagram ──────────────────────────────────────────── */
.pathway{width:100%;height:auto;max-width:720px;display:block;margin:0 auto}
.pathway text{font-family:'Inter',sans-serif;font-size:9px;fill:var(--ink-soft)}
.pathway text.n{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:500;fill:var(--brand)}
.pathway text.ttl{font-size:9.5px;font-weight:600;fill:var(--ink)}
.pathway rect{fill:var(--card);stroke:var(--line)}
.pathway rect.src{fill:var(--brand-soft);stroke:#bcd9c4}
.pathway path{fill:none;stroke:var(--line);stroke-width:1.4}

/* ── Audit log ─────────────────────────────────────────────────────────── */
.audit{width:100%;border-collapse:collapse;font-size:12px}
.audit td{padding:7px 10px;border-bottom:1px solid var(--line-soft)}
.audit tr:last-child td{border-bottom:none}
.audit .a-ts{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-mute);white-space:nowrap}
.audit .a-ref{font-family:'JetBrains Mono',monospace;font-size:10.5px}
.audit tr.denied td{background:var(--bad-soft)}

/* ── Suppressed small numbers ──────────────────────────────────────────── */
.supp{color:var(--ink-mute);font-style:italic}


/* ═══════════════════════════════════════════════════════════════════════════
   4e. STAGE 6 COMPONENTS — phone frame, forms library, action board, gallery
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── Form library cards ─────────────────────────────────────────────────── */
.form-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 15px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.form-card .fc-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px}
.form-card .fc-ic{width:34px;height:34px;border-radius:9px;flex-shrink:0;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand);font-size:15px}
.form-card h4{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;line-height:1.35}
.form-card .fc-owner{font-size:10.5px;color:var(--ink-mute);margin-top:1px}
.form-card .fc-fields{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:9px}
.form-card .fc-feeds{font-size:11px;color:var(--ink-mute);line-height:1.5;
  padding:7px 9px;background:var(--brand-soft);border-radius:6px;margin-bottom:9px}
.form-card .fc-stats{display:flex;gap:14px;font-size:11px;color:var(--ink-mute);
  padding-top:9px;border-top:1px solid var(--line-soft);margin-top:auto}
.form-card .fc-stats b{display:block;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.form-card .fc-actions{display:flex;gap:7px;margin-top:10px}
.offline{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;
  background:var(--info-soft);color:#0b5566;border-radius:99px;padding:1px 7px}

/* ── Phone frame ───────────────────────────────────────────────────────── */
.phone-wrap{display:flex;justify-content:center;padding:4px 0}
.phone{width:324px;border:9px solid #1a2520;border-radius:30px;background:var(--bg);
  box-shadow:0 14px 36px rgba(11,31,23,.24);overflow:hidden;position:relative}
.phone-notch{height:20px;background:#1a2520;display:flex;align-items:center;justify-content:center}
.phone-notch i{width:52px;height:4px;border-radius:3px;background:#3c4a44;display:block}
.phone-bar{background:var(--brand-deep);color:#eef4ef;padding:9px 13px;display:flex;align-items:center;gap:8px}
.phone-bar .pb-t{font-size:12px;font-weight:600;line-height:1.25;flex:1}
.phone-bar .pb-s{font-size:9.5px;color:rgba(238,244,239,.6)}
.phone-body{padding:13px;max-height:398px;overflow-y:auto;background:var(--bg)}
.phone-body label{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-mute);margin:11px 0 3px}
.phone-body label:first-child{margin-top:0}
.phone-body input,.phone-body select,.phone-body textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;
  background:var(--card);font-family:inherit;font-size:13px;color:var(--ink)}
.phone-body textarea{resize:vertical;min-height:54px}
.exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.exp-grid label{font-size:11px;color:var(--ink-mute);display:flex;flex-direction:column}
.exp-grid .sel{width:100%;max-width:none;margin-top:3px}
@media (max-width:640px){.exp-grid{grid-template-columns:1fr}}
.phone-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phone-grid label{margin-top:0}
.phone-foot{padding:11px 13px;border-top:1px solid var(--line);background:var(--card)}
.phone-foot button{width:100%}
.phone-sync{font-size:10px;color:var(--ink-mute);text-align:center;margin-top:7px;
  display:flex;align-items:center;justify-content:center;gap:5px}
.qrow{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px}
.qrow .qt{font-size:12px;line-height:1.4;margin-bottom:7px}
.ynrow{display:flex;gap:5px}
.ynrow label{flex:1;margin:0;text-align:center;border:1px solid var(--line);border-radius:6px;
  padding:5px 0;cursor:pointer;font-size:10.5px;font-weight:600;letter-spacing:0;text-transform:none;
  color:var(--ink-soft);background:var(--card)}
.ynrow label:has(input:checked){background:var(--brand);border-color:var(--brand);color:#fff}
.ynrow input{position:absolute;opacity:0;width:0;height:0}

/* ── Action board ──────────────────────────────────────────────────────── */
.act-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:900px){.act-board{grid-template-columns:minmax(0,1fr)}}
.act-col{background:var(--muted);border-radius:9px;padding:9px}
.act-col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px}
.act-col-h span{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-mute)}
.act-col-h b{font-family:'Fraunces',serif;font-size:15px;font-variant-numeric:tabular-nums}
.act-card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:7px;padding:9px 10px;margin-bottom:7px;font-size:11.5px}
.act-card.overdue{border-left-color:var(--bad);background:var(--bad-soft)}
.act-card.open{border-left-color:var(--warn)}
.act-card.closed{border-left-color:var(--ok);opacity:.78}
.act-card .ac-id{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-mute)}
.act-card .ac-i{font-weight:600;margin:2px 0 3px;line-height:1.35}
.act-card .ac-m{color:var(--ink-mute);font-size:10.5px;line-height:1.4}
.act-card .ac-f{display:flex;align-items:center;justify-content:space-between;margin-top:7px;gap:6px}

/* ── Visit report (FPC template) ───────────────────────────────────────── */
.vt{width:100%;border-collapse:collapse;font-size:12px;margin:7px 0 2px}
.vt th{padding:7px 10px;background:var(--muted);border:1px solid var(--line);text-align:left;
  font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-mute)}
.vt td{padding:8px 10px;border:1px solid var(--line-soft);vertical-align:top;line-height:1.5}
.vsec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--brand);margin:16px 0 3px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.vsec:first-child{margin-top:0}
.vnote{font-size:11px;color:var(--ink-mute);font-style:italic;margin-bottom:5px}

/* ── Evidence gallery ──────────────────────────────────────────────────── */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:12px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow)}
.gcard.noconsent{border-color:var(--bad)}
.gthumb{height:110px;display:block;background:var(--muted)}
.gmeta{padding:9px 11px}
.gmeta .gc{font-size:11.5px;line-height:1.4;font-weight:500}
.gmeta .gd{font-size:10.5px;color:var(--ink-mute);margin-top:3px}
.gmeta .gf{margin-top:7px}

/* ── Story cards ───────────────────────────────────────────────────────── */
.story{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:16px}
.story-h{padding:14px 17px;border-bottom:1px solid var(--line-soft)}
.story-h h4{font-family:'Fraunces',serif;font-size:15.5px;font-weight:600;line-height:1.3}
.story-b{padding:15px 17px}
.story-b .sl{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-mute);margin:13px 0 3px}
.story-b .sl:first-child{margin-top:0}
.story-b p{margin:0;font-size:12.5px;line-height:1.6;max-width:72ch}
.story-b blockquote{margin:13px 0 0;padding:11px 15px;border-left:3px solid var(--accent);
  background:var(--accent-soft);border-radius:0 7px 7px 0;font-size:12.5px;font-style:italic;line-height:1.55}

/* ───────────────────────────────────────────────────────────────────────
   4f. STAGE 7 — budget and spend
   ─────────────────────────────────────────────────────────────────────── */
.donor-tabs{display:flex;gap:6px;background:var(--bg-muted);padding:4px;border-radius:10px;
  margin-bottom:16px;flex-wrap:wrap}
.donor-tabs button{flex:1;min-width:150px;border:0;background:transparent;cursor:pointer;
  padding:9px 13px;border-radius:7px;font:600 12.5px/1.25 'Inter',sans-serif;color:var(--ink-soft);
  text-align:left;transition:background .14s,color .14s}
.donor-tabs button .dt-s{display:block;font-weight:500;font-size:10.5px;color:var(--ink-mute);margin-top:2px}
.donor-tabs button:hover{background:rgba(0,0,0,.04)}
.donor-tabs button.on{background:var(--bg-card);color:var(--ink);box-shadow:var(--shadow)}
.donor-tabs button.on .dt-s{color:var(--brand)}

.fin-table{width:100%;border-collapse:collapse;font-size:12.5px}
.fin-table th{text-align:left;font:700 10px/1.3 'Inter',sans-serif;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-mute);padding:8px 10px;border-bottom:1px solid var(--line)}
.fin-table td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.fin-table th.n,.fin-table td.n{text-align:right;font-variant-numeric:tabular-nums}
.fin-table tr:last-child td{border-bottom:0}
.fin-table tfoot td{border-top:2px solid var(--line);border-bottom:0;font-weight:700;
  background:var(--bg-muted);font-variant-numeric:tabular-nums}
.fin-table .ln-note{display:block;font-size:10.5px;color:var(--ink-mute);line-height:1.45;
  margin-top:3px;max-width:42ch}
.fin-mwk{display:block;font-size:10.5px;color:var(--ink-mute);font-variant-numeric:tabular-nums}

.spark-cell{width:124px}
.linebar{height:7px;border-radius:4px;background:var(--bg-muted);overflow:hidden;position:relative}
.linebar i{position:absolute;inset:0 auto 0 0;border-radius:4px;display:block}
.linebar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-soft);
  border-radius:1px;text-decoration:none}

.burn-note{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;color:var(--ink-soft);
  line-height:1.6;background:var(--bg-muted);border-radius:9px;padding:11px 13px;margin-top:12px}
.burn-note i{color:var(--brand);font-size:14px;margin-top:1px}

.var-row{display:grid;grid-template-columns:86px 1fr 104px 92px;gap:12px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line-soft)}
.var-row:last-child{border-bottom:0}
.var-row .vr-t{font-size:12px;line-height:1.45}
.var-row .vr-t small{display:block;color:var(--ink-mute);font-size:10.5px;margin-top:2px}
.var-pct{text-align:right;font:700 13px/1 'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.var-pct.up{color:var(--bad)} .var-pct.down{color:var(--warn)} .var-pct.ok{color:var(--ink-mute)}

.split-bar{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:10px 0 8px}
.split-bar div{display:flex;align-items:center;justify-content:center;font:700 11px/1 'Inter',sans-serif;
  color:#fff;white-space:nowrap}

/* ───────────────────────────────────────────────────────────────────────
   4g. STAGE 8 — report centre and document preview
   ─────────────────────────────────────────────────────────────────────── */
.rep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(336px,1fr));gap:14px}
.rep-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 17px;display:flex;flex-direction:column;gap:11px;position:relative;overflow:hidden}
.rep-card.due{border-color:var(--accent);box-shadow:var(--shadow)}
.rep-card.due::before{content:'';position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent)}
.rep-card h4{margin:0;font:600 13.5px/1.35 'Inter',sans-serif;color:var(--ink);text-wrap:balance}
.rep-card .rc-meta{font-size:11px;color:var(--ink-mute);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.rep-card .rc-ready{display:flex;align-items:baseline;gap:7px}
.rep-card .rc-ready b{font:700 24px/1 'Fraunces',serif;font-variant-numeric:tabular-nums}
.rep-card .rc-ready span{font-size:11px;color:var(--ink-mute)}
.rep-card .rc-miss{list-style:none;margin:0;padding:0;font-size:11px;line-height:1.55;color:var(--ink-soft)}
.rep-card .rc-miss li{display:flex;gap:6px;padding:3px 0}
.rep-card .rc-miss i{color:var(--warn);font-size:11px;margin-top:2px;flex:none}
.rep-card .rc-foot{margin-top:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}

.gen-steps{list-style:none;margin:0;padding:0;font-size:12.5px}
.gen-steps li{display:flex;gap:9px;align-items:center;padding:7px 0;color:var(--ink-mute);
  transition:color .2s}
.gen-steps li.on{color:var(--ink);font-weight:600}
.gen-steps li.done{color:var(--ink-soft)}
.gen-steps li i{width:16px;text-align:center;flex:none}
.gen-steps li.done i{color:var(--ok)} .gen-steps li.on i{color:var(--brand)}
.gen-bar{height:5px;border-radius:3px;background:var(--bg-muted);overflow:hidden;margin-top:14px}
.gen-bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .35s ease}

/* The document itself — A4 proportions, serif body, donor's own numbering. */
.doc-wrap{background:var(--bg-muted);padding:22px;border-radius:var(--radius);overflow-x:auto}
.doc{background:#fff;color:#14201a;max-width:820px;margin:0 auto;padding:46px 54px 56px;
  box-shadow:0 2px 18px rgba(16,33,24,.14);font:13px/1.65 'Inter',sans-serif}
.doc h1{font:700 19px/1.3 'Fraunces',serif;margin:0 0 4px;text-align:center;text-wrap:balance}
.doc .doc-sub{text-align:center;font-size:11.5px;color:#5c6b63;margin-bottom:22px}
.doc h2{font:700 14px/1.35 'Fraunces',serif;margin:26px 0 8px;padding-bottom:5px;
  border-bottom:1.5px solid #14201a;text-wrap:balance}
.doc h3{font:700 12.5px/1.35 'Inter',sans-serif;margin:18px 0 6px}
.doc p{margin:0 0 10px}
.doc table{width:100%;border-collapse:collapse;font-size:11.5px;margin:9px 0 14px}
.doc th,.doc td{border:1px solid #b9c4bd;padding:6px 8px;text-align:left;vertical-align:top}
.doc th{background:#eef2ef;font-weight:700;font-size:10.5px}
.doc td.n,.doc th.n{text-align:right;font-variant-numeric:tabular-nums}
.doc .hdr-tbl th{width:38%;background:#f6f8f6}
.doc ul,.doc ol{margin:0 0 10px;padding-left:20px}
.doc li{margin-bottom:4px}
.doc .prompt{font-size:10.5px;color:#7a8a81;font-style:italic;margin:0 0 7px}
.doc .limit{float:right;font-size:10px;color:#7a8a81;font-style:italic;font-weight:400}

.doc .ai{background:#fdf6dd;border-left:3px solid #e0b93a;padding:11px 13px;margin:0 0 11px;
  border-radius:0 6px 6px 0;position:relative}
.doc .ai .ai-tag{display:inline-flex;align-items:center;gap:4px;font:700 9px/1 'Inter',sans-serif;
  letter-spacing:.07em;text-transform:uppercase;color:#8a6d12;margin-bottom:6px}
.doc .ai p:last-child{margin-bottom:0}
.doc .ai[contenteditable="true"]{outline:2px solid var(--brand);background:#fff}
.doc .gap{background:#fbe9e7;border-left:3px solid #a32424;padding:9px 12px;margin:0 0 11px;
  border-radius:0 6px 6px 0;font-size:12px;color:#7d1d1d;display:flex;gap:8px;align-items:flex-start}
.doc .gap i{margin-top:2px}
.doc .sec{position:relative}
.doc .sec-tools{position:absolute;top:24px;right:-6px;display:flex;gap:4px;opacity:0;
  transition:opacity .15s}
.doc .sec:hover .sec-tools,.doc .sec-tools:focus-within{opacity:1}
.doc .sec-tools button{border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;
  font:600 10px/1 'Inter',sans-serif;color:var(--ink-soft);padding:5px 7px}
.doc .sec-tools button:hover{border-color:var(--brand);color:var(--brand)}
.doc .sig{margin-top:34px;display:flex;gap:40px;font-size:11.5px}
.doc .sig div{flex:1;border-top:1px solid #14201a;padding-top:5px}
.doc .foot{margin-top:28px;padding-top:9px;border-top:1px solid #d6ded9;font-size:10px;color:#7a8a81;
  display:flex;justify-content:space-between;gap:14px}

.dnum{font-variant-numeric:tabular-nums}
.srcs-on .dnum{border-bottom:1.5px dotted #b08a1a;cursor:help;background:#fdf6dd}
.doc-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.doc-bar .spacer{flex:1}

/* ───────────────────────────────────────────────────────────────────────
   4h. STAGE 9 — quality check and the assistant
   ─────────────────────────────────────────────────────────────────────── */
.qs-head{display:grid;grid-template-columns:168px 1fr;gap:22px;align-items:center;
  background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:18px}
.qs-ring{position:relative;width:168px;height:120px;display:grid;place-items:center}
.qs-ring svg{position:absolute;inset:0;width:100%;height:100%}
.qs-ring b{font:700 38px/1 'Fraunces',serif;font-variant-numeric:tabular-nums}
.qs-ring s{text-decoration:none;font-size:11px;color:var(--ink-mute);display:block;text-align:center;
  margin-top:3px}
.qs-head p{margin:0 0 7px;font-size:13px;line-height:1.65;color:var(--ink-soft);max-width:68ch}
.qs-head p:last-child{margin-bottom:0}

.qf{background:var(--bg-card);border:1px solid var(--line);border-left-width:3px;
  border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;
  display:grid;grid-template-columns:1fr 188px;gap:16px;align-items:start}
.qf.high{border-left-color:var(--bad)} .qf.medium{border-left-color:var(--warn)}
.qf.low{border-left-color:var(--ink-mute)}
.qf.done{border-left-color:var(--ok);background:var(--ok-soft,#eaf5ee)}
.qf.ignored{opacity:.58}
.qf .qf-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.qf .qf-loc{font:600 11.5px/1 'JetBrains Mono',monospace;color:var(--ink)}
.qf .qf-i{font-size:13px;line-height:1.55;margin-bottom:7px}
.qf .qf-fix{font-size:12px;line-height:1.55;color:var(--ink-soft);
  background:var(--bg-muted);border-radius:8px;padding:9px 11px}
.qf .qf-fix b{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-mute);margin-bottom:3px}
.qf .qf-eff{font-size:11px;color:var(--ink-mute);line-height:1.5;margin-top:6px}
.qf .qf-act{display:flex;flex-direction:column;gap:7px}
.qf .qf-done-note{font-size:11.5px;line-height:1.5;color:var(--ok);display:flex;gap:6px}
.qf .qf-done-note i{margin-top:2px}

.ae{display:grid;grid-template-columns:1fr 266px;gap:18px;align-items:start}
.ae-pane{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;min-height:min(620px,72vh)}
.ae-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:13px}
.ae-msg{max-width:84%;font-size:13px;line-height:1.65;border-radius:13px;padding:11px 14px}
.ae-msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.ae-msg.it{align-self:flex-start;background:var(--bg-muted);border-bottom-left-radius:4px}
.ae-msg.it p{margin:0 0 8px} .ae-msg.it p:last-child{margin-bottom:0}
.ae-msg.it ul,.ae-msg.it ol{margin:0 0 8px;padding-left:19px}
.ae-msg.it li{margin-bottom:3px}
.ae-msg.it table{width:100%;border-collapse:collapse;font-size:11.5px;margin:4px 0 8px}
.ae-msg.it th,.ae-msg.it td{border:1px solid var(--line);padding:4px 7px;text-align:left}
.ae-msg.it th{background:var(--bg-card);font-size:10.5px}
.ae-msg.it td.n,.ae-msg.it th.n{text-align:right;font-variant-numeric:tabular-nums}
.ae-who{font:700 9.5px/1 'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-mute);margin-bottom:5px;display:flex;gap:5px;align-items:center}
.ae-dots{display:flex;gap:4px;padding:4px 0}
.ae-dots i{width:6px;height:6px;border-radius:50%;background:var(--ink-mute);
  animation:aeb 1s infinite ease-in-out}
.ae-dots i:nth-child(2){animation-delay:.14s} .ae-dots i:nth-child(3){animation-delay:.28s}
@keyframes aeb{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.ae-form{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:9px;align-items:flex-end}
.ae-form textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font:400 13px/1.5 'Inter',sans-serif;background:var(--bg);color:var(--ink);
  min-height:42px;max-height:120px}
.ae-form textarea:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:var(--brand)}
.ae-note{font-size:10.5px;color:var(--ink-mute);line-height:1.5;padding:0 14px 12px}
.ae-sugg h4{margin:0 0 9px;font:700 10px/1 'Inter',sans-serif;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-mute)}
.ae-chip{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg-card);
  border-radius:9px;padding:9px 11px;font:500 12px/1.45 'Inter',sans-serif;color:var(--ink-soft);
  cursor:pointer;margin-bottom:7px;transition:border-color .14s,color .14s}
.ae-chip:hover{border-color:var(--brand);color:var(--brand)}

/* ───────────────────────────────────────────────────────────────────────
   4i. STAGE 10 — inbox, settings, empty states
   ─────────────────────────────────────────────────────────────────────── */
.ib{display:grid;grid-template-columns:38px 1fr auto;gap:14px;align-items:start;
  background:var(--bg-card);border:1px solid var(--line);border-left-width:3px;
  border-radius:var(--radius);padding:14px 16px;margin-bottom:9px}
.ib.now{border-left-color:var(--bad)} .ib.week{border-left-color:var(--warn)}
.ib.later{border-left-color:var(--ink-mute)}
.ib-ic{width:38px;height:38px;border-radius:10px;background:var(--bg-muted);display:grid;
  place-items:center;font-size:16px;color:var(--ink-soft)}
.ib.now .ib-ic{background:var(--bad-soft,#fbe9e7);color:var(--bad)}
.ib-t{font:600 13.5px/1.4 'Inter',sans-serif;margin-bottom:4px;text-wrap:balance}
.ib-w{font-size:12px;line-height:1.55;color:var(--ink-soft);max-width:72ch}
.ib-r{display:flex;flex-direction:column;align-items:flex-end;gap:7px;white-space:nowrap}
.ib-due{font-size:11px;color:var(--ink-mute);font-variant-numeric:tabular-nums}

.empty{text-align:center;padding:46px 24px;background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius)}
.empty i{font-size:30px;color:var(--ink-mute);opacity:.6}
.empty h4{margin:12px 0 6px;font:700 15px/1.3 'Fraunces',serif}
.empty p{margin:0 auto;max-width:52ch;font-size:12.5px;line-height:1.65;color:var(--ink-soft)}

.perm{width:100%;border-collapse:collapse;font-size:12.5px}
.perm th,.perm td{padding:9px 11px;border-bottom:1px solid var(--line-soft);text-align:left}
.perm thead th{font:700 9.5px/1.3 'Inter',sans-serif;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-mute);background:var(--bg-muted);border-bottom:1px solid var(--line)}
.perm td.c,.perm th.c{text-align:center}
.perm tbody tr:hover{background:var(--bg-muted)}
.perm .yes{color:var(--ok)} .perm .ro{color:var(--info)} .perm .no{color:var(--line)}

.swatch{display:flex;gap:10px;align-items:center;margin-bottom:9px}
.swatch input[type="color"]{width:38px;height:30px;border:1px solid var(--line);border-radius:7px;
  background:none;padding:2px;cursor:pointer}
.swatch label{font-size:12.5px;flex:1}
.swatch code{font:500 11px/1 'JetBrains Mono',monospace;color:var(--ink-mute)}
.sb-mark.has-logo{background:#fff;padding:3px}
.sb-mark img{max-width:100%;max-height:100%;display:block;object-fit:contain}
.logo-drop:hover{border-color:var(--brand);color:var(--brand)}
.logo-drop{border:1.5px dashed var(--line);border-radius:10px;padding:20px;text-align:center;
  color:var(--ink-mute);font-size:12px;line-height:1.6}
.logo-drop i{font-size:20px;display:block;margin-bottom:6px}
.assumption{display:inline-flex;gap:5px;align-items:center;font-size:10.5px;font-weight:600;
  color:var(--warn);background:var(--warn-soft,#fbeed2);border-radius:5px;padding:2px 6px;
  margin-left:6px;vertical-align:middle}

/* ═══════════════════════════════════════════════════════════════════════════
   5. RESPONSIVE — sidebar collapses below 1100px (brief §1.7)
   ═══════════════════════════════════════════════════════════════════════════ */
/* 1366x768 is the laptop the demonstration runs on (brief §1.7). The sidebar
   stays at that width, so the working area is about 1130px — enough for two
   columns, but not for two columns that each carry a chart. These collapse
   the heaviest pairs rather than letting their contents squeeze. */
@media (max-width:1366px){
  .panel-grid{grid-template-columns:minmax(0,1fr)}
  .ae{grid-template-columns:minmax(0,1fr) 238px}
  .qf{grid-template-columns:minmax(0,1fr) 168px}
}
@media (max-width:1180px){
  .ae{grid-template-columns:minmax(0,1fr)}
  .ae-sugg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:7px}
  .ae-sugg h4{grid-column:1/-1}
  .ae-chip{margin-bottom:0}
  .var-row{grid-template-columns:76px minmax(0,1fr) 92px 72px;gap:9px}
}

/* Short screens: a 238px chart plus the topbar and a KPI row above it leaves
   very little on a 768px-high laptop. */
@media (max-height:780px){
  .chart-wrap{height:206px}
  .ae-pane{min-height:min(520px,70vh)}
}

@media (max-width:1100px){
  .app{grid-template-columns:minmax(0,1fr)}
  .content{grid-column:1}
  .sb{transform:translateX(-100%);transition:transform .2s ease}
  .sb.open{transform:none;box-shadow:var(--shadow-lg)}
  .tb-hamburger{display:block}
  .tb-search{display:none}
  #sb-backdrop{position:fixed;inset:0;z-index:35;background:rgba(11,31,23,.4);display:none}
  #sb-backdrop.open{display:block}
}
@media (max-width:860px){
  .main{padding:16px}
  .sel-lbl{display:none}
  .qf{grid-template-columns:minmax(0,1fr)}
  .qf .qf-act{flex-direction:row}
  .ib{grid-template-columns:34px minmax(0,1fr)}
  .ib-r{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}
  .var-row{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  .var-row .vr-t{grid-column:1/-1}
  .doc{padding:26px 22px}
  .qs-head{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}
  .donor-tabs button{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══════════════════════════════════════════════════════════════════════════
   6. PRINT — report preview only (brief §1.8)
   ═══════════════════════════════════════════════════════════════════════════ */
@media print{
  body{background:#fff}
  .sb,.tb,#toasts,#sb-backdrop,.no-print{display:none!important}
  .app{display:block}
  .content{grid-column:1}
  .main{padding:0;max-width:none}
  .modal-overlay{position:static;background:none;padding:0;display:block;overflow:visible}
  .modal{box-shadow:none;border-radius:0;max-width:none}
  .modal-head,.modal-foot{display:none}
  .view:not(.active){display:none}
}
</style>
</head>
<body>

<div id="sb-backdrop" data-action="close-sidebar"></div>

<div class="app">

  <!-- ══ SIDEBAR ══════════════════════════════════════════════════════ -->
  <aside class="sb" id="sidebar">
    <div class="sb-brand">
      <div class="sb-mark" id="sb-mark">FPC</div>
      <div>
        <div class="sb-brand-name">Future Planning<br>for the Child</div>
        <div class="sb-brand-sub">Powered by Eval360</div>
      </div>
    </div>
    <nav class="sb-scroll" id="sb-nav" aria-label="Main navigation"></nav>
    <div class="sb-foot">
      <button class="checkchip" data-action="show-checks" id="check-chip">
        <i class="bi bi-check-circle-fill"></i><span id="check-chip-text">Data checks</span>
      </button>
    </div>
  </aside>

  <!-- ══ CONTENT ══════════════════════════════════════════════════════ -->
  <div class="content">

    <header class="tb">
      <button class="tb-hamburger" data-action="open-sidebar" aria-label="Open navigation"><i class="bi bi-list"></i></button>
      <div class="tb-titles">
        <div class="tb-crumb" id="tb-crumb">Overview</div>
        <div class="tb-title" id="tb-title">Dashboard</div>
      </div>
      <div class="tb-tools">
        <div class="tb-search">
          <i class="bi bi-search"></i>
          <input type="search" id="tb-search" placeholder="Search" aria-label="Search">
        </div>
        <div class="sel-wrap">
          <span class="sel-lbl">Period</span>
          <select class="sel" id="period-sel" aria-label="Reporting period"></select>
        </div>
        <div class="sel-wrap">
          <span class="sel-lbl">Viewing as</span>
          <select class="sel" id="role-sel" aria-label="Viewing as"></select>
        </div>
        <div class="avatar" id="tb-avatar">AC</div>
      </div>
    </header>

    <main class="main" id="main"></main>
  </div>
</div>

<div class="modal-overlay" id="modal-root" data-action="modal-backdrop"></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   1. CONFIG & CLOCK
   The app clock is fixed so the demo always lands on the same moment:
   Q2 (Jul–Sep 2026) has just closed and its report is due. Brief §3.
   ═══════════════════════════════════════════════════════════════════════════ */
const TODAY = new Date('2026-10-05T00:00:00');

/* ═══════════════════════════════════════════════════════════════════════════
   2. SEEDED RANDOM — deterministic, so every reload is identical. Brief §6.
   ═══════════════════════════════════════════════════════════════════════════ */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260405);

/* ═══════════════════════════════════════════════════════════════════════════
   3. appData — THE single source of truth. No number is hardcoded in HTML.
   ═══════════════════════════════════════════════════════════════════════════ */
const appData = {

  /* ── Project context — brief §3 ─────────────────────────────────── */
  config: {
    org: {
      name:'Future Planning for the Child',
      short:'FPC',
      address:'P.O. Box 79, Karonga, Malawi',
      director:'Mr. Amos Chindamba',
      mealOfficer:'Liberty Alex Mwangosi'

/* ═══════════════════════════════════════════════════════════════════════════
   CONFIGURABLE FACTS — the three things only FPC can supply
   Brief §5 forbids inventing Malawian place names, so rather than guess them
   these are made editable in the product: FPC types or pastes its own
   registry, sets its own reporting rules and its own brand. Until then the
   codes and the assumptions show as exactly that.
   ═══════════════════════════════════════════════════════════════════════════ */

/* 1. NAMES. A display-name layer keyed by code, empty until FPC fills it.
      Everything renders through placeName(), so one entry changes every
      screen, every report and every export at once. */
appData.config.names = {};
function placeName(code){
  const n = appData.config.names[code];
  return n ? n : code;
}
function placeLabel(code){            // name with the code kept as a reference
  const n = appData.config.names[code];
  return n ? `${n} <span class="mono" style="color:var(--ink-mute);font-size:10.5px">${esc(code)}</span>` : esc(code);
}
function namedCount(){
  return Object.keys(appData.config.names).filter(k => appData.config.names[k]).length;
}
function namableCodes(){
  return [...appData.registry.villages.map(v => ({code:v.code, kind:'Village', gvh:v.gvh})),
          ...appData.registry.vcrcs.map(v => ({code:v.code, kind:'Child rights council', gvh:v.gvh})),
          ...appData.registry.cbccs.map(c => ({code:c.code, kind:'Childcare centre', gvh:c.gvh}))];
}

/* Paste a two-column list — code and name — and the whole registry is named
   in one go. Accepts commas or tabs, ignores a header row and blank lines. */
function importNames(text){
  const known = new Set(namableCodes().map(c => c.code));
  let set = 0, unknown = [];
  String(text).split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const parts = line.split(/[\t,;]/).map(x => x.trim().replace(/^"|"$/g,''));
    if (parts.length < 2) return;
    const [code, name] = parts;
    if (/^code$/i.test(code)) return;                      // header row
    if (!known.has(code)){ unknown.push(code); return; }
    if (name){ appData.config.names[code] = name; set++; }
  });
  return {set, unknown};
}

function addDays(iso, n){
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* The due date for a template in a period, from the calendar rule. */
function reportDue(templateId, periodId){
  const r = appData.config.calendar[templateId];
  if (!r || r.basis === 'none' || r.basis === 'activity') return null;
  if (r.basis === 'year'){
    const y = new Date(appData.config.project.start).getFullYear() + 1;
    return addDays(`${y}-03-31`, r.daysAfter);
  }
  const p = appData.periods.find(x => x.id === periodId);
  return p ? addDays(p.end, r.daysAfter) : null;
}

/* ── Child protection cases — brief §6.2 ───────────────────────────────────
   Constructed to hit the stated results exactly rather than sampled and
   hoped for, because SO2 / 2.1 / 2.2 / 2.4 / 2.5 / SO4 are all computed from
   this array and the brief fixes their values.
   Anonymised throughout: no names, short procedural notes, and sexual abuse
   appears only as a category with a referral record (brief §9).
   ──────────────────────────────────────────────────────────────────────── */
function seedCases(){
  // 49 records: Q1 21, Q2 25, Q3 3.
  const plan = [];

  // Status mix across the 46 in Q1+Q2 — brief §6.2.
  //   concluded 21 · closed-no-action 3 · under follow-up 10 · referred 8 · assessed 4
  const statuses = [
    ...Array(21).fill('Concluded'),
    ...Array(3).fill('Closed – no further action'),
    ...Array(10).fill('Under follow-up'),
    ...Array(8).fill('Referred'),
    ...Array(4).fill('Assessed')
  ];

  // Categories across all 49, weighted as the brief requires.
  const cats = [
    ...Array(11).fill('Neglect'),
    ...Array(10).fill('Physical violence'),
    ...Array(8).fill('Child labour'),
    ...Array(7).fill('Child marriage'),
    ...Array(5).fill('School dropout / denial of education'),
    ...Array(4).fill('Emotional abuse'),
    ...Array(3).fill('Sexual abuse'),
    ...Array(1).fill('Other')
  ];

  // Framework applied — ccpja total 19, by-law total 27 (brief §6.2).
  const frameworks = [
    ...Array(8).fill('both'),        // counts to both
    ...Array(11).fill('ccpja'),      // 11 + 8 = 19
    ...Array(19).fill('bylaw'),      // 19 + 8 = 27
    ...Array(8).fill('none')
  ];                                  // 46 total

  // Reporter types across 49; the 12 non-committee reports all sit in Q1+Q2.
  const reporters = [
    ...Array(12).fill('Non-committee community member'),
    ...Array(9).fill('VCRC child'),
    ...Array(10).fill('VCPC'),
    ...Array(6).fill('Parent'),
    ...Array(5).fill('Teacher'),
    ...Array(3).fill('HSA'),
    ...Array(2).fill('Self'),
    ...Array(2).fill('Anonymous')
  ];

  // Days to first response — 49 values with a median of exactly 3.
  const dtfr = [
    ...Array(8).fill(1), ...Array(10).fill(2), ...Array(9).fill(3),
    ...Array(7).fill(4), ...Array(5).fill(5), ...Array(4).fill(7),
    ...Array(3).fill(10), ...Array(3).fill(14)
  ];

  const notes = [
    'Home visit by VCPC; referred to DSWO; child re-enrolled at school.',
    'Mediation by GVH CPC under community by-law; follow-up visit scheduled.',
    'Referred to Police Victim Support Unit; DSWO case file opened.',
    'Assessed by HSA; nutrition support arranged through the CBCC.',
    'Guardian counselled by parenting group; child returned to household.',
    'Reported by VCRC; VCPC verified; matter referred to the chief.',
    'Case conferenced at the quarterly case management meeting.',
    'Referred for psychosocial support; progress reviewed at 6 weeks.',
    'School reinstatement negotiated with the head teacher and PTA.',
    'Referred to DSWO for specialist attention beyond community capacity.'
  ];

  // Deterministic shuffle so the mix looks natural but never changes.
  const shuffle = arr => {
    const a = arr.slice();
    for (let i=a.length-1;i>0;i--){ const j = Math.floor(rand()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  };

  const catsQ  = shuffle(cats);
  const repQ   = shuffle(reporters.slice(0,46)).concat(reporters.slice(46));
  const dtfrQ  = shuffle(dtfr);
  const statQ  = shuffle(statuses);
  const frameQ = shuffle(frameworks);

  // GVH and sex are pinned per quarter so the §10 narrative example holds:
  // Q2 = 25 cases, MK 14 / MJ 11, 11 boys / 14 girls.
  const quarters = [
    {period:'2026-Q1', n:21, mk:11, boys:10, from:'2026-04-02', to:'2026-06-28'},
    {period:'2026-Q2', n:25, mk:14, boys:11, from:'2026-07-03', to:'2026-09-29'},
    {period:'2026-Q3', n:3,  mk:2,  boys:1,  from:'2026-10-01', to:'2026-10-04'}
  ];

  const ages = ['0–5','6–12','13–17'];
  let idx = 0, disabilityLeft = 3;      // ~7% of the 46
  const cases = [];

  quarters.forEach(q => {
    const d0 = new Date(q.from).getTime(), d1 = new Date(q.to).getTime();
    for (let i=0;i<q.n;i++){
      const gvh  = i < q.mk ? 'MK' : 'MJ';
      const sex  = i < q.boys ? 'M' : 'F';
      const isQ3 = q.period === '2026-Q3';
      const status = isQ3 ? (i === 0 ? 'Assessed' : 'Reported') : statQ[idx];
      const reported = new Date(d0 + Math.floor(rand()*(d1-d0)));
      const resp = isQ3 ? 1 + Math.floor(rand()*3) : dtfrQ[idx];

      // Conclusion dates: 7 of the Q1 cohort close inside Q1, the rest in Q2.
      let closed = null;
      if (status === 'Concluded' || status === 'Closed – no further action'){
        // Exactly 7 of the 21 Concluded close inside Q1, which leaves 14
        // concluding during Q2 — the figure the §10 narrative quotes. The
        // quota counts Concluded only; closed-no-further-action is a
        // different outcome and must not eat into it.
        const q1Early = q.period === '2026-Q1' && status === 'Concluded' && cases.filter(c =>
          c.status === 'Concluded' && c.closedDate && c.closedDate <= '2026-06-30').length < 7;
        const base = q1Early ? new Date('2026-05-20').getTime() : new Date('2026-07-15').getTime();
        const span = q1Early ? 40*864e5 : 75*864e5;
        closed = new Date(base + Math.floor(rand()*span)).toISOString().slice(0,10);
      }

      const pssGiven = !isQ3 && (status === 'Concluded' || status === 'Under follow-up');
      const village = `${gvh}-V${1 + Math.floor(rand()*(gvh==='MK'?8:7))}`;
      const disability = !isQ3 && disabilityLeft > 0 && rand() < 0.07
        ? (disabilityLeft--, true) : false;

      cases.push({
        id:`FPC-CP-2026-${String(cases.length+1).padStart(4,'0')}`,   // Q3 continues the series
        dateReported: reported.toISOString().slice(0,10),
        period:q.period, gvh, village, sex,
        ageBand: ages[Math.floor(rand()*3)],
        disability,
        category: isQ3 ? catsQ[46+i] : catsQ[idx],
        reportedBy: isQ3 ? repQ[46+i] : repQ[idx],
        status,
        referredTo: ['Referred','Under follow-up','Concluded'].includes(status)
          ? (rand() < .6 ? ['DSWO'] : (rand() < .5 ? ['DSWO','Police VSU'] : ['Health (HSA)']))
          : [],
        frameworkApplied: isQ3 ? 'none' : frameQ[idx],
        pssProvided: false,          // set below, to hit exactly 18
        pssOutcome: null,
        daysToFirstResponse: resp,
        closedDate: closed,
        note: notes[idx % notes.length],
        timeline:[]
      });
      if (!isQ3) idx++;
    }
  });

  // PSS: exactly 18 of the 46, of which 13 improved (brief §6.2).
  const pssPool = cases.filter(c => c.period !== '2026-Q3' &&
    (c.status === 'Concluded' || c.status === 'Under follow-up'));
  pssPool.slice(0,18).forEach((c,i) => {
    c.pssProvided = true;
    c.pssOutcome = i < 13 ? 'Improved' : (i < 16 ? 'No change' : 'Pending');
    c.referralTimely = i < 15;
  });

  // Timeline entries, built from what each case already holds.
  cases.forEach(c => {
    c.timeline.push({date:c.dateReported, event:`Reported by ${c.reportedBy}`});
    const respDate = new Date(new Date(c.dateReported).getTime() + c.daysToFirstResponse*864e5)
      .toISOString().slice(0,10);
    c.timeline.push({date:respDate, event:'First response — VCPC assessment visit'});
    if (c.referredTo.length) c.timeline.push({date:respDate, event:`Referred to ${c.referredTo.join(', ')}`});
    if (c.pssProvided)       c.timeline.push({date:respDate, event:'Psychosocial support commenced'});
    if (c.closedDate)        c.timeline.push({date:c.closedDate, event:`Case ${c.status.toLowerCase()}`});
  });

  appData.cases = cases;
}

/* Activity costs were hand-authored for plausible relative shape; the brief
   fixes the donor totals (§6.6). This scales the shape onto those totals and
   gives the largest activity the rounding remainder, so check 7 — activity
   costs sum to reported spend — holds exactly rather than approximately. */
function calibrateCosts(){
  const fx = appData.config.fx;
  const targets = [
    {fund:a => a.fund === 'knh',                periods:['2026-Q1','2026-Q2'], mwk: 27340 * fx.EUR_MWK},
    {fund:a => a.fund.startsWith('cssf'),       periods:['2026-Q2'],           mwk:  7820 * fx.GBP_MWK}
  ];
  targets.forEach(t => {
    const set = appData.activities.filter(a => t.fund(a) && t.periods.includes(a.period) && a.actualCost > 0);
    const current = set.reduce((s,a) => s + a.actualCost, 0);
    if (!current) return;
    const k = t.mwk / current;
    set.forEach(a => {
      a.plannedCost = Math.round(a.plannedCost * k / 1000) * 1000;
      a.actualCost  = Math.round(a.actualCost  * k / 1000) * 1000;
    });
    // Remainder onto the largest line, so the sum is exact.
    const diff = t.mwk - set.reduce((s,a) => s + a.actualCost, 0);
    if (diff) set.sort((x,y) => y.actualCost - x.actualCost)[0].actualCost += diff;
  });
}

/* ── Indicators — brief §4 data model ──────────────────────────────────────
   Built from the logframe so the two can never diverge. Indicators whose
   value depends on cases or by-law submissions are marked `computed` and
   calculated live, which is what makes a case status change move the
   dashboard (brief §4, §11.2).
   ──────────────────────────────────────────────────────────────────────── */
function seedIndicators(){
  const L = appData.logframe;
  const out = [];

  // Which indicators are computed, and from what.
  const COMPUTED = {
    'SO2':'cases', '2.1':'cases', '2.2':'cases', '2.4':'cases', '2.5':'cases',
    'SO4':'cases', '4.1':'cases', '4.3.1':'cases', '2.1.1':'cases',
    '2.3':'bylaws', '2.3.1':'bylaws',
    'OO-b':'cbcc', '3.1':'cbcc', '3.3':'cbcc', '3.3.2':'cbcc', '3.3.3':'cbcc',
    '1.1.2':'vcrc', '1.3.3':'csc'
  };

  // The four indicators carrying a Phase I baseline — brief §4.
  const BASELINES = {'SO1':38, 'SO2':29, 'OO-a':210, '3.1':35};

  const parseTarget = txt => {
    if (!txt) return {unit:'qualitative', target:null};
    const pc = txt.match(/(\d{1,3})\s?%/);
    if (pc) return {unit:'percent', target:+pc[1]};
    const n = txt.match(/^(\d[\d,]*)\s/) || txt.match(/\b(\d[\d,]*)\b/);
    return n ? {unit:'number', target:+n[1].replace(/,/g,'')} : {unit:'qualitative', target:null};
  };

  const add = (code, level, statement, text, linkedTo) => {
    if (!text) return;
    const t = parseTarget(text);
    out.push({
      code, level, statement, text,
      unit:t.unit, target:t.target,
      baseline: BASELINES[code] ?? null,
      frequency: level === 'output' ? 'Quarterly' : 'Annual',
      // Means of verification. FPC's logframe states it for the objective
      // levels and leaves it blank below them — which is finding QC12, so the
      // gap is carried here rather than papered over with a default.
      source: level === 'sub_objective' || level === 'overall_objective'
        ? 'Progress reports; meeting minutes; partner data' : '',
      disaggregation:['sex','age_band','gvh'],
      linkedTo,
      computed: COMPUTED[code] || null,
      results: []
    });
  };

  L.overallObjective.indicators.forEach(i => add(i.code,'overall_objective',L.overallObjective.statement,i.text,'OO'));
  L.nodes.forEach(n => {
    add(n.code, n.level, n.statement, n.indicator, n.parent);
    if (n.strayIndicator) add(n.strayIndicator.belongsTo + '-stray', n.level, n.statement,
                              n.strayIndicator.text, n.parent);
  });

  // Stored results for the indicators that are not computed live.
  // Seeded only where an activity genuinely produced a figure this far in.
  const STORED = {
    '1.1.1': [{period:'2026-Q1', num:132, den:150}, {period:'2026-Q2', num:138, den:150}],
    '1.2.1': [{period:'2026-Q2', num:96,  den:150}],
    '1.2.3': [{period:'2026-Q1', num:1,   den:6},   {period:'2026-Q2', num:2,  den:6}],
    '1.3.1': [{period:'2026-Q2', num:12,  den:100}],
    '2.2.1': [{period:'2026-Q2', num:62,  den:80}],
    '2.2.2': [{period:'2026-Q1', num:40,  den:40}],
    '2.5.1': [{period:'2026-Q1', num:2,   den:4},   {period:'2026-Q2', num:4,  den:4}],
    '3.1.1': [{period:'2026-Q2', num:0,   den:200, comment:'Training scheduled for Q3.'}],
    '3.3.1': [{period:'2026-Q2', num:48,  den:60}],
    'OO-a':  [{period:'2026-Q1', num:400, den:1350},{period:'2026-Q2', num:843, den:1350}]
  };
  out.forEach(i => {
    if (STORED[i.code]) {
      i.results = STORED[i.code].map(r => Object.assign({
        value: r.den ? Math.round(r.num / r.den * 1000)/10 : r.num,
        evidence: []
      }, r));
    }
  });

  appData.indicators = out;
}

/* ═══════════════════════════════════════════════════════════════════════════
   5. CALCULATORS
   Every figure on every screen comes through one of these. If a number
   appears twice, both screens call the same function (brief §1.3).
