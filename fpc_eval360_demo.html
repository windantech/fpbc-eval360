/* The project runs 12 quarters from 1 Apr 2026. The seeded reporting periods
   cover the first three; the rest exist so the workplan can show the shape of
   the whole project rather than only the part that has happened. */
function projectQuarters(){
  const out = []; let y = 2026, m = 3;                      // April 2026, 0-indexed
  for (let i=0;i<12;i++){
    const start = new Date(y, m + i*3, 1);
    const end   = new Date(y, m + i*3 + 3, 0);
    out.push({
      n:i+1,
      year:Math.floor(i/4)+1, q:(i%4)+1,
      label:`Y${Math.floor(i/4)+1} Q${(i%4)+1}`,
      range:`${start.toLocaleDateString('en-GB',{month:'short'})}–${end.toLocaleDateString('en-GB',{month:'short',year:'2-digit'})}`,
      periodId: i<3 ? `2026-Q${i+1}` : null,
      elapsed: i < appData.config.quartersElapsed,
      current: i === appData.config.quartersElapsed
    });
  }
  return out;
}

const QUARTER_ORDER = ['2026-Q1','2026-Q2','2026-Q3'];
const upTo = period => QUARTER_ORDER.slice(0, QUARTER_ORDER.indexOf(period) + 1);

/* Target groups — derived from activity attendance, never typed (brief §6.1). */
function calcTargetGroups(period){
  const cum = upTo(period);
  const blank = () => ({m:0, mPwd:0, f:0, fPwd:0});
  const rows = GROUPS.map(g => ({
    key:g.key, label:g.label, source:g.source || 'attendance',
    planned:blank(), reached:blank(), cumulative:blank()
  }));
  const byKey = Object.fromEntries(rows.map(r => [r.key, r]));

  appData.activities.forEach(a => {
    const inPeriod = a.period === period;
    const inCum    = cum.includes(a.period);
    (a.planned || []).forEach(x => {
      if (inPeriod && byKey[x.group]) {
        byKey[x.group].planned.m += x.m; byKey[x.group].planned.mPwd += x.mPwd;
        byKey[x.group].planned.f += x.f; byKey[x.group].planned.fPwd += x.fPwd;
      }
    });
    (a.attendance || []).forEach(x => {
      if (!byKey[x.group]) return;
      if (inPeriod){ byKey[x.group].reached.m += x.m; byKey[x.group].reached.mPwd += x.mPwd;
                     byKey[x.group].reached.f += x.f; byKey[x.group].reached.fPwd += x.fPwd; }
      if (inCum)   { byKey[x.group].cumulative.m += x.m; byKey[x.group].cumulative.mPwd += x.mPwd;
                     byKey[x.group].cumulative.f += x.f; byKey[x.group].cumulative.fPwd += x.fPwd; }
    });
  });

  // Children in CBCCs is enrolment, not attendance — it is a standing
  // population, so quarterly and cumulative are the same figure.
  const r = byKey.cbcc_children;
  const em = appData.registry.cbccs.reduce((s,c) => s + c.enrolledMale, 0);
  const ef = appData.registry.cbccs.reduce((s,c) => s + c.enrolledFemale, 0);
  r.reached = {m:em, mPwd:0, f:ef, fPwd:0};
  r.cumulative = {m:em, mPwd:0, f:ef, fPwd:0};
  r.planned = {m:400, mPwd:0, f:410, fPwd:0};     // enrolment target for the quarter

  rows.forEach(row => {
    row.varianceComment = (appData.varianceComments || {})[row.key] || '';
    row.plannedTotal    = row.planned.m + row.planned.f;
    row.reachedTotal    = row.reached.m + row.reached.f;
    row.cumulativeTotal = row.cumulative.m + row.cumulative.f;
    row.achievement     = row.plannedTotal ? Math.round(row.reachedTotal / row.plannedTotal * 1000)/10 : null;
    row.needsVariance   = row.achievement !== null && row.achievement < 80;
  });
  return rows;
}

/* Case statistics — the engine behind SO2, 2.1, 2.2, 2.4, 2.5, SO4 and 4.1. */
function calcCaseStats(filter){
  filter = filter || {};
  let c = appData.cases.filter(x => x.period !== '2026-Q3' || filter.includeQ3);
  if (filter.period) c = c.filter(x => x.period === filter.period);
  if (filter.gvh)    c = c.filter(x => x.gvh === filter.gvh);
  if (filter.category) c = c.filter(x => x.category === filter.category);

  const concluded   = c.filter(x => x.status === 'Concluded');
  const closedNoAct = c.filter(x => x.status === 'Closed – no further action');
  const followedUp  = c.filter(x => ['Concluded','Closed – no further action','Under follow-up'].includes(x.status));
  const ccpja       = c.filter(x => x.frameworkApplied === 'ccpja' || x.frameworkApplied === 'both');
  const bylaw       = c.filter(x => x.frameworkApplied === 'bylaw' || x.frameworkApplied === 'both');
  const pss         = c.filter(x => x.pssProvided);
  const pssImproved = pss.filter(x => x.pssOutcome === 'Improved');
  const nonCommittee= c.filter(x => x.reportedBy === 'Non-committee community member');

  const resp = c.map(x => x.daysToFirstResponse).sort((a,b)=>a-b);
  const median = resp.length ? (resp.length % 2
    ? resp[(resp.length-1)/2]
    : (resp[resp.length/2 - 1] + resp[resp.length/2]) / 2) : 0;

  const byCategory = {}, byStatus = {}, byGvh = {}, bySex = {};
  c.forEach(x => {
    byCategory[x.category] = (byCategory[x.category]||0)+1;
    byStatus[x.status]     = (byStatus[x.status]||0)+1;
    byGvh[x.gvh]           = (byGvh[x.gvh]||0)+1;
    bySex[x.sex]           = (bySex[x.sex]||0)+1;
  });

  return {
    total:c.length, cases:c,
    concluded:concluded.length, closedNoAction:closedNoAct.length,
    followedUp:followedUp.length,
    ccpja:ccpja.length, bylaw:bylaw.length,
    pss:pss.length, pssImproved:pssImproved.length,
    nonCommittee:nonCommittee.length,
    disability:c.filter(x => x.disability).length,
    medianResponse:median,
    referredInPeriod:c.filter(x => x.referredTo.length).length,
    // Cases that reached Concluded *within* the period. Closed-no-further-action
    // is a different outcome and is counted separately.
    concludedInPeriod:appData.cases.filter(x => x.status === 'Concluded' && x.closedDate &&
      (!filter.period || periodOf(x.closedDate) === filter.period)).length,
    byCategory, byStatus, byGvh, bySex,
    pct:{
      concluded: c.length ? Math.round(concluded.length/c.length*1000)/10 : 0,
      followedUp:c.length ? Math.round(followedUp.length/c.length*1000)/10 : 0,
      ccpja:     c.length ? Math.round(ccpja.length/c.length*1000)/10 : 0,
      bylaw:     c.length ? Math.round(bylaw.length/c.length*1000)/10 : 0,
      pss:       c.length ? Math.round(pss.length/c.length*1000)/10 : 0,
      pssImproved: pss.length ? Math.round(pssImproved.length/pss.length*1000)/10 : 0
    }
  };
}

function periodOf(dateStr){
  const m = new Date(dateStr).getMonth();          // 0-indexed
  if (m >= 3 && m <= 5)  return '2026-Q1';
  if (m >= 6 && m <= 8)  return '2026-Q2';
  return '2026-Q3';
}

/* By-law compliance per GVH, from the 9-question checklist. */
function calcBylawScore(gvh){
  const subs = appData.bylawSubmissions.filter(s => !gvh || s.gvh === gvh);
  if (!subs.length) return {score:0, trend:[]};
  const scoreOf = s => Math.round(
    s.answers.reduce((t,a) => t + (a==='yes'?1:a==='partly'?0.5:0), 0) / s.answers.length * 1000)/10;
  const trend = subs.map(s => ({id:s.id, gvh:s.gvh, date:s.date, score:scoreOf(s)}));
  return {score: trend[trend.length-1].score, trend,
          casesHandled: subs.reduce((t,s) => t + s.casesHandled, 0)};
}

  {key:'admin',     label:'Office and administration'}

/* Ordered rules — the first match wins, so "monitoring visit" is transport
   before "monitoring" could read as a meeting. */
function costLineOf(a){
  const t = (a.title || '').toLowerCase();
  if (/radio|media/.test(t))                                    return 'media';
  if (/visit|monitoring/.test(t))                               return 'transport';
  if (/training|refresher|orientation|train /.test(t))          return 'training';
  if (/awareness|commemoration|games|sensitisation|campaign|football|theatre|painting/.test(t))
                                                                return 'community';
  if (/meeting|scoping|identification|research|matrix|dissemination/.test(t))
                                                                return 'meetings';
  return 'materials';
}

/* Which activities count as reported spend for a fund. Q3 is under way and
   unreported, so it is excluded — the figure on screen is the figure in the
   donor report. */
function reportedActivities(fund){
  const periods = fund === 'knh' ? ['2026-Q1','2026-Q2'] : ['2026-Q2'];
  return appData.activities.filter(a => a.fund === fund && periods.includes(a.period));
}

/* Costs that are not an activity — salaries, rent, utilities — are posted to
   the expense ledger against a fund and a budget line. They count towards
   spend exactly as activity costs do, under the same reporting periods. */
function reportedExpenses(fund){
  const periods = fund === 'knh' ? ['2026-Q1','2026-Q2'] : ['2026-Q2'];
  return (appData.expenses || []).filter(e => e.fund === fund && periods.includes(e.period));
}
const reportedSpend = fund => reportedActivities(fund).concat(reportedExpenses(fund));

function calcBudgetLines(fund){
  const b  = appData.budget[fund];
  const fx = fund === 'knh' ? appData.config.fx.EUR_MWK : appData.config.fx.GBP_MWK;
  const actual = {};
  reportedSpend(fund).forEach(a => {
    actual[a.costLine] = (actual[a.costLine] || 0) + (a.actualCost || 0);
  });

  const elapsed = b.monthsElapsed / b.monthsTotal;
  const rows = COST_LINES.filter(l => b.lines[l.key] !== undefined || actual[l.key])
    .map(l => {
      const plan   = b.lines[l.key] || 0;
      const toDate = Math.round(plan * elapsed);
      const mwk    = actual[l.key] || 0;
      const spent  = Math.round(mwk / fx);
      return {key:l.key, label:l.label, plan, planToDate:toDate, mwk, spent,
              note:(b.notes || {})[l.key] || '',
              pctOfPlan: plan ? Math.round(spent / plan * 1000)/10 : null,
              variance:  toDate ? Math.round((spent - toDate) / toDate * 1000)/10 : null,
              posted: mwk > 0};
    });

  const mwkTotal = rows.reduce((t,r) => t + r.mwk, 0);
  return {rows, currency:b.currency, scope:b.scope, elapsedPct: Math.round(elapsed*1000)/10,
          planTotal:b.total, planToDate:Math.round(b.total*elapsed),
          mwkTotal, spentTotal: Math.round(mwkTotal / fx), fx,
          unposted: rows.filter(r => r.plan > 0 && !r.posted)};
}

/* Burn rate: cumulative plan against cumulative actual, by month. The plan
   line is the allocation spread evenly; the actual line stops at the end of
   the last reported period, because nothing after it has been reported. */
function calcBurn(fund){
  const b   = appData.budget[fund];
  const fx  = fund === 'knh' ? appData.config.fx.EUR_MWK : appData.config.fx.GBP_MWK;
  const start = fund === 'knh' ? new Date('2026-04-01') : new Date('2026-07-01');
  const labels = [], months = [];
  for (let i = 0; i < b.monthsTotal; i++){
    const d = new Date(start.getFullYear(), start.getMonth() + i, 1);
    months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
    labels.push(d.toLocaleDateString('en-GB',{month:'short'}) +
                (d.getMonth() === 0 ? ' ' + String(d.getFullYear()).slice(2) : ''));
  }
  const byMonth = {};
  reportedSpend(fund).forEach(a => {
    const m = (a.date || '').slice(0,7);
    byMonth[m] = (byMonth[m] || 0) + (a.actualCost || 0);
  });

  let run = 0;
  const actual = months.map((m,i) => {
    run += (byMonth[m] || 0);
    return i < b.monthsElapsed ? Math.round(run / fx) : null;
  });
  const plan = months.map((_,i) => Math.round(b.total * (i+1) / b.monthsTotal));
  return {labels, plan, actual, lastReported: labels[b.monthsElapsed - 1]};
}

/* Activity-level cost variance. The brief flags anything outside 15%. */
const VARIANCE_FLAG = 15;
function calcCostVariances(){
  return ['knh','cssf_restricted','cssf_unrestricted']
    .flatMap(f => reportedActivities(f))
    .filter(a => (a.plannedCost || 0) > 0)
    .map(a => {
      const v = Math.round((a.actualCost - a.plannedCost) / a.plannedCost * 1000)/10;
      return {activity:a, variance:v, abs:Math.abs(a.actualCost - a.plannedCost),
              flagged: Math.abs(v) > VARIANCE_FLAG};
    })
    .sort((x,y) => (y.flagged - x.flagged) || (y.abs - x.abs));
}

/* Community Score Card step progress, read off the activity register.
   Step n is logframe activity 1.3.1.n; an activity for 'Both' counts for
   each GVH. Derived rather than stored, so marking the dissemination
   activity done advances the stepper with no second entry. */
function calcCscProgress(gvh){
  const steps = appData.csc.steps;
  const doneStep = n => appData.activities.some(a =>
    a.code === `1.3.1.${n}` && a.status === 'done' &&
    (a.gvh === 'Both' || a.gvh === gvh || a.gvh === GVH_NAME[gvh]));
  let done = 0;
  while (done < steps.length && doneStep(done + 1)) done++;
  return {service: appData.csc.services[gvh], done,
          inProgress: Math.min(done + 1, steps.length)};
}

/* One indicator's current value, from whichever source drives it. */
function calcIndicator(code, period){
  const ind = appData.indicators.find(i => i.code === code);
  if (!ind) return null;
  period = period || currentPeriod.id;

  let num = null, den = null, value = null, note = '';

  if (ind.computed === 'cases'){
    const s = calcCaseStats({});                       // cumulative, Q1+Q2
    const map = {
      'SO2':  [s.concluded, s.total, 'Cases followed to completion'],
      '2.1':  [s.followedUp, s.total, 'Cases exposed, investigated and followed up'],
      '2.2':  [s.ccpja, s.total, 'Cases handled under the CCPJA'],
      '2.4':  [s.concluded, s.total, 'Cases concluded by the CCPS'],
      '2.5':  [s.followedUp, s.total, 'Cases following the case management system'],
      'SO4':  [s.pss, s.total, 'Child survivors receiving PSS'],
      '4.1':  [s.pssImproved, s.pss, 'Children receiving PSS showing improved well-being'],
      '4.3.1':[s.cases.filter(c=>c.referralTimely).length, s.pss, 'Referred cases receiving timely support'],
      '2.1.1':[s.nonCommittee, s.total, 'Reports from non-committee community members']
    };
    if (map[ind.code]) { [num, den, note] = map[ind.code]; }
  } else if (ind.computed === 'bylaws'){
    const b = calcBylawScore();
    value = b.score; note = 'Mean of the 9-question checklist across both GVHs';
  } else if (ind.computed === 'cbcc'){
    const cb = appData.registry.cbccs;
    if (ind.code === 'OO-b'){ num = cb.reduce((s,c)=>s+c.enrolledMale+c.enrolledFemale,0); den = null; note='Children enrolled in CBCCs'; }
    if (ind.code === '3.1' || ind.code === '3.3'){ num = cb.filter(c=>c.qualityScore>=70).length; den = cb.length; note='CBCCs meeting minimum quality standards'; }
    if (ind.code === '3.3.2'){ num = cb.reduce((s,c)=>s+c.transitionedToPrimary,0); den = cb.reduce((s,c)=>s+c.enrolledMale+c.enrolledFemale,0); note='Children transitioning to primary school'; }
    if (ind.code === '3.3.3'){ num = cb.filter(c=>c.supportVisitDone).length; den = cb.length; note='CBCCs assessed through support visits'; }
  } else if (ind.computed === 'vcrc'){
    const v = appData.registry.vcrcs;
    num = v.filter(x => x.codeOfConduct === 'in_use').length; den = v.length;
    note = 'VCRCs with a code of conduct in use';
  } else if (ind.computed === 'csc'){
    num = appData.csc.agreedActions.filter(a => a.status === 'delivered').length; den = null;
    note = 'Community actions influenced through the scorecard';
  } else {
    const rs = ind.results.filter(r => upTo(period).includes(r.period));
    if (rs.length){ const last = rs[rs.length-1]; num = last.num; den = last.den; note = last.comment || ''; }
  }

  if (value === null && num !== null) {
    value = den ? Math.round(num/den*1000)/10 : num;
  }

  const status = indicatorStatus(ind, value);
  return {indicator:ind, num, den, value, note, status,
          expectedByNow: expectedByNow(ind)};
}

/* The milestone an indicator should have reached by now (brief §2 bands).
   Unit decides the shape, and this distinction matters:
     number  — a count accumulates, so pro-rate it over elapsed quarters.
               "1,350 children reached" at quarter 2 of 12 expects 225.
     percent — a rate does not accumulate. "70% of cases followed to
               completion" is expected to hold every quarter once the system
               works, so the milestone is the target itself. Pro-rating it
               would mark a project on-track for achieving 12% of a rate. */
function expectedByNow(ind){
  if (ind.target === null) return null;
  if (ind.unit === 'percent') return ind.target;
  const q = appData.config.project.quarters, el = appData.config.quartersElapsed;
  return Math.round(ind.target * (el / q) * 10)/10;
}

/* Brief §2 status language. Measured against the period milestone, not the
   end target, so an early-stage project is not painted uniformly red. */
function indicatorStatus(ind, value){
  if (ind.target === null) return {key:'qualitative', label:'Qualitative', tone:'info', icon:'bi-chat-square-text'};
  if (value === null || value === undefined) return {key:'not_started', label:'Not started', tone:'grey', icon:'bi-dash-circle'};
  const expected = expectedByNow(ind);
  if (!expected) return {key:'not_started', label:'Not started', tone:'grey', icon:'bi-dash-circle'};
  const ratio = value / expected;
  if (ratio >= 0.9) return {key:'on_track', label:'On track', tone:'ok',   icon:'bi-check-circle-fill'};
  if (ratio >= 0.6) return {key:'watch',    label:'Watch',    tone:'warn', icon:'bi-exclamation-triangle-fill'};
  return {key:'behind', label:'Behind', tone:'bad', icon:'bi-x-circle-fill'};
}

function calcAllIndicators(period){
  return appData.indicators.map(i => calcIndicator(i.code, period)).filter(Boolean);
}

/* Budget — brief §6.6. */
function calcBudget(donor){
  const f = appData.finance, fx = appData.config.fx;
  if (donor === 'knh'){
    const util = Math.round(f.knh.spentEUR / f.knh.year1Budget * 1000)/10;
    return {currency:'EUR', total:f.knh.totalPhase, budget:f.knh.year1Budget,
            spent:f.knh.spentEUR, spentMWK:f.knh.spentMWK, utilisation:util,
            timeElapsed:f.knh.timeElapsedPct,
            verdict: util < f.knh.timeElapsedPct - 5 ? 'Under-spending, watch'
                   : util > f.knh.timeElapsedPct + 10 ? 'Over-spending, watch' : 'On plan'};
  }
  const util = Math.round(f.cssf.spentQuarterGBP / f.cssf.receivedQuarterGBP * 1000)/10;
  return {currency:'GBP', total:f.cssf.contractGBP, received:f.cssf.receivedQuarterGBP,
          spent:f.cssf.spentQuarterGBP, spentMWK:f.cssf.spentMWK,
          restrictedMWK:f.cssf.restrictedMWK, unrestrictedMWK:f.cssf.unrestrictedMWK,
          utilisation:util, verdict: util > 100 ? 'Overspent against receipts' : 'On plan'};
}

/* Report completeness — filled required items over total required. */
function calcCompleteness(templateId){
  const t = appData.reportTemplates[templateId];
  if (!t) return {pct:0, missing:[]};
  const required = [], missing = [];

  /* What a section actually needs is decided by what it is about, not by its
     number — the six templates number the same topics differently, and a
     section called "SUCCESS STORY" needs the same thing as one called
     "Case study". Getting this wrong silently reports a document as complete. */
  t.sections.forEach(s => {
    if (!s.no && !s.block) return;
    required.push(s.title);
    const title = (s.title || '').toLowerCase();
    const add = msg => missing.push(`${s.title} — ${msg}`);

    if (/target group/.test(title)){
      const rows = calcTargetGroups(currentPeriod.id);
      const n = rows.filter(r => r.needsVariance && !r.varianceComment).length;
      if (n) add(`${n === 1 ? 'a' : n} variance explanation${n===1?'':'s'} required`);
    }
    if (/indicator/.test(title)){
      const n = appData.indicators.filter(i => i.baseline === null).length;
      if (n) add(`${n} indicators have no baseline`);
    }
    if (/photo|visual|annex/.test(title)){
      const n = appData.evidence.filter(e => !e.consent).length;
      if (n) add(`${n} photo${n===1?'':'s'} without consent on file`);
    }
    if (/case stud|success story|human interest/.test(title)){
      // A per-activity report tells the story of that activity, from its own
      // record. A period report draws on the tagged story library.
      const ok = t.frequency === 'per-activity'
        ? appData.activities.some(a => a.fund.startsWith('cssf') && a.quote)
        : appData.stories.some(st => st.usedIn.includes(templateId));
      if (!ok) add('no case study tagged to this report');
    }
    if (/challenge/.test(title)){
      const src = t.frequency === 'per-activity'
        ? true
        : appData.activities.some(a => a.period === currentPeriod.id && a.challenges);
      if (!src) add('no challenge recorded against any activity this period');
    }
    if (/annex|financ|budget|expenditure/.test(title)){
      const unposted = ['knh','cssf_restricted','cssf_unrestricted']
        .flatMap(f => calcBudgetLines(f).unposted.map(l => l.label));
      if (unposted.length) add(`${unposted.length} budget lines not yet posted`);
    }
  });

  const pct = required.length
    ? Math.round((required.length - new Set(missing.map(m => m.split(' — ')[0])).size)
        / required.length * 100) : 0;
  return {pct, missing, required:required.length};
}

/* Logframe quality score — brief §7.18. Starts at 72 of 100. */
function calcQualityScore(){
  /* Only an APPLIED fix improves the score. Choosing to ignore a finding is a
     legitimate decision, but the weakness is still in the logframe, so it
     still costs — otherwise a team could reach 100 by dismissing everything. */
  const open = appData.qualityFindings.filter(f => f.state !== 'applied');
  // Weights are not arbitrary: with 3 high, 6 medium and 4 low findings these
  // are the only values that put the opening score at 72 AND make a single
  // high-severity fix worth exactly +3, which is the 72 -> 75 demo moment in
  // brief §11.5. Changing the finding mix means re-solving them.
  const weight = {high:3, medium:2.5, low:1};
  const lost = open.reduce((t,f) => t + weight[f.severity], 0);
  return {score: Math.round((100 - lost) * 10) / 10,
          open:open.length, total:appData.qualityFindings.length};
}

/* Apply one suggested fix — brief §7.18 and §11.5. Mutates the logframe where
   the finding describes a concrete change, so the tree updates too. */
function applyQualityFix(id){
  const f = appData.qualityFindings.find(x => x.id === id);
  if (!f || f.state !== 'open') return null;

  const node = code => appData.logframe.nodes.find(n => n.code === code);

  /* appData.indicators was built FROM the logframe at seed time, so editing a
     node alone leaves the indicator list, the reports and the CSV exports
     showing the old wording — the fix would only half-land. Both are updated
     together, through this one helper. */
  const setIndicatorText = (code, fn) => {
    const n = node(code);
    if (n && n.indicator) n.indicator = fn(n.indicator);
    const i = appData.indicators.find(x => x.code === code);
    if (i) i.text = fn(i.text);
  };

  if (id === 'QC1') setIndicatorText('3.2.1', x => x.replace('by April 2026','by March 2029'));
  if (id === 'QC2') setIndicatorText('3.3.2', x => x.replace('by April 2026','by March 2029'));
  /* QC3 — a baseline of zero is a fact, not a guess, for an indicator that
     counts something the project itself creates. A percentage or a
     behaviour-change indicator genuinely needs a survey, so those are left
     alone and the finding says so rather than inventing a number. */
  if (id === 'QC3'){
    let set = 0;
    appData.indicators.forEach(i => {
      if (i.baseline === null && i.unit === 'number' &&
          (i.level === 'output' || i.level === 'use_of_output')){ i.baseline = 0; set++; }
    });
    f.applied = `${set} indicators given a baseline of 0. ` +
      `${appData.indicators.filter(i => i.baseline === null).length} still need a baseline survey.`;
  }

  /* QC12 — the means of verification is knowable from whatever already drives
     the indicator, so it is filled from that rather than left to be typed. */
  if (id === 'QC12'){
    const src = {cases:'Case register (anonymised)', bylaws:'By-laws monitoring checklist',
                 cbcc:'CBCC support visit records', vcrc:'VCRC meeting records',
                 csc:'Community score card documentation'};
    let set = 0;
    appData.indicators.forEach(i => {
      if (i.source) return;
      i.source = src[i.computed] || 'Activity reports and attendance registers';
      set++;
    });
    f.applied = `Means of verification set on ${set} indicators.`;
  }

  /* QC13 — one spelling, applied wherever it appears. */
  if (id === 'QC13'){
    let n = 0;
    appData.logframe.nodes.forEach(x => {
      ['statement','indicator'].forEach(k => {
        if (x[k] && x[k].includes('Mwakasangila')){
          x[k] = x[k].replace(/Mwakasangila/g, 'Mwakasangira'); n++;
        }
      });
    });
    appData.indicators.forEach(i => {
      ['statement','text'].forEach(k => {
        if (i[k] && i[k].includes('Mwakasangila')) i[k] = i[k].replace(/Mwakasangila/g,'Mwakasangira');
      });
    });
    f.applied = `Spelling corrected in ${n} logframe row${n===1?'':'s'}.`;
  }

  if (f.movesStray){                       // QC7 and QC10 relocate an indicator
    const from = node(f.movesStray);
    if (from && from.strayIndicator){
      const target = from.strayIndicator.belongsTo;
      const to = node(target);
      if (to){
        to.indicator = from.strayIndicator.text;
        /* The stray was seeded under its own code; moving it means that record
           becomes the target output's indicator rather than a loose one. */
        const stray = appData.indicators.find(x => x.code === target + '-stray');
        if (stray){ stray.code = target; stray.statement = to.statement; }
        delete from.strayIndicator;
        f.applied = `Indicator moved from ${f.movesStray} to ${target}, in the logframe and in the indicator list.`;
      }
    }
  }
  f.state = 'applied';
  /* Where Eval360 cannot make the change itself — aligning two targets, adding
     an activity, writing a measurable indicator — applying records the decision
     rather than claiming to have done it. Saying so is the whole point. */
  if (!f.applied) f.applied = 'Recorded for the next logframe revision. ' +
    'This one needs a decision from FPC rather than an edit Eval360 can make.';
  // Clear the row flags so the amber triangle disappears from the logframe tree.
  appData.logframe.nodes.forEach(n => {
    if (n.flags) n.flags = n.flags.filter(x => x !== id);
  });
  return calcQualityScore();
}

/* ═══════════════════════════════════════════════════════════════════════════
   6. CONSISTENCY CHECKS — brief §13. 24 checks, run at boot.
   ═══════════════════════════════════════════════════════════════════════════ */
function runConsistencyChecks(){
  const results = [];
  const check = (name, got, want, note) => {
    const pass = JSON.stringify(got) === JSON.stringify(want);
    results.push({name, pass, got, want, note});
  };

  const reg = appData.registry, tg = calcTargetGroups('2026-Q2'), s = calcCaseStats({});
  const row = k => tg.find(r => r.key === k);

  // Registry
  check('VCRC count is 15', reg.vcrcs.length, 15);
  check('VCRC members total 150', reg.vcrcs.reduce((t,v)=>t+v.members,0), 150);
  check('VCRC split is 74 boys / 76 girls',
        [reg.vcrcs.reduce((t,v)=>t+v.male,0), reg.vcrcs.reduce((t,v)=>t+v.female,0)], [74,76]);
  check('CBCC count is 20', reg.cbccs.length, 20);
  check('CBCC caregivers total 60', reg.cbccs.reduce((t,c)=>t+c.caregivers,0), 60);
  check('CBCC committee members total 200', reg.cbccs.reduce((t,c)=>t+c.committeeMembers,0), 200);
  check('CBCC enrolment is 812 (401 / 411)',
        [reg.cbccs.reduce((t,c)=>t+c.enrolledMale,0), reg.cbccs.reduce((t,c)=>t+c.enrolledFemale,0)], [401,411]);
  check('Talking walls painted so far: 0', reg.cbccs.filter(c=>c.talkingWallPainted).length, 0);
  check('CBCC support visits done: 12 of 20', reg.cbccs.filter(c=>c.supportVisitDone).length, 12);

  // Cases
  check('Cases Q1 = 21', appData.cases.filter(c=>c.period==='2026-Q1').length, 21);
  check('Cases Q2 = 25', appData.cases.filter(c=>c.period==='2026-Q2').length, 25);
  check('Cases to 30 Sep = 46', s.total, 46);
  check('Concluded = 21', s.concluded, 21);
  check('Followed up (2.1a) = 34', s.followedUp, 34);
  check('Handled under CCPJA = 19', s.ccpja, 19);
  check('Handled under by-laws = 27', s.bylaw, 27);
  check('Received PSS = 18', s.pss, 18);
  check('PSS improved = 13', s.pssImproved, 13);
  check('Non-committee reports = 12', s.nonCommittee, 12);
  check('Median days to first response = 3', s.medianResponse, 3);
  check('Concluded inside Q1 = 7', appData.cases.filter(c =>
    c.status === 'Concluded' && c.closedDate && c.closedDate <= '2026-06-30').length, 7);
  check('Concluded during Q2 = 14', calcCaseStats({period:'2026-Q2'}).concludedInPeriod, 14);

  // Target groups — derived from activity attendance (brief §6.1)
  check('Q2 reached, general children = 204 / 239', [row('general_children').reached.m, row('general_children').reached.f], [204,239]);
  check('Q2 reached, community structures = 84 / 119', [row('community_structures').reached.m, row('community_structures').reached.f], [84,119]);
  check('Q2 reached, caregivers = 4 / 56', [row('caregivers').reached.m, row('caregivers').reached.f], [4,56]);
  check('Q2 reached, extension workers = 0 / 0', [row('extension_workers').reached.m, row('extension_workers').reached.f], [0,0]);
  check('Q2 reached, district stakeholders = 7 / 5', [row('district_stakeholders').reached.m, row('district_stakeholders').reached.f], [7,5]);
  check('Cumulative, general children = 391 / 452', [row('general_children').cumulative.m, row('general_children').cumulative.f], [391,452]);
  check('Cumulative, community structures = 151 / 207', [row('community_structures').cumulative.m, row('community_structures').cumulative.f], [151,207]);
  check('Cumulative, extension workers = 9 / 7', [row('extension_workers').cumulative.m, row('extension_workers').cumulative.f], [9,7]);
  check('Cumulative, district stakeholders = 12 / 9', [row('district_stakeholders').cumulative.m, row('district_stakeholders').cumulative.f], [12,9]);
  check('Q2 planned totals match the KNH table',
        GROUPS.filter(g=>g.key!=='cbcc_children').map(g=>row(g.key).plannedTotal),
        [450, 200, 60, 25, 14]);

  // Cumulative never below quarterly
  const cumOk = tg.every(r => r.cumulativeTotal >= r.reachedTotal);
  check('Cumulative >= quarterly for every group', cumOk, true);

  // Finance
  const knhSum = appData.activities.filter(a=>a.fund==='knh' && a.period!=='2026-Q3')
    .reduce((t,a)=>t+(a.actualCost||0),0);
  check('KNH activity costs sum to reported spend', knhSum, appData.finance.knh.spentMWK);
  const cssfSum = appData.activities.filter(a=>a.fund.startsWith('cssf') && a.period==='2026-Q2')
    .reduce((t,a)=>t+(a.actualCost||0),0);
  check('CSSF Q2 activity costs sum to reported spend', cssfSum, appData.finance.cssf.spentMWK);
  check('KNH spend to date = EUR 27,340', appData.finance.knh.spentEUR, 27340);
  check('CSSF Q2 spend = GBP 7,820',      appData.finance.cssf.spentQuarterGBP, 7820);

  // Logframe integrity
  const codes = new Set(appData.logframe.nodes.map(n=>n.code));
  const badCodes = appData.activities.filter(a=>!codes.has(a.code)).map(a=>a.code);
  check('Every activity code exists in the logframe', badCodes, []);
  const noTarget = appData.indicators.filter(i=>i.unit!=='qualitative' && i.target===null).map(i=>i.code);
  check('Every quantitative indicator has a target', noTarget, []);
  const noUnit = appData.indicators.filter(i=>!i.unit).map(i=>i.code);
  check('Every indicator has a unit', noUnit, []);

  // Actions and evidence
  check('Actions: 11 closed, 4 open, 2 overdue',
        ['closed','open','overdue'].map(s2=>appData.actions.filter(a=>a.status===s2).length), [11,4,2]);
  check('By-law submissions: 3 per GVH',
        ['MK','MJ'].map(g=>appData.bylawSubmissions.filter(b=>b.gvh===g).length), [3,3]);
  check('Scorecard actions delivered = 3', appData.csc.agreedActions.filter(a=>a.status==='delivered').length, 3);
  check('Scorecard steps complete: 3 of 9 in each GVH',
        ['MK','MJ'].map(g=>calcCscProgress(g).done), [3,3]);
  check('Field form library covers 9 instruments', Object.keys(appData.fieldForms).length, 9);
  // Budget — brief §6.6 and §7.16
  check('Budget lines sum to each fund allocation',
        ['knh','cssf_restricted','cssf_unrestricted'].map(f =>
          Object.values(appData.budget[f].lines).reduce((t,v)=>t+v,0) - appData.budget[f].total),
        [0,0,0]);
  check('Budget line actuals sum to reported spend',
        ['knh','cssf_restricted','cssf_unrestricted'].map(f => calcBudgetLines(f).mwkTotal),
        [appData.finance.knh.spentMWK, appData.finance.cssf.restrictedMWK,
         appData.finance.cssf.unrestrictedMWK]);
  check('Every reported activity carries a budget line',
        appData.activities.filter(a => !COST_LINE_LABEL[a.costLine]).map(a => a.id), []);
  check('CSSF restricted + unrestricted = GBP 7,820',
        calcBudgetLines('cssf_restricted').spentTotal + calcBudgetLines('cssf_unrestricted').spentTotal,
        7820);
  check('One activity outside the 15% cost-variance threshold',
        calcCostVariances().filter(v => v.flagged).map(v => v.activity.id), ['ACT-026']);
  check('Quality findings = 13', appData.qualityFindings.length, 13);
  check('Quality score starts at 72', calcQualityScore().score, 72);
  /* Behavioural: brief §11.5 requires one high-severity fix to read 72 -> 75.
     Applying a fix EDITS the logframe, the indicator list and the findings, so
     the probe runs inside a full snapshot of all three and restores them
     afterwards. Restoring only the parts a particular fix happens to touch has
     now failed twice — once leaving QC1's deadline silently corrected at boot,
     and again when the fix was extended to update the indicator records. A
     whole-state restore cannot be outgrown by the next change. */
  const snap = JSON.stringify({f:appData.qualityFindings, n:appData.logframe.nodes,
                               i:appData.indicators});
  const before = calcQualityScore().score;
  const probe  = applyQualityFix('QC1');
  check('Applying one high fix raises 72 -> 75', [before, probe && probe.score], [72, 75]);
  const back = JSON.parse(snap);
  appData.qualityFindings = back.f;
  appData.logframe.nodes  = back.n;
  appData.indicators      = back.i;
  check('The boot check leaves the logframe exactly as it found it',
        [calcQualityScore().score,
         appData.logframe.nodes.find(n => n.code === '3.2.1').indicator.includes('April 2026'),
         appData.indicators.find(i => i.code === '3.2.1').text.includes('April 2026'),
         (appData.logframe.nodes.find(n => n.code === '3.2.1').flags || []).join(),
         !!appData.logframe.nodes.find(n => n.code === '3.1.1').strayIndicator],
        [72, true, true, 'QC1', true]);

  const failures = results.filter(r => !r.pass);
  return {passed:results.length - failures.length, total:results.length, failures, results, pending:false};
}

const esc = v => String(v ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const num  = v => Number(v ?? 0).toLocaleString('en-GB');
const fmtDate = d => new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

function chip(text, tone='grey', icon){
  return `<span class="chip ${tone}">${icon?`<i class="bi ${icon}"></i>`:''}${esc(text)}</span>`;
}

// Chart.js instances must be destroyed before a view re-renders (brief §12).
const charts = {};
function destroyCharts(){
  Object.keys(charts).forEach(k => { try{ charts[k].destroy(); }catch(e){} delete charts[k]; });
}

/* ── Toast ─────────────────────────────────────────────────────────────── */
function toast(msg, tone='ok'){
  const icons = {ok:'bi-check-circle-fill', warn:'bi-exclamation-triangle-fill', bad:'bi-x-circle-fill'};
  const el = document.createElement('div');
  el.className = `toast ${tone}`;
  el.innerHTML = `<i class="bi ${icons[tone]||icons.ok}"></i><div>${esc(msg)}</div>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .2s'; setTimeout(()=>el.remove(),200); }, 3600);
}

/* ── Modal ─────────────────────────────────────────────────────────────── */
function openModal({title, body, foot='', wide=false}){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal${wide?' wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-head">
        <h3>${esc(title)}</h3>
        <button class="modal-x no-print" data-action="close-modal" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">${body}</div>
      ${foot ? `<div class="modal-foot no-print">${foot}</div>` : ''}
    </div>`;
  root.classList.add('open');
}
function closeModal(){
  const root = document.getElementById('modal-root');
  root.classList.remove('open');
  root.innerHTML = '';
}

/* Charts must be built after innerHTML lands, so renderers queue them here
   and showView() mounts them. Keeps renderers pure string-builders. */
let pendingMounts = [];
const afterRender = fn => pendingMounts.push(fn);

function statusChip(st){ return chip(st.label, st.tone, st.icon); }

function progressBar(pct, tone){
  const w = Math.max(0, Math.min(100, pct || 0));
  return `<div class="prog"><i class="${tone||''}" style="width:${w}%"></i></div>`;
}

/* Inline SVG sparkline — no library needed for two or three points. */
function sparkline(values, w=78, h=22){
  const v = values.filter(x => x !== null && x !== undefined);
  if (v.length < 2) return `<svg class="spark" width="${w}" height="${h}"></svg>`;
  const max = Math.max(...v, 1), min = Math.min(...v, 0);
  const span = (max - min) || 1;
  const pts = v.map((x,i) => `${(i/(v.length-1))*(w-4)+2},${h-2-((x-min)/span)*(h-6)}`).join(' ');
  const last = pts.split(' ').pop().split(',');
  return `<svg class="spark" width="${w}" height="${h}" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="var(--brand)" stroke-width="1.6"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.4" fill="var(--brand)"/></svg>`;
}

function kpiTile(label, value, sub, tone){
  return `<div class="kpi">
    <div class="k-lbl">${esc(label)}</div>
    <div class="k-val"${tone?` style="color:var(--${tone})"`:''}>${value}</div>
    ${sub?`<div class="k-sub">${sub}</div>`:''}</div>`;
}

const GVH_NAME = {MK:'Mwakasangira', MJ:'Mwanjasi', KL:'Kilupula', Both:'Both GVHs'};
const pct = (n,d) => d ? Math.round(n/d*1000)/10 : 0;

/* Chart.js defaults pulled from the tokens so charts match the page. */
/* Chart colours come from the same tokens as everything else, so recolouring
   the brand recolours the charts. The fallbacks matter: the user guide builds
   these configurations outside the page, where the tokens cannot be read. */
const CHART_FALLBACK = {'--ink-soft':'#3b4d5c', '--ink-mute':'#6b7d8a', '--line-soft':'#e1e8ee',
  '--brand':'#0d4d2a', '--accent':'#d9822b', '--ok':'#1f7a45', '--warn':'#c97a0e',
  '--bad':'#a32424', '--info':'#0e7490'};
function chartTheme(){
  let cs = null;
  try { cs = getComputedStyle(document.documentElement); } catch(e){}
  const t = k => {
    const v = cs ? String(cs.getPropertyValue(k) || '').trim() : '';
    return v || CHART_FALLBACK[k];
  };
  return {ink:t('--ink-soft'), mute:t('--ink-mute'), line:t('--line-soft'),
          brand:t('--brand'), accent:t('--accent'), ok:t('--ok'), warn:t('--warn'),
          bad:t('--bad'), info:t('--info')};
}
function chartConfig(cfg){
  const T = chartTheme();
  cfg.options = Object.assign({
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:false}, tooltip:{enabled:true}},
    scales:{x:{grid:{display:false}, ticks:{color:T.mute, font:{size:10}}},
            y:{grid:{color:T.line}, ticks:{color:T.mute, font:{size:10}}, beginAtZero:true}}
  }, cfg.options || {});
  return cfg;
}
function mountChart(id, cfg){
  const el = document.getElementById(id);
  if (!el || !window.Chart) return;
  charts[id] = new Chart(el, chartConfig(cfg));
}

    events.push({date:c2.closedDate, icon:'bi-shield-check', text:`Case ${c2.status.toLowerCase()}`, sub:`${c2.id} · ${GVH_NAME[c2.gvh]}`}));
  events.sort((a,b) => b.date.localeCompare(a.date));

  const feed = `
    <div class="card"><div class="card-head"><h3>Recent activity</h3></div><div class="card-body" style="padding-top:4px">
      ${events.slice(0,8).map(e => `<div class="feed-item">
        <div class="f-ic"><i class="bi ${e.icon}"></i></div>
        <div style="flex:1;min-width:0"><div>${esc(e.text)}</div><div class="f-d">${esc(e.sub)} · ${fmtDate(e.date)}</div></div>
      </div>`).join('')}
    </div></div>`;

  /* ── Stylised GVH map — inline SVG, no external tiles ──────────────── */
  const gvhMap = ['MK','MJ'].map(g => {
    const vc = appData.registry.vcrcs.filter(v=>v.gvh===g);
    const cb = appData.registry.cbccs.filter(c2=>c2.gvh===g);
    const dots = [...vc.map((v,i)=>({x:22+(i%5)*34, y:34+Math.floor(i/5)*30, ok:v.functionality>=70, t:'VCRC'})),
                  ...cb.map((c2,i)=>({x:22+(i%5)*34, y:96+Math.floor(i/5)*26, ok:c2.qualityScore>=70, t:'CBCC'}))];
    return `<svg viewBox="0 0 200 150" role="img" aria-label="${GVH_NAME[g]} structures">
      <rect x="4" y="4" width="192" height="142" rx="8" fill="var(--muted)" stroke="var(--line)"/>
      <text x="12" y="20" font-size="10" font-weight="700" fill="var(--ink-soft)">${GVH_NAME[g]}</text>
      <text x="12" y="${32}" font-size="7.5" fill="var(--ink-mute)">VCRCs</text>
      <text x="12" y="${94}" font-size="7.5" fill="var(--ink-mute)">CBCCs</text>
      ${dots.map(d=>`<circle cx="${d.x}" cy="${d.y}" r="5" fill="${d.ok?'var(--ok)':'var(--warn)'}"
        stroke="var(--card)" stroke-width="1.2"><title>${d.t} — ${d.ok?'meeting standard':'needs support'}</title></circle>`).join('')}
    </svg>`;
  }).join('');

  const mapCard = `
    <div class="card"><div class="card-head"><h3>Structures by GVH</h3>
      <span style="font-size:11px;color:var(--ink-mute)">
        ${chip('meets standard','ok')} ${chip('needs support','warn')}</span></div>
      <div class="card-body"><div class="gvh-map">${gvhMap}</div></div></div>`;

  return hero
    + `<div class="dash-top"><div>${kpis}</div><div>${cta}</div></div>`
    + `<div class="sec-title">Sub-objectives</div>
       <div class="sec-sub">Progress against the milestone expected at ${c.quartersElapsed} of ${c.project.quarters} quarters.</div>
       <div class="so-grid">${soCards}</div>`
    + chartPanels
    + `<div class="panel-grid">${alerts}${feed}</div>`
    + mapCard;
}

function soShort(code){
  return {SO1:'Child Rights Councils and child-led advocacy',
          SO2:'Community child protection system',
          SO3:'CBCCs and Early Childhood Development',
          SO4:'Psychosocial support'}[code] || code;
}
function shortGroup(k){
  return {general_children:'Children', cbcc_children:'CBCC children',
          community_structures:'Structures', caregivers:'Caregivers',
          extension_workers:'Extension', district_stakeholders:'District'}[k] || k;
}
/* Is `code` somewhere beneath `ancestor` in the logframe? */
function descendsFrom(code, ancestor){
  const nodes = appData.logframe.nodes;
  let cur = nodes.find(n => n.code === code.replace('-stray',''));
  let guard = 0;
  while (cur && guard++ < 8){
    if (cur.parent === ancestor) return true;
    cur = nodes.find(n => n.code === cur.parent);
  }
  return false;
}

/* ═══════════════════════════════════════════════════════════════════════════
   8d. LOGFRAME — brief §7.2. Tree and FPC's own four-column matrix.
   ═══════════════════════════════════════════════════════════════════════════ */
let logframeMode = 'tree';
let lfOpen = new Set(['SO1','SO2','SO3','SO4']);

function renderLogframe(){
  const L = appData.logframe;
  const toolbar = `
    <div class="lf-toolbar">
      <button class="fpill ${logframeMode==='tree'?'on':''}" data-action="lf-mode" data-mode="tree">Tree</button>
      <button class="fpill ${logframeMode==='matrix'?'on':''}" data-action="lf-mode" data-mode="matrix">Matrix view</button>
      <span style="flex:1"></span>
      <button class="btn btn-sm" data-action="lf-expand">Expand all</button>
      <button class="btn btn-sm" data-action="lf-collapse">Collapse all</button>
      <button class="btn btn-sm" data-action="lf-export"><i class="bi bi-download"></i> Export logframe (.doc)</button>
    </div>`;

  const header = `
    <div class="sec-title">Logframe</div>
    <div class="sec-sub">FPC's own hierarchy, including the <strong>Use of Output</strong> level between
      Outcome and Output. The grey tag beside each row is Eval360's generic level.</div>`;

  const body = logframeMode === 'tree' ? logframeTree() : logframeMatrix();
  return header + toolbar + body;
}

function lfLevelTag(level){
  const l = appData.config.levelLabels[level];
  return l ? `<span class="lf-tag">${esc(l.generic)}</span>` : '';
}

function lfNodeRow(n, hasKids){
  const ind = calcIndicator(n.code, currentPeriod.id);
  const open = lfOpen.has(n.code);
  const flags = (n.flags||[]).filter(f =>
    appData.qualityFindings.some(q => q.id === f && q.state === 'open'));
  const kidCount = appData.logframe.nodes.filter(x => x.parent === n.code).length;

  return `<div class="lf-node lf-lvl-${n.level}">
    <div class="lf-row ${hasKids?'clickable':''}" ${hasKids?`data-action="lf-toggle" data-code="${esc(n.code)}"`:''}>
      ${hasKids ? `<button class="lf-tw" aria-label="Toggle"><i class="bi bi-chevron-${open?'down':'right'}"></i></button>`
                : '<span class="lf-tw"></span>'}
      <span class="lf-code">${esc(n.code)}</span>
      <div class="lf-body">
        <div class="lf-stmt">${esc(n.statement)}${lfLevelTag(n.level)}</div>
        ${n.indicator ? `<div class="lf-ind"><i class="bi bi-bullseye"></i> ${esc(n.indicator)}</div>` : ''}
        ${n.indicator === null && n.level !== 'activity'
          ? `<div class="lf-ind" style="color:var(--warn)"><i class="bi bi-dash-circle"></i> No indicator on this row</div>` : ''}
        ${n.strayIndicator ? `<div class="lf-ind" style="color:var(--warn)">
            <i class="bi bi-arrow-return-right"></i> Also carries ${esc(n.strayIndicator.belongsTo)}'s indicator: ${esc(n.strayIndicator.text)}</div>` : ''}
      </div>
      <div class="lf-right">
        ${flags.length ? `<i class="bi bi-exclamation-triangle-fill lf-warn"
            title="${esc(flags.map(f => (appData.qualityFindings.find(q=>q.id===f)||{}).issue).join(' · '))}"></i>` : ''}
        ${kidCount ? `<span class="lf-tag">${kidCount}</span>` : ''}
        ${ind && ind.value !== null ? statusChip(ind.status) : ''}
      </div>
    </div>
    ${hasKids && open ? `<div class="lf-children">${lfChildren(n.code)}</div>` : ''}
  </div>`;
}

function lfChildren(parent){
  return appData.logframe.nodes.filter(n => n.parent === parent)
    .map(n => lfNodeRow(n, appData.logframe.nodes.some(x => x.parent === n.code)))
    .join('');
}

function logframeTree(){
  const L = appData.logframe;
  return `<div class="card">
    <div class="lf-node">
      <div class="lf-row"><span class="lf-tw"></span><span class="lf-code">Goal</span>
        <div class="lf-body"><div class="lf-stmt">${esc(L.goal.statement)}${lfLevelTag('goal')}</div></div></div>
    </div>
    <div class="lf-node">
      <div class="lf-row"><span class="lf-tw"></span><span class="lf-code">Overall</span>
        <div class="lf-body">
          <div class="lf-stmt">${esc(L.overallObjective.statement)}${lfLevelTag('overall_objective')}</div>
          ${L.overallObjective.indicators.map(i => {
            const r = calcIndicator(i.code, currentPeriod.id);
            return `<div class="lf-ind"><i class="bi bi-bullseye"></i> ${esc(i.text)} — target ${num(i.target)}
              ${r && r.value!==null ? `· <strong>${r.value}${i.unit==='percent'?'%':''}</strong> ${statusChip(r.status)}` : ''}</div>`;
          }).join('')}
        </div></div>
    </div>
    ${lfChildren('OO')}
  </div>`;
}

/* FPC's own four-column table, so they recognise it instantly. */
function logframeMatrix(){
  const L = appData.logframe;
  const rows = [];
  const push = (n, cls) => {
    const stray = n.strayIndicator
      ? `<div style="margin-top:6px;color:var(--warn)"><em>${esc(n.strayIndicator.text)}</em>
         <span class="lf-tag">belongs to ${esc(n.strayIndicator.belongsTo)}</span></div>` : '';
    rows.push(`<tr class="${cls}">
      <td><span class="m-code">${esc(n.code)}</span>${esc(n.statement)}</td>
      <td>${n.indicator ? esc(n.indicator) : '<span style="color:var(--warn)">—</span>'}${stray}</td>
      <td>${esc(n.mov || '')}</td>
      <td>${esc(n.assumptions || '')}</td>
    </tr>`);
  };

  rows.push(`<tr class="r-sub"><td><span class="m-code">GOAL</span>${esc(L.goal.statement)}</td><td></td><td></td><td></td></tr>`);
  rows.push(`<tr class="r-sub"><td><span class="m-code">OVERALL OBJECTIVE</span>${esc(L.overallObjective.statement)}</td>
    <td>${L.overallObjective.indicators.map(i=>`${esc(i.text)} — ${num(i.target)}`).join('<br>')}</td><td></td><td></td></tr>`);

  ['SO1','SO2','SO3','SO4'].forEach(so => {
    const n = L.nodes.find(x => x.code === so);
    push(n, 'r-sub');
    L.nodes.filter(x => x.parent === so).forEach(uoo => {
      push(uoo, 'r-uoo');
      L.nodes.filter(x => x.parent === uoo.code).forEach(out => {
        push(out, '');
        L.nodes.filter(x => x.parent === out.code).forEach(act => push(act, ''));
      });
    });
  });

  return `<div class="card"><div class="tbl-scroll"><table class="lf-matrix">
    <thead><tr><th style="width:34%">Intervention logic</th><th style="width:30%">Indicators</th>
      <th style="width:20%">Means of verification</th><th style="width:16%">Assumptions</th></tr></thead>
    <tbody>${rows.join('')}</tbody></table></div></div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   8e. INDICATORS — brief §7.3
   ═══════════════════════════════════════════════════════════════════════════ */
let indFilter = {so:'', level:'', status:'', computed:false, noBaseline:false};

function renderIndicators(){
  const p = currentPeriod;
  const all = calcAllIndicators(p.id);
  const noBase = appData.indicators.filter(i => i.baseline === null).length;

  let list = all;
  if (indFilter.so)     list = list.filter(i => i.indicator.code === indFilter.so || descendsFrom(i.indicator.code, indFilter.so));
  if (indFilter.level)  list = list.filter(i => i.indicator.level === indFilter.level);
  if (indFilter.status) list = list.filter(i => i.status.key === indFilter.status);
  if (indFilter.computed)   list = list.filter(i => i.indicator.computed);
  if (indFilter.noBaseline) list = list.filter(i => i.indicator.baseline === null);

  const banner = noBase ? `
    <div class="banner info">
      <i class="bi bi-info-circle-fill"></i>
      <div><strong>Baselines not yet recorded for ${noBase} indicators.</strong>
        FPC's logframe carries no baseline column, so progress cannot yet be expressed as change.
        Set them now, or import from the Phase I endline.</div>
      <button class="btn btn-sm" data-action="toast" data-msg="Baseline import from the Phase I endline would run here.">Import</button>
    </div>` : '';

  const filters = `
    <div class="filterbar">
      <select data-action="ind-filter" data-key="so">
        <option value="">All sub-objectives</option>
        ${['SO1','SO2','SO3','SO4'].map(s=>`<option value="${s}" ${indFilter.so===s?'selected':''}>${s} — ${esc(soShort(s))}</option>`).join('')}
      </select>
      <select data-action="ind-filter" data-key="level">
        <option value="">All levels</option>
        ${[['overall_objective','Overall objective'],['sub_objective','Sub-objective'],
           ['use_of_output','Use of Output'],['output','Output']]
          .map(([v,l])=>`<option value="${v}" ${indFilter.level===v?'selected':''}>${l}</option>`).join('')}
      </select>
      <select data-action="ind-filter" data-key="status">
        <option value="">Any status</option>
        ${[['on_track','On track'],['watch','Watch'],['behind','Behind'],
           ['not_started','Not started'],['qualitative','Qualitative']]
          .map(([v,l])=>`<option value="${v}" ${indFilter.status===v?'selected':''}>${l}</option>`).join('')}
      </select>
      <button class="fpill ${indFilter.computed?'on':''}" data-action="ind-toggle" data-key="computed">Live-computed only</button>
      <button class="fpill ${indFilter.noBaseline?'on':''}" data-action="ind-toggle" data-key="noBaseline">Missing baseline</button>
      <span style="flex:1"></span>
      <span style="font-size:11.5px;color:var(--ink-mute)">${list.length} of ${all.length} indicators</span>
    </div>`;

  // Grouped by sub-objective, in logframe order.
  const groups = [['OO','Overall objective'],['SO1',soShort('SO1')],['SO2',soShort('SO2')],
                  ['SO3',soShort('SO3')],['SO4',soShort('SO4')]];
  const body = groups.map(([code,label]) => {
    const rows = list.filter(i => code === 'OO'
      ? i.indicator.level === 'overall_objective'
      : (i.indicator.code === code || descendsFrom(i.indicator.code, code)));
    if (!rows.length) return '';
    return `<tr class="grp"><td colspan="11">${esc(code)} — ${esc(label)}</td></tr>`
      + rows.map(r => indicatorRow(r)).join('');
  }).join('');

  return `<div class="sec-title">Indicators</div>
    <div class="sec-sub">Percentages are captured as numerator and denominator, never typed.
      Rows marked <em>live</em> are computed from case, by-law or registry data as it changes.</div>
    ${banner}${filters}
    <div class="card"><div class="tbl-scroll"><table class="dt">
      <thead><tr>
        <th>Code</th><th>Indicator</th><th>Unit</th><th class="n">Baseline</th><th class="n">Target</th>
        <th class="n">Q1</th><th class="n">Q2</th><th class="n">Current</th><th class="n">% of target</th>
        <th>Status</th><th>Source</th>
      </tr></thead>
      <tbody>${body || '<tr><td colspan="11" style="text-align:center;padding:24px;color:var(--ink-mute)">No indicators match these filters.</td></tr>'}</tbody>
    </table></div></div>`;
}

function indicatorRow(r){
  const i = r.indicator;
  const q = p2 => {
    if (i.computed) return p2 === '2026-Q2' ? fmtVal(r.value, i.unit) : periodVal(i, p2);
    return periodVal(i, p2);
  };
  const ofTarget = (r.value !== null && i.target) ? Math.round(r.value/i.target*1000)/10 : null;
  return `<tr class="clickable" data-action="ind-open" data-code="${esc(i.code)}">
    <td class="mono">${esc(i.code)}</td>
    <td>${esc(i.text.slice(0,96))}${i.text.length>96?'…':''}
      ${i.computed?`<span class="lf-tag">live · ${esc(i.computed)}</span>`:''}</td>
    <td>${esc(i.unit)}</td>
    <td class="n">${i.baseline !== null ? num(i.baseline) : chip('None','info')}</td>
    <td class="n">${i.target !== null ? num(i.target) + (i.unit==='percent'?'%':'') : '—'}</td>
    <td class="n">${q('2026-Q1')}</td>
    <td class="n">${q('2026-Q2')}</td>
    <td class="n"><strong>${fmtVal(r.value, i.unit)}</strong></td>
    <td class="n">${ofTarget !== null ? ofTarget+'%' : '—'}</td>
    <td>${statusChip(r.status)}</td>
    <td style="font-size:11px;color:var(--ink-mute)">${esc(i.source)}</td>
  </tr>`;
}
const fmtVal = (v,unit) => v === null || v === undefined ? '—' : num(v) + (unit==='percent'?'%':'');
function periodVal(i, period){
  const res = i.results.find(x => x.period === period);
  return res ? fmtVal(res.value, i.unit) : '—';
}

/* ── Indicator detail ──────────────────────────────────────────────────── */
function renderIndicatorDetail(code){
  const r = calcIndicator(code, currentPeriod.id);
  if (!r) return `<div class="banner warn"><i class="bi bi-exclamation-triangle-fill"></i>
    <div>Indicator not found.</div></div>`;
  const i = r.indicator;
  const parent = appData.logframe.nodes.find(n => n.code === i.linkedTo);

  // Disaggregation — only meaningful for the case-driven indicators.
  let disagg = '';
  if (i.computed === 'cases'){
    const cs = calcCaseStats({}).cases;
    const bands = ['0–5','6–12','13–17'];
    disagg = `<div class="card" style="margin-bottom:18px">
      <div class="card-head"><h3>Disaggregation</h3>
        <span style="font-size:11.5px;color:var(--ink-mute)">sex × age band × GVH</span></div>
      <div class="tbl-scroll"><table class="dt">
        <thead><tr><th>GVH</th><th>Age band</th><th class="n">Boys</th><th class="n">Girls</th>
          <th class="n">With disability</th><th class="n">Total</th></tr></thead>
        <tbody>${['MK','MJ'].flatMap(g => bands.map(b => {
          const sub = cs.filter(c=>c.gvh===g && c.ageBand===b);
          if (!sub.length) return '';
          return `<tr><td>${GVH_NAME[g]}</td><td>${b}</td>
            <td class="n">${sub.filter(c=>c.sex==='M').length}</td>
            <td class="n">${sub.filter(c=>c.sex==='F').length}</td>
            <td class="n">${sub.filter(c=>c.disability).length}</td>
            <td class="n"><strong>${sub.length}</strong></td></tr>`;
        })).join('')}</tbody>
      </table></div>
      <div class="card-body" style="padding-top:0;font-size:11.5px;color:var(--ink-mute)">
        Cells below 3 cases are suppressed in donor exports and shown as “&lt;3”.
      </div></div>`;
  }

  afterRender(() => {
    const T = chartTheme();
    const labels = ['Q1 2026','Q2 2026','Q3 2026'];
    const series = ['2026-Q1','2026-Q2'].map(pd => {
      if (i.computed === 'cases'){
        const s = calcCaseStats({period:pd});
        return i.code === 'SO2' ? pct(s.concluded, s.total)
             : i.code === 'SO4' ? pct(s.pss, s.total)
             : pct(s.followedUp, s.total);
      }
      const res = i.results.find(x => x.period === pd);
      return res ? res.value : null;
    });
    mountChart('ch-ind', {type:'line',
      data:{labels, datasets:[
        {label:'Actual', data:[...series, null], borderColor:T.brand, backgroundColor:T.brand, tension:.25},
        ...(i.target !== null ? [
          {label:'End target', data:labels.map(()=>i.target), borderColor:T.ok,
           borderDash:[5,4], pointRadius:0, tension:0},
          {label:'Expected by now', data:labels.map(()=>r.expectedByNow), borderColor:T.warn,
           borderDash:[2,3], pointRadius:0, tension:0}] : [])]},
      options:{plugins:{legend:{display:true, labels:{color:T.ink, font:{size:10}, boxWidth:10}}},
        scales:{y:{grid:{color:T.line}, ticks:{color:T.mute, font:{size:10}}},
                x:{grid:{display:false}, ticks:{color:T.mute, font:{size:10}}}}}});
  });

  const results = i.computed
    ? `<tr><td colspan="4" style="color:var(--ink-mute)">
         Computed live from ${esc(i.computed)} data — there is no stored history to show.
         Changing a case or a checklist answer moves this value immediately.</td></tr>`
    : (i.results.length
        ? i.results.map(res => `<tr>
            <td>${esc(res.period)}</td>
            <td class="n">${res.num !== undefined ? num(res.num) : '—'}${res.den?` / ${num(res.den)}`:''}</td>
            <td class="n"><strong>${fmtVal(res.value,i.unit)}</strong></td>
            <td>${esc(res.comment||'')}</td></tr>`).join('')
        : `<tr><td colspan="4" style="color:var(--ink-mute)">No results recorded yet.</td></tr>`);

  return `
    <button class="btn btn-sm btn-ghost" data-action="go" data-view="indicators" style="margin-bottom:12px">
      <i class="bi bi-arrow-left"></i> All indicators</button>

    <div class="sec-title"><span class="mono" style="font-size:14px;color:var(--ink-mute)">${esc(i.code)}</span>
      &nbsp;${esc(i.text)}</div>
    <div class="sec-sub">${esc(appData.config.levelLabels[i.level]?.fpc || i.level)}
      ${parent?` · under ${esc(parent.code)}`:''}</div>

    <div style="display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start;margin-bottom:18px">
      <div class="card"><div class="card-head"><h3>Trend against target</h3>
        ${statusChip(r.status)}</div>
        <div class="chart-wrap"><canvas id="ch-ind"></canvas></div></div>
      <div class="card"><div class="card-head"><h3>Current value</h3></div><div class="card-body">
        <div class="num-big" style="color:var(--brand)">${fmtVal(r.value,i.unit)}</div>
        ${r.num !== null ? `<div style="font-size:12px;color:var(--ink-mute);margin-top:5px">
            ${num(r.num)}${r.den?` of ${num(r.den)}`:''}${r.note?` — ${esc(r.note)}`:''}</div>` : ''}
        ${progressBar(i.target ? Math.min(100, r.value/i.target*100) : 0, r.status.tone)}
        <table class="kv" style="margin-top:10px">
          <tr><td>Target (end of project)</td><td><strong>${i.target!==null?num(i.target)+(i.unit==='percent'?'%':''):'Qualitative'}</strong></td></tr>
          <tr><td>Expected by now</td><td>${r.expectedByNow!==null?num(r.expectedByNow)+(i.unit==='percent'?'%':''):'—'}</td></tr>
          <tr><td>Baseline</td><td>${i.baseline!==null?num(i.baseline):chip('None recorded','info')}</td></tr>
          <tr><td>Unit</td><td>${esc(i.unit)}</td></tr>
          <tr><td>Frequency</td><td>${esc(i.frequency)}</td></tr>
          <tr><td>Means of verification</td><td>${esc(i.source)}</td></tr>
          <tr><td>Disaggregation</td><td>${i.disaggregation.map(d=>chip(d.replace('_',' '),'grey')).join(' ')}</td></tr>
        </table>
      </div></div>
    </div>

    ${disagg}

    <div style="display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start">
      <div class="card"><div class="card-head"><h3>Results history</h3></div>
        <div class="tbl-scroll"><table class="dt">
          <thead><tr><th>Period</th><th class="n">Numerator / denominator</th><th class="n">Value</th><th>Comment</th></tr></thead>
          <tbody>${results}</tbody></table></div></div>

      <div class="card"><div class="card-head"><h3>Record a result</h3></div><div class="card-body">
        ${i.computed
          ? `<div class="banner info" style="margin:0"><i class="bi bi-lightning-charge-fill"></i>
              <div>This indicator is computed from ${esc(i.computed)} data. Record the underlying
              record — a case, a checklist, a visit — and the value updates everywhere.</div></div>`
          : `<form data-action="rec-submit" data-code="${esc(i.code)}">
              <div style="display:grid;gap:9px">
                <label style="font-size:11px;color:var(--ink-mute)">Period
                  <select name="period" class="sel" style="width:100%;margin-top:3px">
                    ${appData.periods.map(pd=>`<option value="${pd.id}" ${pd.id===currentPeriod.id?'selected':''}>${esc(pd.label)}</option>`).join('')}
                  </select></label>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
                  <label style="font-size:11px;color:var(--ink-mute)">Numerator
                    <input name="num" type="number" min="0" class="sel" style="width:100%;margin-top:3px" required></label>
                  <label style="font-size:11px;color:var(--ink-mute)">Denominator
                    <input name="den" type="number" min="1" class="sel" style="width:100%;margin-top:3px"
                      ${i.unit==='percent'?'required':''}></label>
                </div>
                <label style="font-size:11px;color:var(--ink-mute)">Comment
                  <input name="comment" class="sel" style="width:100%;margin-top:3px" placeholder="Optional"></label>
                <button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Save result</button>
                <div style="font-size:11px;color:var(--ink-mute)">
                  Saving updates the indicator table, the sub-objective card and every report that cites it.</div>
              </div></form>`}
      </div></div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   8f. TARGET GROUPS — brief §7.5. FPC's own quarterly table.
   ═══════════════════════════════════════════════════════════════════════════ */
function renderTargetGroups(){
  const p = currentPeriod;
  const rows = calcTargetGroups(p.id);
  const short = rows.filter(r => r.needsVariance);

  const tot = rows.reduce((t,r) => {
    ['planned','reached','cumulative'].forEach(k => {
      t[k].m += r[k].m; t[k].f += r[k].f; t[k].mPwd += r[k].mPwd; t[k].fPwd += r[k].fPwd;
    });
    return t;
  }, {planned:{m:0,f:0,mPwd:0,fPwd:0}, reached:{m:0,f:0,mPwd:0,fPwd:0}, cumulative:{m:0,f:0,mPwd:0,fPwd:0}});

  const banner = short.length ? `
    <div class="banner warn">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <div><strong>${short.length} group${short.length===1?'':'s'} below 80% of the quarterly target.</strong>
        KNH requires an explanation of the variance before the report can be submitted.
        ${short.map(s=>esc(s.label.split(' (')[0])).join(', ')}.</div>
    </div>` : '';

  const cell = (g,k) => `<td class="n">${num(g[k].m)}</td><td class="n">${num(g[k].f)}</td><td class="n"><strong>${num(g[k].m+g[k].f)}</strong></td>`;

  const body = rows.map((r,idx) => `
    <tr class="${r.needsVariance?'short':''}">
      <td style="min-width:200px">${idx+1}. ${esc(r.label)}
        ${r.source==='enrolment'?'<span class="lf-tag">enrolment</span>':''}</td>
      ${cell(r,'planned')}${cell(r,'reached')}${cell(r,'cumulative')}
      <td class="n">${r.achievement!==null?r.achievement+'%':'—'}</td>
      <td style="min-width:230px">
        ${r.needsVariance
          ? (r.varianceComment
              ? `<div style="font-size:11.5px">${esc(r.varianceComment)}</div>
                 ${chip('Recorded','ok','bi-check-circle-fill')}`
              // Pre-filled from the activity's own variance note, but not yet
              // committed — so it still reads as outstanding on the report
              // card until someone confirms it. Enter commits.
              : `<input class="vin" data-action="variance" data-key="${r.key}"
                   placeholder="Explanation required — type and press Enter"
                   value="${esc(defaultVariance(r.key))}">
                 <div style="font-size:10.5px;color:var(--warn);margin-top:3px">
                   <i class="bi bi-pencil"></i> Draft from the activity record — press Enter to confirm</div>`)
          : '<span style="color:var(--ink-mute);font-size:11.5px">—</span>'}
      </td>
    </tr>`).join('');

  const pwd = rows.filter(r => r.reached.mPwd + r.reached.fPwd > 0);

  return `<div class="sec-title">Target groups reached — ${esc(p.label)}</div>
    <div class="sec-sub">Section 2 of the KNH quarterly report. Every figure is summed from the
      ${appData.activities.length} activity records; nothing here is typed by hand.</div>
    ${banner}
    <div class="card"><div class="tbl-scroll"><table class="tg">
      <thead>
        <tr>
          <th rowspan="2" style="text-align:left">Direct target group</th>
          <th colspan="3">Planned for the quarter</th>
          <th colspan="3">Reached in the quarter</th>
          <th colspan="3">Cumulative since project start</th>
          <th rowspan="2">% achievement</th>
          <th rowspan="2" style="text-align:left">Comments on variance</th>
        </tr>
        <tr>${'<th>M</th><th>F</th><th>Total</th>'.repeat(3)}</tr>
      </thead>
      <tbody>
        ${body}
        <tr class="total"><td>Total direct target groups</td>
          ${cell(tot,'planned')}${cell(tot,'reached')}${cell(tot,'cumulative')}
          <td class="n">${pct(tot.reached.m+tot.reached.f, tot.planned.m+tot.planned.f)}%</td><td></td></tr>
      </tbody>
    </table></div></div>

    <div class="panel-grid" style="margin-top:18px">
      <div class="card"><div class="card-head"><h3>Persons with disabilities</h3>
        <span style="font-size:11.5px;color:var(--ink-mute)">required for CSSF</span></div>
        <div class="tbl-scroll"><table class="dt">
          <thead><tr><th>Group</th><th class="n">Male PwD</th><th class="n">Female PwD</th><th class="n">Total</th>
            <th class="n">% of group</th></tr></thead>
          <tbody>${pwd.map(r=>`<tr><td>${esc(r.label.split(' (')[0])}</td>
            <td class="n">${r.reached.mPwd}</td><td class="n">${r.reached.fPwd}</td>
            <td class="n"><strong>${r.reached.mPwd+r.reached.fPwd}</strong></td>
            <td class="n">${pct(r.reached.mPwd+r.reached.fPwd, r.reachedTotal)}%</td></tr>`).join('')}
          </tbody></table></div></div>

      <div class="card"><div class="card-head"><h3>Indirect reach this quarter</h3></div><div class="card-body">
        <table class="kv">
          ${appData.activities.filter(a=>a.period===p.id && a.indirectReach)
            .map(a=>`<tr><td>${esc(a.title)}</td><td class="n"><strong>${num(a.indirectReach)}</strong></td></tr>`).join('')}
          <tr><td><strong>Estimated total</strong></td><td class="n"><strong>${num(
            appData.activities.filter(a=>a.period===p.id && a.indirectReach)
              .reduce((t,a)=>t+a.indirectReach,0))}</strong></td></tr>
        </table>
        <div style="font-size:11.5px;color:var(--ink-mute);margin-top:9px">
          Radio listenership and event bystanders. Reported separately from direct target groups.
        </div></div></div>
    </div>`;
}

function defaultVariance(key){
  return key === 'extension_workers'
    ? 'PSS training for extension workers moved to Q3 due to district exam schedule.' : '';
}


/* ═══════════════════════════════════════════════════════════════════════════
   8g. ACTIVITIES & WORKPLAN — brief §7.4
   ═══════════════════════════════════════════════════════════════════════════ */

const FUND_LABEL = {knh:'KNH', cssf_restricted:'CSSF restricted', cssf_unrestricted:'CSSF unrestricted'};
const ACT_STATUS = {
  done:      {label:'Done',      tone:'ok',   icon:'bi-check-circle-fill'},
  planned:   {label:'Planned',   tone:'grey', icon:'bi-circle'},
  postponed: {label:'Postponed', tone:'bad',  icon:'bi-calendar-x-fill'},
  cancelled: {label:'Cancelled', tone:'bad',  icon:'bi-x-circle-fill'}
};

const attTotal = a => (a.attendance||[]).reduce((t,x) => t + x.m + x.f, 0);
const attPwd   = a => (a.attendance||[]).reduce((t,x) => t + x.mPwd + x.fPwd, 0);
const planTotal= a => (a.planned||[]).reduce((t,x) => t + x.m + x.f, 0);

/* Which reports and indicators a single activity record feeds. This is the
   "enter once, report everywhere" claim, derived rather than asserted. */
function activityFeeds(a){
  const feeds = [];
  const out = appData.logframe.nodes.find(n => n.code === a.parentOutput || n.code === a.code.split('.').slice(0,3).join('.'));

  if (attTotal(a) || planTotal(a)) feeds.push({r:'knh-quarterly', s:'§2 Target groups reached', view:'target-groups'});
  feeds.push({r:'knh-quarterly', s:'§3.2 Strategies and activities', view:'reports'});
  if (a.status === 'postponed') feeds.push({r:'knh-quarterly', s:'§2 Variance comment', view:'target-groups'});

  if (a.fund.startsWith('cssf')){
    feeds.push({r:'cssf-activity', s:'Whole report', view:'reports'});
    feeds.push({r:'cssf-quarterly',
                s: a.fund === 'cssf_restricted' ? '§1.0 Restricted funds' : '§2.0 Unrestricted funds',
                view:'reports'});
  }
  if (out && out.indicator) feeds.push({r:'indicator', s:`Indicator ${out.code}`, view:'indicators', code:out.code});
  if (a.photos && a.photos.length) feeds.push({r:'knh-quarterly', s:'§13 Photos', view:'evidence'});
  return feeds;
}

let wpScope = 'project';     // 'project' | 'year1'

function renderActivities(){
  const quarters = projectQuarters().filter(q => wpScope === 'project' || q.year === 1);
  const acts = appData.activities;

  /* ── Workplan ─────────────────────────────────────────────────────────── */
  const bySo = {};
  acts.forEach(a => { const so = 'SO' + a.code.charAt(0); (bySo[so] = bySo[so] || []).push(a); });

  const ganttRows = ['SO1','SO2','SO3','SO4'].filter(so => bySo[so]).map(so => {
    const head = `<tr class="grp"><td class="g-act" colspan="${quarters.length+1}">${esc(so)} — ${esc(soShort(so))}</td></tr>`;
    const rows = bySo[so].map(a => {
      const cells = quarters.map(q => {
        const here = q.periodId === a.period;
        const moved = a.status === 'postponed' && q.periodId === a.postponedTo;
        const cls = q.current ? 'now' : (q.elapsed ? 'past' : '');
        let bar = '';
        if (here) bar = `<span class="gbar ${a.status === 'postponed' ? 'postponed' : a.status === 'done' ? 'done' : 'planned'}"
                           title="${esc(a.title)} — ${esc(ACT_STATUS[a.status].label)}"></span>`;
        else if (moved) bar = `<span class="gbar moved" title="Moved here from ${esc(a.period)}"></span>`;
        return `<td class="g-cell ${cls}">${bar}</td>`;
      }).join('');
      return `<tr><td class="g-act">
          <span class="mono" style="color:var(--ink-mute);font-size:10.5px">${esc(a.code)}</span>
          &nbsp;${esc(a.title.slice(0,64))}${a.title.length>64?'…':''}
        </td>${cells}</tr>`;
    }).join('');
    return head + rows;
  }).join('');

  const workplan = `
    <div class="card" style="margin-bottom:18px">
      <div class="card-head">
        <h3>Quarterly workplan</h3>
        <div style="display:flex;gap:7px">
          <button class="fpill ${wpScope==='year1'?'on':''}" data-action="wp-scope" data-scope="year1">Year 1</button>
          <button class="fpill ${wpScope==='project'?'on':''}" data-action="wp-scope" data-scope="project">Full project</button>
        </div>
      </div>
      <div class="tbl-scroll"><table class="gantt">
        <thead><tr><th class="gh-act">Activity</th>
          ${quarters.map(q=>`<th class="${q.current?'now':''}" title="${esc(q.range)}">${esc(q.label)}<br>
            <span style="font-weight:400;text-transform:none;letter-spacing:0">${esc(q.range)}</span></th>`).join('')}
        </tr></thead>
        <tbody>${ganttRows}</tbody>
      </table></div>
      <div class="card-body" style="padding-top:10px">
        <div class="g-legend">
          <span><i class="gbar done" style="width:16px"></i> Completed</span>
          <span><i class="gbar planned" style="width:16px"></i> Planned</span>
          <span><i class="gbar postponed" style="width:16px"></i> Postponed</span>
          <span><i class="gbar moved" style="width:16px"></i> Moved into this quarter</span>
          <span style="color:var(--brand)">Shaded column is the current quarter</span>
        </div>
      </div>
    </div>`;

  /* ── Activity list ────────────────────────────────────────────────────── */
  const p = currentPeriod;
  const inPeriod = acts.filter(a => a.period === p.id);
  const rows = inPeriod.map(a => {
    const st = ACT_STATUS[a.status];
    const reached = attTotal(a), planned = planTotal(a);
    const ach = planned ? pct(reached, planned) : null;
    const varCost = a.plannedCost ? Math.round((a.actualCost - a.plannedCost)/a.plannedCost*1000)/10 : 0;
    return `<tr class="clickable" data-action="act-open" data-id="${esc(a.id)}">
      <td class="mono" style="font-size:11px">${esc(a.code)}</td>
      <td>${esc(a.title)}
        <div style="font-size:11px;color:var(--ink-mute);margin-top:2px">
          ${esc(GVH_NAME[a.gvh]||a.gvh)}${a.venue?` · ${esc(a.venue)}`:''}</div></td>
      <td style="white-space:nowrap">${fmtDate(a.date)}</td>
      <td>${chip(st.label, st.tone, st.icon)}</td>
      <td class="n">${planned ? num(planned) : '—'}</td>
      <td class="n">${reached ? num(reached) : (a.status==='postponed' ? '0' : '—')}</td>
      <td class="n">${ach !== null ? ach+'%' : '—'}</td>
      <td class="n">${attPwd(a) || '—'}</td>
      <td>${chip(FUND_LABEL[a.fund], a.fund==='knh'?'brand':'accent')}</td>
      <td class="n">${a.actualCost ? num(a.actualCost) : '—'}
        ${Math.abs(varCost) > 15 ? `<div style="font-size:10.5px;color:var(--warn)">${varCost>0?'+':''}${varCost}%</div>` : ''}</td>
    </tr>`;
  }).join('');

  const list = `
    <div class="card">
      <div class="card-head">
        <h3>Activities — ${esc(p.label)}</h3>
        <div style="display:flex;gap:7px;align-items:center">
          <span style="font-size:11.5px;color:var(--ink-mute)">
            ${inPeriod.filter(a=>a.status==='done').length} of ${inPeriod.length} completed</span>
          <button class="btn btn-sm btn-primary" data-action="act-new">
            <i class="bi bi-plus-lg"></i> New activity report</button>
        </div>
      </div>
      <div class="tbl-scroll"><table class="dt">
        <thead><tr><th>Code</th><th>Activity</th><th>Date</th><th>Status</th>
          <th class="n">Planned</th><th class="n">Reached</th><th class="n">%</th>
          <th class="n">PwD</th><th>Fund</th><th class="n">Actual cost (MWK)</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="10" style="text-align:center;padding:24px;color:var(--ink-mute)">No activities in this period.</td></tr>`}</tbody>
      </table></div>
    </div>`;

  return `<div class="sec-title">Activities &amp; workplan</div>
    <div class="sec-sub">${acts.length} activity records against the logframe.
      Each one is the single capture point for everything downstream.</div>
    ${workplan}${list}`;
}

/* ── Activity detail — the single capture point (brief §7.4) ───────────── */
function renderActivityDetail(id){
  const a = appData.activities.find(x => x.id === id);
  if (!a) return `<div class="banner warn"><i class="bi bi-exclamation-triangle-fill"></i><div>Activity not found.</div></div>`;
  const node = appData.logframe.nodes.find(n => n.code === a.code);
  const st = ACT_STATUS[a.status];
  const feeds = activityFeeds(a);

  /* The strip that carries the core message. */
  const feedStrip = `
    <div class="feeds">
      <div class="f-h"><i class="bi bi-diagram-2-fill"></i> This record feeds</div>
      ${feeds.map(f => `<span class="f-item">
        <a data-action="go" data-view="${f.view}">${esc(f.r === 'indicator' ? f.s : reportShort(f.r) + ' ' + f.s)}</a>
      </span>`).join('')}
      <div style="font-size:11px;color:var(--brand);margin-top:5px;opacity:.78">

  /* Attendance in the CSSF format the template demands. */

                         {m:0,mPwd:0,f:0,fPwd:0});
  const attTable = att.length ? `
    <table class="att">
      <thead><tr><th style="text-align:left">Beneficiary group</th><th>Male</th><th>Male (PwD)</th>
        <th>Female</th><th>Female (PwD)</th><th>Total</th></tr></thead>
      <tbody>
        ${att.map(x => `<tr><td>${esc((GROUPS.find(g=>g.key===x.group)||{}).label || x.group)}</td>
          <td>${x.m}</td><td>${x.mPwd}</td><td>${x.f}</td><td>${x.fPwd}</td>
          <td><strong>${x.m+x.f}</strong></td></tr>`).join('')}
        <tr class="t"><td>Total</td><td>${tot.m}</td><td>${tot.mPwd}</td><td>${tot.f}</td>
          <td>${tot.fPwd}</td><td>${tot.m+tot.f}</td></tr>
      </tbody>
    </table>` : `<div style="font-size:12px;color:var(--ink-mute)">
      No direct attendance — ${a.indirectReach ? `estimated indirect reach ${num(a.indirectReach)}` : 'staff activity'}.</div>`;

  const planned = planTotal(a), reached = attTotal(a);
  const costVar = a.plannedCost ? Math.round((a.actualCost - a.plannedCost)/a.plannedCost*1000)/10 : 0;
  const fx = appData.config.fx;
  const donorCost = a.fund === 'knh' ? `EUR ${num(Math.round(a.actualCost/fx.EUR_MWK))}`

      &nbsp;${esc(a.title)}</div>
