/* ═══════════════════════════════════════════════════════════════════════════
   8u. MY INBOX — brief §7.2
   Not a feed. Every item is something this person can act on, drawn from the
   same records as everywhere else, and each one carries why it is here.
   ═══════════════════════════════════════════════════════════════════════════ */
function inboxItems(){
  const u = currentUser, items = [];
  const mine = owner => owner && (owner.includes(u.title) || owner.includes(u.name) ||
    (u.role === 'Director' && owner.includes('Executive Director')));
  const can = k => access(k) !== 'none';

  // Monitoring actions this person owns.
  appData.actions.filter(a => a.status !== 'closed' && mine(a.owner)).forEach(a => items.push({
    urgency: a.status === 'overdue' ? 'now' : 'week',
    icon:'bi-geo-alt-fill', title:a.action,
    why:`Raised at ${a.visit} — ${a.issue}`,
    due:a.due, view:'visit-detail', meta:a.visit, cta:'Open the visit'
  }));

  // Reports due, with what is outstanding.
  if (can('reports')) reportCards().filter(c => c.status === 'due' && !reportState.submitted[c.id])
    .forEach(c => {
      const comp = calcCompleteness(c.id);
      items.push({
        urgency: daysTo(c.due) <= 14 ? 'now' : 'week',
        icon:'bi-file-earmark-text',
        title:`${appData.reportTemplates[c.id].name} — ${comp.pct}% ready`,
        why: comp.missing.length
          ? `Outstanding: ${comp.missing.map(m => m.split(' — ')[1]).join('; ')}`
          : 'Nothing outstanding — ready to generate.',
        due:c.due, view:'reports', cta:'Report Centre'
      });
    });

  // Indicators whose activity has happened but which carry no result.
  if (can('indicators')){
    const owed = appData.indicators.filter(i =>
      i.level === 'output' && !i.computed && i.unit !== 'qualitative' &&
      !i.results.some(r => r.period === currentPeriod.id) &&
      appData.activities.some(a => a.period === currentPeriod.id && a.status === 'done' &&
        a.code.startsWith(i.code + '.')));
    if (owed.length) items.push({
      urgency:'week', icon:'bi-bullseye',
      title:`${owed.length} indicator${owed.length===1?'':'s'} awaiting a result`,
      why:`The activity has been delivered but no value is recorded for ${currentPeriod.label.split(' · ')[0]}: ${owed.map(i=>i.code).join(', ')}.`,
      due:null, view:'indicators', cta:'Record results'
    });
  }

  // A photograph in the library with no consent form blocks every donor export.
  if (can('evidence')){
    const no = appData.evidence.filter(e => !e.consent);
    if (no.length) items.push({
      urgency:'now', icon:'bi-camera-fill',
      title:`${no.length} photograph${no.length===1?'':'s'} without a consent form`,
      why:`Withheld from every generated donor report until a form is filed: ${no.map(e=>e.caption).join('; ')}.`,
      due:null, view:'evidence', cta:'Evidence library'
    });
  }

  // Logframe findings, for the people who would act on them.
  if (can('quality') && ['Director','MEAL'].includes(u.role)){
    const open = appData.qualityFindings.filter(f => f.state === 'open');
    const high = open.filter(f => f.severity === 'high').length;
    if (open.length) items.push({
      urgency: high ? 'week' : 'later', icon:'bi-patch-check',
      title:`${open.length} logframe findings open`,
      why:`${high} high severity. The score is ${calcQualityScore().score} out of 100, and ${
        appData.indicators.filter(i => i.baseline === null).length} indicators still have no baseline.`,
      due:null, view:'quality', cta:'Quality check'
    });
  }

  // Cases still moving, for the two roles that may see them.
  if (u.caseAccess){
    const open = appData.cases.filter(c => !['Concluded','Closed – no further action'].includes(c.status));
    if (open.length) items.push({
      urgency:'week', icon:'bi-shield-exclamation',
      title:`${open.length} cases still open`,
      why:`${appData.cases.filter(c=>c.status==='Under follow-up').length} under follow-up, ${
        appData.cases.filter(c=>c.status==='Referred').length} referred and awaiting an outcome, ${
        appData.cases.filter(c=>c.status==='Assessed').length} assessed but not yet referred.`,
      due:null, view:'cases', cta:'Case management'
    });
  }

  // Field work outstanding in the registers this person works with.
  if (can('cbccs')){
    const left = appData.registry.cbccs.filter(c => !c.supportVisitDone).length;
    if (left) items.push({
      urgency:'later', icon:'bi-house-heart-fill',
      title:`${left} childcare centres not yet assessed`,
      why:`Round three of support visits covers them. ${appData.registry.cbccs.length - left} of ${appData.registry.cbccs.length} are done, which is what indicator 3.3.3 reports.`,
      due:'2026-12-20', view:'cbccs', cta:'CBCCs & ECD'
    });
  }

  // Activities carried into this quarter.
  if (can('activities')){
    const late = appData.activities.filter(a => a.status !== 'done' && a.date < appData.config.today);
    if (late.length) items.push({
      urgency:'now', icon:'bi-calendar-week',
      title:`${late.length} activit${late.length===1?'y':'ies'} past its date and not delivered`,
      why:late.map(a => `${a.code} ${a.title}`).join('; ') + '.',
      due:null, view:'activities', cta:'Workplan'
    });
  }

  const rank = {now:0, week:1, later:2};
  return items.sort((a,b) => rank[a.urgency] - rank[b.urgency] ||
    (a.due || '9999').localeCompare(b.due || '9999'));
}

        reporting deadlines approach.</p></div>`}

/* ═══════════════════════════════════════════════════════════════════════════
   8w. USER GUIDE — the system documents itself
   Nothing here is a screenshot. Each figure is the real screen, rendered from
   the same seed data the demonstration runs on, captured with its charts and
   dropped into the document. Change the data and the guide changes with it.
   ═══════════════════════════════════════════════════════════════════════════ */
const GUIDE_VERSION = '1.0';

/* Render a view and collect it, together with the configuration of any chart
   it wanted to draw. The charts are NOT drawn here: they are carried into the
   guide and drawn there, which means the guide can be built anywhere — in the
   browser, or from a script with no screen at all — and still has live charts
   when it is opened. */
let guideCharts = [];
function captureView(view, meta, prefix){
  const stage = document.getElementById('guide-stage');
  const r = VIEW_RENDERERS[view];
  if (!r) return '';

  const real = mountChart;
  const seen = [];
  globalThis.mountChart = (id, cfg) => { seen.push({id, cfg: chartConfig(cfg)}); };
  pendingMounts = [];
  let html = '';
  try {
    html = `<section class="view active">${r(meta)}</section>`;
    pendingMounts.forEach(fn => { try { fn(); } catch(e){} });
  } finally {
    globalThis.mountChart = real;
    pendingMounts = [];
    if (stage) stage.innerHTML = '';
  }

  /* Canvas ids must be unique across the whole document, so each figure gets
     its own prefix — in the markup and in the configuration together. */
  seen.forEach(c => {
    const to = prefix + '-' + c.id;
    html = html.split('id="' + c.id + '"').join('id="' + to + '"');
    guideCharts.push({id: to, cfg: c.cfg});
  });
  return html;
}

/* Chart configurations carry callbacks — axis tick formatting, tooltip labels
   — and those callbacks close over this page: helpers like num(), and local
   variables from the renderer that produced them. Carried into the guide they
   would throw, and a tick callback that throws takes the whole chart with it.
   They are dropped instead. The plot is identical; the axis shows 4000 rather
   than EUR 4k, and a printed page has no tooltips to lose. */
function guideSerialize(obj){
  return JSON.stringify(obj, (k, v) => (typeof v === 'function' ? undefined : v));
}

/* The chrome around a figure, so a screen is recognisable on the page. */
function guideShot(view, inner, caption, opts){
  opts = opts || {};
  const nav = NAV.flatMap(g => g.items).find(i => i.key === view);
  const det = DETAIL_VIEWS[view];
  const title = opts.title || (nav ? nav.label : (det ? det.title : view));
  const crumb = det ? det.crumb : (NAV.find(g => g.items.some(i => i.key === view)) || {}).group || '';
  const side = NAV.map(g => `<div class="ss-g">${esc(g.group)}</div>` +
    g.items.map(i => `<div class="ss-i${i.key === (opts.navKey || view) ? ' on' : ''}">${esc(i.label)}</div>`).join('')).join('');

  return `<figure class="fig">
    <div class="shot" style="--h:${opts.h || 560}px">
      <div class="shot-sb">
        <div class="ss-brand">${esc(appData.config.org.short)}
          <span>${esc(appData.config.org.name)}</span></div>
        ${side}
      </div>
      <div class="shot-col">
        <div class="shot-tb"><div><b>${esc(title)}</b><i>${esc(crumb)}</i></div>
          <div class="ss-user">${esc(currentUser.initials)} ${esc(currentUser.title)}</div></div>
        <div class="shot-main"><div class="shot-scale">${inner}</div></div>
      </div>
    </div>
    <figcaption>${esc(caption)}</figcaption>
  </figure>`;
}

/* ── The guide's own content. Prose is written; every figure and every number
      inside it is taken from the system at the moment the guide is built. ── */
function guideChapters(){
  const C = appData.config, R = appData.registry;
  const tg = calcTargetGroups('2026-Q2');
  const reach = tg.reduce((t,r) => t + r.reachedTotal, 0);
  const cs = calcCaseStats({});
  const q2 = calcCaseStats({period:'2026-Q2'});
  const knh = calcBudgetLines('knh');
  const comp = calcCompleteness('knh-quarterly');
  const q = calcQualityScore();
  const n = v => num(v);

  return [
  {no:1, title:'Introduction & getting started', sub:'Eval360 runs in a web browser. There is nothing to install.',
   body:[
    {p:`Eval360 holds ${esc(C.org.name)}'s logframe, indicators, activities, community registers, child
       protection cases, monitoring visits, budget and donor reports in one place. A figure recorded once
       in the place it belongs appears everywhere it is needed — in the indicator, in the target-group

    {h:'Signing in'},
    {ol:['Open Eval360 in Chrome, Edge or Firefox on any computer, tablet or phone.',
         'Enter the username and password issued by the Executive Director.',
         'Your account carries one role. The menu shows only what that role needs, and some screens open read-only.']},
    {note:['Your role decides what you see', `The role selector in the top bar is a demonstration control — it
      lets you look at the system as each member of staff sees it. In the live system you simply sign in as
      yourself. Case records are the clearest example: only the Executive Director and the Designated
      Safeguarding Focal Person can open one.`]},
    {h:'The screen'},
    {fig:['dashboard','The dashboard, as the Executive Director sees it', {h:600}]},
    {table:[['Area','What it does'],
      ['Left menu',`Modules grouped by area: Overview, Project, Community, Child Protection, Monitoring,
        Finance, Reporting and Settings. Items your role cannot open are not shown.`],
      ['Period selector',`Every figure on screen is for the selected quarter. Changing it changes the whole
        system, not one panel.`],
      ['Data checks',`The chip in the top bar reports how many internal consistency checks passed when the
        data loaded — attendance against the target-group table, activity costs against reported spend,
        case counts against the register. Click it to see all of them.`],
      ['Your name','Role, and sign out.']]},
    {h:'The one rule worth knowing'},
    {p:`<strong>You never type a number twice.</strong> Attendance is entered on the register. The
       target-group table adds it up. The indicator reads the table. The quarterly report reads the
       indicator. If a figure is wrong, it is wrong in one place and corrected in one place.`}
   ]},

  {no:2, title:'The three journeys at a glance',
   sub:'Three pieces of work that between them touch almost every screen.',

    {flow:['Delivering an activity',[

      ['Target groups','Totals update'],['Indicator','Moves with it'],['Report','Narrative drafted'],
      ['Donor','Sent and closed']]]},
    {flow:['A child protection case',[
      ['Reported','By whom, where'],['Assessed','Within days'],['Referred','DSWO, police, health'],
      ['Support','PSS where needed'],['Concluded','Outcome recorded'],['Indicators','SO2, 2.1, SO4'],
      ['Reported','As counts only']]]},
    {flow:['A monitoring visit',[
      ['Visit','FPC’s own format'],['Observations','What was seen'],['Issues','What is wrong'],
      ['Actions','Owner and date'],['Remind','When overdue'],['Closed','Verified'],
      ['Report','§8 Monitoring']]]},
    {h:'How the system knows where something has reached'},
    {p:`Nothing is moved along by hand. An activity is <em>planned</em> until a register is filed against

  {no:3, title:'Journey 1 — Delivering an activity',

    {step:[1,'Find it in the workplan','Programme Officer','Activities & Workplan']},
    {p:`The workplan shows every activity by quarter with its code, fund, planned cost and the groups it

       scheduled for the current quarter.`},
    {fig:['activities','The workplan — activities by quarter, with fund and cost',{h:620}]},
    {step:[2,'Open the activity','Programme Officer','Activities → the activity']},
    {p:`Every activity record names <em>what it feeds</em> — the logframe output, the indicator, the
       target-group row and the reports it will appear in. That strip is the whole argument of the system
       on one screen.`},
    {fig:['activity-detail','An activity record, and what it feeds',{h:620,meta:'ACT-012',navKey:'activities'}]},
    {step:[3,'File the register in the field','Facilitator','Field Forms']},
    {p:`There are nine forms, each naming the reports it feeds. They work offline: fill one in where there

    {fig:['forms','The nine field forms',{h:560}]},
    {p:`Open the Activity Attendance Register on a phone, choose the activity, record attendance by sex and

    {step:[4,'Watch what moves','—','Target Groups']},
    {p:`Submitting the register does four things at once. The activity closes as delivered. The

   ]},

  {no:4, title:'Journey 2 — A child protection case',
   sub:`${n(cs.total)} cases have been recorded since April. This is how one of them moves, and who may see it.`,

    {p:`Case records are the most restricted thing in the system. Everyone can see the counts; only the

    {step:[1,'A case is reported','Safeguarding Focal Person','Case Management']},
    {p:`Sex, age band and GVH are recorded. <strong>No child’s name is ever entered.</strong> The record

    {step:[4,'What a role without access sees','Field facilitator','Case Management']},

  {no:5, title:'Journey 3 — A monitoring visit',
   sub:`${n(appData.visits.length)} visits have been conducted this project year, producing

function guideChapters2(){
  const C = appData.config, R = appData.registry;
  const tg = calcTargetGroups('2026-Q2');
  const cs = calcCaseStats({});
  const knh = calcBudgetLines('knh');
  const r = calcBudgetLines('cssf_restricted'), u = calcBudgetLines('cssf_unrestricted');
  const comp = calcCompleteness('knh-quarterly');
  const q = calcQualityScore();
  const n = v => num(v);
  const inds = calcAllIndicators('2026-Q2');

  return [
  {no:6, title:'The logframe and indicators',
   sub:`${n(appData.logframe.nodes.length + 2)} logframe rows and ${n(appData.indicators.length)} indicators,
        in FPC’s own wording and FPC’s own levels.`,
   body:[
    {p:`Most systems have four logframe levels. FPC’s has five, because it carries a <em>Use of
       Output</em> row between the sub-objective and the output. Eval360 uses FPC’s labels throughout
       and shows the generic equivalent as a grey tag beside them, so nothing has to be renamed to fit
       the software.`},
    {table:[['FPC calls it','Eval360 calls it'],
      ['Goal','Impact'],['Overall objective','Outcome'],['Sub-objective','Outcome'],
      ['Use of Output','Intermediate outcome'],['Output','Output'],['Activity','Activity']]},
    {fig:['logframe','The logframe tree, with a quality flag on the rows that carry a finding',{h:620}]},
    {p:`The matrix view is FPC’s own four-column layout, for anyone who prefers to read it as a table.`},
    {step:[null,'Indicators','MEAL Officer','Indicators']},
    {p:`Each indicator shows its baseline, target, current value and whether it is ahead of or behind the
       straight-line expectation for this point in the project. ${n(inds.filter(x=>x.value!==null).length)}
       of ${n(appData.indicators.length)} carry a value today; the rest are annual, or depend on activities
       later in the year.`},
    {p:`Some indicators are <strong>computed live</strong> and cannot be typed at all — those driven by the
       case register, the by-laws checklist, the CBCC register, the councils and the score card. They
       change the moment the underlying record changes. The rest are recorded against a period on the
       indicator’s own screen.`},
    {fig:['indicators','The indicator list — live-computed indicators are marked',{h:620}]},
    {note:['Baselines', `${n(appData.indicators.filter(i=>i.baseline===null).length)} indicators have no
      baseline value. Progress against them can be stated as a level but not as a change, which will matter
      in the annual report rather than this one. The Logframe Quality Check offers to set a baseline of
      zero on the indicators that count something the project itself creates, and says plainly which ones
      still need a survey.`]}
   ]},

  {no:7, title:'Activities, target groups and the workplan',
   sub:'What was planned, what was delivered, and who it reached.',
   body:[
    {p:`The workplan holds ${n(appData.activities.length)} activities across the project year, each tied to
       a logframe activity code, a fund and a cost. Attendance is recorded per beneficiary group, which is
       what lets one activity count towards several groups without anyone adding up by hand.`},
    {h:'The six target groups'},
    {p:`FPC reports against the same six rows every quarter. Planned, reached and cumulative are all
       derived from the activity register — the table is never typed.`},
    {table:[['Row','Where the figure comes from']].concat(
      GROUPS.map(g => [g.label.split(' (')[0],
        g.source === 'enrolment' ? 'CBCC enrolment — a standing population, not attendance'
                                 : 'Summed from activity attendance'])) },
    {p:`Persons with disabilities are counted <em>within</em> these figures, not in addition to them:
       ${n(tg.reduce((t,x)=>t+x.reached.mPwd,0))} male and ${n(tg.reduce((t,x)=>t+x.reached.fPwd,0))} female
       this quarter.`}
   ]},

  {no:8, title:'Community structures',
   sub:`${n(R.vcrcs.length)} village child rights councils, ${n(R.cbccs.length)} childcare centres and the
        Community Score Card.`,
   body:[
    {step:[null,'Child Rights Councils','Programme Officer','Child Rights Councils']},
    {p:`${n(R.vcrcs.length)} councils with ${n(R.vcrcs.reduce((t,v)=>t+v.members,0))} child members

    {p:`KNH is reported in euro against a year-one budget of ${money('EUR',knh.planTotal)}; the Tilitonse

    {table:[['','KNH','CSSF restricted','CSSF unrestricted'],

      ['Allocation', money('EUR',knh.planTotal), money('GBP',r.planTotal), money('GBP',u.planTotal)],
      ['Spent', money('EUR',knh.spentTotal), money('GBP',r.spentTotal), money('GBP',u.spentTotal)]]},

   ]},

  {no:12, title:'The Report Centre',
   sub:'Six documents, in FPC’s and the donors’ own formats.',
   body:[
    {p:`This is the screen the rest of the system exists for. Each card shows the donor, the period, the due
       date, how much of the document the data can fill today, and exactly what is outstanding.`},
    {fig:['reports','The Report Centre — six templates with live completeness',{h:600}]},
    {table:[['Report','Period','Status']].concat(reportCards().map(c => [

      : c.status === 'drafts' ? 'One per completed activity' : 'One per visit']))},
    {h:'What generating does'},
    {ol:[`Collects the activity records, indicators and case aggregates for the period.`,
         `Builds every quantitative table — the target-group table, the indicator matrix in the donor’s

         `Drafts the narrative from those same figures, and marks it as a draft.`,
         `Shows what is missing as a red block in the place it belongs, rather than silently omitting it.`]},
    {p:`Every number in a drafted paragraph carries the query it came from. Turn on <strong>Show data

    {fig:['report-preview','A generated KNH quarterly report, in the donor’s own section numbering',
      {h:640, navKey:'reports', pre:'report'}]},
    {p:`Narrative can be edited in place and is then marked <em>Edited</em> rather than <em>Draft</em>;

       downloads as a Word file, and the CSSF target-progress annex downloads as a CSV.`},
    {note:['What is outstanding today', comp.missing.length

      : 'Nothing — the KNH quarterly report can be generated in full.']}

  {no:13, title:'Logframe quality check',
   sub:`A review of how the logframe measures, not of what the project does. Current score ${q.score} out of 100.`,
   body:[
    {p:`Eval360 checks the logframe against 40 quality rules and lists what it finds, with a severity, an

function guideQuickRef(){
  const n = v => num(v);
  return {no:16, title:'Quick reference', sub:'One page to keep beside the screen.', body:[
    {h:'Who does what'},
    {table:[['Role','Main tasks']].concat(appData.users.map(u => {
      const d = {Director:'Everything, including case records and the decision to submit a report',
        MEAL:'Indicators, results, target groups, reports, quality check; finance read-only',
        Programme:'Their own programme area, activities, community registers',
        Field:'The registers and forms they fill in; reporting read-only',
        Finance:'Budget and spend in full; programme registers read-only',
        Safeguarding:'Case records, PSS and the safeguarding register'}[u.role] || '';
      return [u.title, d];
    }))},
    {h:'The reporting calendar'},
    {table:[['Report','Rule','Next due','Confirmed']].concat(
      Object.entries(appData.config.calendar).map(([id,r]) => [
        appData.reportTemplates[id].name,
        r.basis === 'none' ? 'Filed with the visit' : `${r.daysAfter} days after the ${r.basis} ends`,
        reportDue(id,'2026-Q2') ? fmtDate(reportDue(id,'2026-Q2')) : '—',
        r.assumed ? 'Assumption — to confirm' : 'Confirmed']))},
    {h:'Where each figure comes from'},
    {table:[['Figure','Source'],
      ['Target groups reached','Summed from activity attendance registers'],
      ['Children in CBCCs','Centre enrolment — a standing population'],
      ['Cases concluded, referred, PSS','The case register, as counts'],
      ['By-laws compliance','The nine-question checklist, Yes = 1 · Partly = 0.5 · No = 0'],
      ['Score card step','Logframe activities 1.3.1.1 to 1.3.1.9 in the workplan'],
      ['Spend','Activity actual costs, converted at the configured rate'],
      ['Report completeness','What each template needs, checked against what is held']]},
    {h:'Safeguarding rules built into the system'},

/* ── Assemble the document ───────────────────────────────────────────────── */
async function buildGuideDocument(onProgress){
  guideCharts = [];
  const chapters = guideChapters().concat(guideChapters2()).concat([guideQuickRef()]);
  const C = appData.config;
  const figs = chapters.reduce((t,ch) => t + ch.body.filter(b => b.fig).length, 0);
  let done = 0;

  const renderBlock = async b => {
    if (b.p)    return `<p>${b.p}</p>`;
    if (b.h)    return `<h3>${esc(b.h)}</h3>`;
    if (b.ul)   return `<ul>${b.ul.map(x => `<li>${x}</li>`).join('')}</ul>`;
    if (b.ol)   return `<ol>${b.ol.map(x => `<li>${x}</li>`).join('')}</ol>`;
    if (b.note) return `<div class="g-note"><strong>${esc(b.note[0])}</strong><div>${b.note[1]}</div></div>`;
    if (b.step) return `<div class="g-step">${b.step[0] ? `<i>${b.step[0]}</i>` : ''}
      <div><b>${esc(b.step[1])}</b>
      <span>${esc(b.step[2])}${b.step[3] ? ' · Menu: ' + esc(b.step[3]) : ''}</span></div></div>`;
    if (b.table) return `<table class="g-tbl"><thead><tr>${b.table[0].map(h =>
        `<th>${h}</th>`).join('')}</tr></thead><tbody>${b.table.slice(1).map(row =>
        `<tr>${row.map((c,i) => `<td${i===0?' class="k"':''}>${c}</td>`).join('')}</tr>`).join('')}
      </tbody></table>`;
    if (b.flow) return `<div class="g-flow"><h4>${esc(b.flow[0])}</h4><div class="g-flow-r">${
      b.flow[1].map(([t,s]) => `<div class="g-fl"><b>${esc(t)}</b><span>${esc(s)}</span></div>`).join('')
    }</div></div>`;
    if (b.fig){
      const [view, caption, opts] = [b.fig[0], b.fig[1], b.fig[2] || {}];
      if (opts.pre === 'report'){ reportState.open = {id:'knh-quarterly', period:'2026-Q2'}; reportState.ctx = {}; }
      const inner = captureView(view, opts.meta, 'f' + (done + 1));
      done++; if (onProgress) onProgress(done, figs, caption);
      return guideShot(view, inner, caption, opts);
    }
    return '';
  };

  const chapterHtml = [];
  for (const ch of chapters){
    const blocks = [];
    for (const b of ch.body) blocks.push(await renderBlock(b));
    chapterHtml.push(`<section class="g-ch" id="ch${ch.no}">
      <div class="g-ch-no">Chapter ${ch.no}</div>
      <h2>${esc(ch.title)}</h2>
      ${ch.sub ? `<p class="g-sub">${ch.sub}</p>` : ''}
      ${blocks.join('\n')}
    </section>`);
  }

  const toc = chapters.map(ch => `<div class="g-toc-r"><b>${ch.no}</b>
    <span>${esc(ch.title)}</span></div>`).join('');
  const appCss = guideStylesheet();
  const logo = C.brand.logo ? `<img src="${C.brand.logo}" alt="" class="g-logo">` : '';

  return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>${esc(C.org.short)} Eval360 — Complete User Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
${appCss}
${guideDocCss()}
</style></head>
<body class="g-body">
<div class="g-bar no-print">
  <span>${esc(C.org.short)} Eval360 — Complete User Guide · ${chapters.length} chapters · ${figs} figures</span>
  <button onclick="window.print()">Print / Save as PDF</button>
</div>

<section class="g-cover">
  ${logo}
  <div class="g-cover-mark">${esc(C.org.short)}</div>
  <div class="g-cover-kicker">Eval360 · Monitoring, Evaluation and Reporting</div>
  <h1>Complete<br>User Guide</h1>
  <p class="g-cover-lede">How ${esc(C.org.name)} uses Eval360 — from planning an activity to the
     signed-off donor report. Every figure recorded once, in the place it belongs, and reported
     everywhere it is needed.</p>
  <div class="g-cover-meta">
    <div><b>${esc(C.org.name)}</b><span>${esc(C.project.title)}</span><span>${esc(C.project.location)}</span></div>
    <div><b>Version ${GUIDE_VERSION}</b><span>${fmtDate(C.today)}</span></div>
    <div><b>Audience</b><span>All programme, finance, field and management staff</span></div>
  </div>
</section>

<section class="g-toc">
  <div class="g-ch-no">Contents</div>
  <h2>What is in this guide</h2>
  ${toc}
  <div class="g-note" style="margin-top:22px"><strong>How to use it</strong>
    <div>Chapters 3 to 5 follow three pieces of real work through the system, step by step, exactly as
    staff do it. They touch almost every screen, so they are the best place to start. Chapters 6 to 15
    are a reference for each module, and chapter 16 is a single page to keep beside the screen.</div></div>
  <p class="g-gen">Generated by Eval360 on ${fmtDate(C.today)} from the data in the system. Nothing in this
    guide is a screenshot: every figure is the live screen, rendered with the project's own records.</p>
</section>

${chapterHtml.join('\n')}
<footer class="g-end">${esc(C.org.name)} · Eval360 Complete User Guide · Version ${GUIDE_VERSION} ·
  ${fmtDate(C.today)}</footer>

/* The figures carry their own charts. Without a connection the figure keeps

<\/script>

async function guideBuild(){
  if (guideBuilding) return;
  guideBuilding = true;
  const prog = document.getElementById('guide-prog');
  const bar  = document.getElementById('guide-bar');
  const note = document.getElementById('guide-note');
  if (prog) prog.style.display = 'block';
  try {
    const html = await buildGuideDocument((d,t,caption) => {
      if (bar)  bar.style.width = Math.round(d/t*100) + '%';
      if (note) note.textContent = `Capturing ${d} of ${t} — ${caption}`;
    });
    const url = URL.createObjectURL(new Blob([html], {type:'text/html;charset=utf-8'}));
    const w = window.open(url, '_blank');
    if (!w) toast('Your browser blocked the pop-up. Allow pop-ups to open the guide.', 'warn');
    else    toast('User guide built. Use Print / Save as PDF in the new tab.', 'ok');
    setTimeout(() => URL.revokeObjectURL(url), 120000);
  } catch(e){
    console.warn(e);
    toast('The guide could not be built: ' + e.message, 'bad');
  } finally {
    guideBuilding = false;
    if (note) note.textContent = '';
    if (prog) prog.style.display = 'none';
    showView(currentView);
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   8t. LOGFRAME QUALITY CHECK — brief §7.18
   An audit of FPC's own logframe. The tone matters: this is a set of
   suggestions about measurement, not a verdict on the project.
   ═══════════════════════════════════════════════════════════════════════════ */
const QC_RULES_CHECKED = 40;
const SEV = {high:{label:'High', tone:'bad'}, medium:{label:'Medium', tone:'warn'},
             low:{label:'Low', tone:'grey'}};

function renderQuality(){
  const q = calcQualityScore();
  const F = appData.qualityFindings;
  const open = F.filter(f => f.state === 'open');
  const applied = F.filter(f => f.state === 'applied');
  const ignored = F.filter(f => f.state === 'ignored');
  const bySev = s => open.filter(f => f.severity === s).length;

  // The ring: 100 is a full sweep, so the arc is the score itself.
  const r = 52, c = Math.PI * r;
  const arc = Math.max(0, Math.min(1, q.score / 100)) * c;
  const tone = q.score >= 85 ? 'ok' : q.score >= 70 ? 'warn' : 'bad';

  const card = f => `<div class="qf ${f.state === 'applied' ? 'done'
      : f.state === 'ignored' ? 'ignored' : f.severity}">
    <div>
      <div class="qf-top">
        ${chip(SEV[f.severity].label, f.state === 'applied' ? 'ok' : SEV[f.severity].tone)}
        <span class="qf-loc">${esc(f.location)}</span>
        ${f.state === 'applied' ? chip('Applied','ok','bi-check-circle-fill') : ''}
        ${f.state === 'ignored' ? chip('Ignored','grey') : ''}
      </div>
      <div class="qf-i">${esc(f.issue)}</div>
      <div class="qf-fix"><b>Suggested fix</b>${esc(f.fix)}
        ${f.effect && f.state === 'open'
          ? `<div class="qf-eff"><i class="bi bi-info-circle"></i> ${esc(f.effect)}</div>` : ''}</div>
      ${f.state === 'applied' && f.applied
        ? `<div class="qf-done-note"><i class="bi bi-check2"></i><span>${esc(f.applied)}</span></div>` : ''}
    </div>
    <div class="qf-act">
      ${f.state === 'open' ? `
        <button class="btn btn-sm btn-primary" data-action="qc-apply" data-id="${esc(f.id)}">
          <i class="bi bi-magic"></i> Apply fix</button>
        <button class="btn btn-sm btn-ghost" data-action="qc-ignore" data-id="${esc(f.id)}">
          Ignore</button>`
      : `<button class="btn btn-sm btn-ghost" data-action="qc-reset" data-id="${esc(f.id)}">
          <i class="bi bi-arrow-counterclockwise"></i> Undo</button>`}
    </div>
  </div>`;

  const group = (title, list, sub) => list.length ? `
    <div class="sec-title" style="font-size:14px;margin-top:20px">${esc(title)}</div>
    ${sub ? `<div class="sec-sub">${esc(sub)}</div>` : ''}
    ${list.map(card).join('')}` : '';

  return `<div class="sec-title">Logframe quality check</div>
    <div class="sec-sub">A review of how the logframe measures, not of what the project does.</div>

    <div class="qs-head">
      <div class="qs-ring">
        <svg viewBox="0 0 120 76" aria-hidden="true">
          <path d="M8 68 A52 52 0 0 1 112 68" fill="none" stroke="var(--bg-muted)"
            stroke-width="11" stroke-linecap="round"/>
          <path d="M8 68 A52 52 0 0 1 112 68" fill="none" stroke="var(--${tone})"
            stroke-width="11" stroke-linecap="round"
            stroke-dasharray="${arc} ${c}"/>
        </svg>
        <div style="margin-top:14px;text-align:center">
          <b style="color:var(--${tone})">${q.score}</b>
          <s>out of 100</s></div>
      </div>
      <div>
        <p><strong>Eval360 checked your logframe against ${QC_RULES_CHECKED} quality rules.
          These are suggestions to strengthen measurement — your logframe structure is sound.</strong></p>
        <p>The chain from goal to activity holds together, the targets are specific and the
          sub-objectives each carry indicators. What follows are
          ${open.length} point${open.length===1?'':'s'} where the measurement could be tightened:
          ${bySev('high')} high, ${bySev('medium')} medium and ${bySev('low')} low.
          ${applied.length ? `${applied.length} ${applied.length===1?'has':'have'} been applied.` : ''}</p>
        <p style="font-size:11.5px;color:var(--ink-mute)">Every fix is reversible, and the ones
          Eval360 cannot make itself say so rather than claiming to have made them. Ignoring a
          finding records the decision but does not change the score — the weakness is still in
          the logframe.</p>
      </div>
    </div>

    ${open.length ? '' : `<div class="banner info"><i class="bi bi-check-circle-fill"></i>
      <div>Every finding has been dealt with. The score is ${q.score} out of 100.</div></div>`}

    ${group('High severity', open.filter(f => f.severity === 'high'),
      'These affect whether progress can be measured at all.')}
    ${group('Medium severity', open.filter(f => f.severity === 'medium'),
      'Mismatches between an output and the activity beneath it, or indicators on the wrong row.')}
    ${group('Low severity', open.filter(f => f.severity === 'low'),
      'Wording, consistency and completeness.')}
    ${group('Applied', applied)}
    ${group('Ignored', ignored)}`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   10. ASK EVAL360 — brief §7.19, §10
   The answers are scripted in shape and computed in substance: every figure
   is read from appData at the moment of asking, so the assistant cannot be
   out of step with the rest of the system. It is given aggregates only — no
   case record ever reaches it, and it says so.
   ═══════════════════════════════════════════════════════════════════════════ */
const aiLog = [];          // {who:'me'|'it', html}

const AI_PROMPTS = [
  'Summarise Q2 progress for the Executive Director',
  'Which indicators are behind and why?',
  'Draft section 5 (Child protection) of the KNH quarterly report',
  'How many girls with disabilities did we reach this quarter?',
  'What should we prioritise in Q3?',
  'Write a success story from the VCRC scorecard activity',
  'Compare Mwakasangira and Mwanjasi'
];

function aiAnswer(qRaw){
  const q = qRaw.toLowerCase();
  const P = currentPeriod.id;

  if (/summarise|summary|executive director|q2 progress/.test(q))     return aiSummary(P);
  if (/behind|off track|low progress|lagging/.test(q))                return aiBehind(P);
  if (/draft|section 5|child protection.*report|report.*section/.test(q)) return aiDraftS5(P);
  if (/disabilit|pwd/.test(q))                                        return aiDisability(P);
  if (/prioritis|prioritiz|q3|next quarter|focus/.test(q))            return aiPriorities(P);
  if (/success story|story|case stud/.test(q))                        return aiStory();
  if (/compare|mwakasangira|mwanjasi|gvh/.test(q))                    return aiCompare(P);
  return aiFallback();
}

function aiSummary(P){
  const tg = calcTargetGroups(P);
  const reach = tg.reduce((t,r) => t + r.reachedTotal, 0);
  const acts = appData.activities.filter(a => a.period === P);
  const done = acts.filter(a => a.status === 'done').length;
  const cs = calcCaseStats({period:P}), all = calcCaseStats({});
  const k = calcBudgetLines('knh');
  const inds = calcAllIndicators(P).filter(r => r.value !== null);
  const onTrack = inds.filter(r => ['ahead','on_track'].includes(r.status.key)).length;
  return `<p><strong>${esc(QLABEL(P).replace('the quarter','Quarter'))}, in short.</strong></p>
    <ul>
      <li><strong>${done} of ${acts.length} planned activities</strong> delivered, reaching
        <strong>${num(reach)}</strong> people.</li>
      <li><strong>${cs.total} child protection cases</strong> reported in the quarter;
        ${all.concluded} of ${all.total} (${all.pct.concluded}%) concluded since April.</li>
      <li><strong>${onTrack} of ${inds.length}</strong> indicators carrying a value are at or ahead
        of expectation.</li>
      <li>KNH spend <strong>€${num(k.spentTotal)}</strong> of €${num(k.planTotal)} for year one
        (${Math.round(k.spentTotal/k.planTotal*1000)/10}% at ${k.elapsedPct}% of the year).</li>
      <li>Outstanding before the report can go: <strong>${calcCompleteness('knh-quarterly').missing.length}
        items</strong> — a variance explanation, the baselines, and one photo consent.</li>
    </ul>
    <p>The one thing I would put in front of the Director: the psychological first aid refresher
      was not delivered, so extension workers reached 0 of 25 this quarter. It is the reason the
      target-group table needs a variance note, the reason one activity shows a 100% cost
      underspend, and the reason indicator 4.3.1 has not moved.</p>`;
}

function aiBehind(P){
  const rows = calcAllIndicators(P)
    .filter(r => r.value !== null && ['behind','risk'].includes(r.status.key))
    .slice(0, 6);
  if (!rows.length) return `<p>Nothing is behind its expected value for this point in the project.</p>`;
  return `<p><strong>${rows.length} indicators are behind the straight-line expectation.</strong>
    In every case the activity that moves them is scheduled rather than abandoned:</p>
    <table><thead><tr><th>Code</th><th>Indicator</th><th class="n">Now</th>
      <th class="n">Expected</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${esc(r.indicator.code)}</td>
        <td>${esc(r.indicator.text.slice(0,70))}…</td>
        <td class="n">${fmtVal(r.value, r.indicator.unit)}</td>
        <td class="n">${r.expectedByNow === null || r.expectedByNow === undefined
          ? '—' : fmtVal(r.expectedByNow, r.indicator.unit)}</td></tr>`).join('')}
    </tbody></table>
    <p>Two causes account for most of it. Training-based indicators sit in the second half of year
      one in the work plan, so they read zero at the half-year point by design. And
      ${appData.indicators.filter(i => i.baseline === null).length} indicators have no baseline, so
      progress can only be stated as a level, not as a change — which makes several of them look
      flatter than they are.</p>`;
}

function aiDraftS5(P){
  const t = appData.reportTemplates['knh-quarterly'];
  const sec = t.sections.find(s => s.no === '5');
  const d = draftSection(t, sec, P, {});
  return `<p><strong>Section 5 — ${esc(sec.title)}</strong>, drafted from the case register as
    aggregates:</p>${d ? d.html : ''}
    <p style="font-size:11.5px;color:var(--ink-mute)">This is the same draft the Report Centre
      produces, and it is editable there. I read counts only — no case record, name or village
      figure is used.</p>`;
}

function aiDisability(P){
  const tg = calcTargetGroups(P);
  const fP = tg.reduce((t,r) => t + r.reached.fPwd, 0);
  const mP = tg.reduce((t,r) => t + r.reached.mPwd, 0);
  const rows = tg.filter(r => r.reached.fPwd || r.reached.mPwd);
  return `<p><strong>${num(fP)} girls and women with disabilities</strong> were reached in
    ${esc(QLABEL(P))}, alongside ${num(mP)} boys and men — ${num(fP + mP)} people in total.</p>
    ${rows.length ? `<table><thead><tr><th>Target group</th><th class="n">Female (PwD)</th>
      <th class="n">Male (PwD)</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${esc(r.label.split(' (')[0])}</td>
        <td class="n">${num(r.reached.fPwd)}</td><td class="n">${num(r.reached.mPwd)}</td></tr>`).join('')}
      </tbody></table>` : ''}
    <p>These are counted within the headline reach figures, not in addition to them. The childcare
      centre enrolment row is standing enrolment and does not carry a disability split, so the real
      total is likely to be a little higher than this.</p>`;
}

function aiPriorities(P){
  const comp = calcCompleteness('knh-quarterly');
  const over = appData.actions.filter(a => a.status === 'overdue');
  const notDone = appData.activities.filter(a => a.period === P && a.status !== 'done');
  const nextQ = appData.activities.filter(a => a.period === '2026-Q3').length;
  return `<p><strong>Five things, in the order I would do them.</strong></p>
    <ol>
      <li><strong>Clear the ${comp.missing.length} items blocking the KNH quarterly report</strong>
        — it is due in ${daysTo(reportDue('knh-quarterly','2026-Q2'))} days. The variance note takes five minutes; the photo
        consent takes one form.</li>
      <li><strong>Deliver the ${notDone.length} activit${notDone.length===1?'y':'ies'} carried over
        from this quarter</strong>, starting with the psychological first aid refresher. It is
        holding back a whole target group.</li>
      <li><strong>Close the ${over.length} overdue monitoring action${over.length===1?'':'s'}.</strong>
        Both have been open past their date and both have named owners.</li>
      <li><strong>Run the baseline exercise.</strong>
        ${appData.indicators.filter(i => i.baseline === null).length} indicators have no baseline,
        which will be a problem in the annual report rather than this one — so now is the time.</li>
      <li><strong>Get the score card to scoring.</strong> Both areas are at step
        ${calcCscProgress('MK').done} of ${appData.csc.steps.length}; scoring and the interface
        meeting are the steps that produce the result.</li>
    </ol>
    <p>${nextQ} activities are already scheduled for the coming quarter, so the plan itself is not
      the constraint.</p>`;
}

function aiStory(){
  const st = appData.stories[0];
  return `<p><strong>${esc(st.title)}</strong></p>
    <p>${esc(st.background)} ${esc(st.problem)}</p>
    <p>${esc(st.intervention)}</p>
    <p>${esc(st.change)}</p>
    <p style="font-style:italic">${esc(st.quote)}</p>
    <p>${esc(st.broader)}</p>
    <p style="font-size:11.5px;color:var(--ink-mute)">This is held in Evidence &amp; Stories and is
      already tagged to the KNH and CSSF quarterly reports, so it will appear in both without being
      written again.</p>`;
}

function aiCompare(P){
  const g = ['MK','MJ'];
  const cs = g.map(x => calcCaseStats({period:P, gvh:x}));
  const bl = g.map(x => calcBylawScore(x));
  const vc = g.map(x => appData.registry.vcrcs.filter(v => v.gvh === x));
  const cb = g.map(x => appData.registry.cbccs.filter(c => c.gvh === x));
  const csc = g.map(x => calcCscProgress(x));
  const row = (label, a, b) => `<tr><td>${esc(label)}</td><td class="n">${a}</td>
    <td class="n">${b}</td></tr>`;
  return `<table><thead><tr><th></th><th class="n">Mwakasangira</th>
      <th class="n">Mwanjasi</th></tr></thead><tbody>
      ${row('Villages', appData.config.gvhs[0].villages, appData.config.gvhs[1].villages)}
      ${row('Child rights councils', vc[0].length, vc[1].length)}
      ${row('Council members', vc[0].reduce((t,v)=>t+v.members,0), vc[1].reduce((t,v)=>t+v.members,0))}
      ${row('Codes of conduct in use', vc[0].filter(v=>v.codeOfConduct==='in_use').length,
                                       vc[1].filter(v=>v.codeOfConduct==='in_use').length)}
      ${row('Childcare centres', cb[0].length, cb[1].length)}
      ${row('Centre enrolment', num(cb[0].reduce((t,c)=>t+c.enrolledMale+c.enrolledFemale,0)),
                                num(cb[1].reduce((t,c)=>t+c.enrolledMale+c.enrolledFemale,0)))}
      ${row('Cases this quarter', cs[0].total, cs[1].total)}
      ${row('By-laws compliance', bl[0].score + '%', bl[1].score + '%')}
      ${row('Score card step', csc[0].done + ' of 9', csc[1].done + ' of 9')}
    </tbody></table>
    <p>The two are close on structure and reach. Where they differ is by-laws implementation:
      Mwakasangira is at ${bl[0].score}% against Mwanjasi's ${bl[1].score}%, and Mwanjasi's first
      round in May had no minutes filed. Mwanjasi started from a lower base and has improved by
      ${Math.round((bl[1].trend[bl[1].trend.length-1].score - bl[1].trend[0].score)*10)/10}
      points across three rounds, against
      ${Math.round((bl[0].trend[bl[0].trend.length-1].score - bl[0].trend[0].score)*10)/10}
      in Mwakasangira — so the gap is closing.</p>
    <p>Each area chose a different service for the score card, which is why their scorecards are not
      directly comparable: Mwakasangira chose ${esc(appData.csc.services.MK.toLowerCase())},
      Mwanjasi ${esc(appData.csc.services.MJ.toLowerCase())}.</p>`;
}

function aiFallback(){
  return `<p>I cannot answer that one in this demonstration. What I can do is laid out in the
    suggested questions beside the conversation — a quarter summary, which indicators are behind,
    a draft of section 5, disability-disaggregated reach, priorities for next quarter, a success
    story, and a comparison of the two areas.</p>
    <p>In a live deployment this would be answered the same way the others are: by reading the
      project's own records, not by generating a plausible-sounding figure.</p>`;
}

function renderAi(){
  const log = aiLog.length ? aiLog.map(m => m.who === 'me'
      ? `<div class="ae-msg me">${esc(m.text)}</div>`
      : `<div class="ae-msg it"><div class="ae-who"><i class="bi bi-stars"></i> Eval360</div>
          ${m.html}</div>`).join('')
    : `<div class="ae-msg it"><div class="ae-who"><i class="bi bi-stars"></i> Eval360</div>
        <p>Good morning. I can read everything in this system — ${appData.activities.length}
        activity records, ${appData.indicators.length} indicators, the case register as aggregates,
        the budget and the ${appData.visits.length} monitoring visits — and answer from them rather
        than from anything I have made up.</p>
        <p>Ask me something, or pick one of the questions on the right.</p></div>`;

  return `<div class="sec-title">Ask Eval360</div>
    <div class="sec-sub">Answers are computed from the project's own records at the moment you ask.</div>
    <div class="ae">
      <div class="ae-pane">
        <div class="ae-log" id="ae-log">${log}</div>
        <form class="ae-form" data-action="ai-send">
          <textarea name="q" rows="1" placeholder="Ask about progress, indicators, reach, the budget…"
            aria-label="Your question"></textarea>
          <button class="btn btn-primary" type="submit"><i class="bi bi-send"></i> Ask</button>
        </form>
        <div class="ae-note">AI drafts are suggestions. FPC staff review all content before
          submission. No case details are sent to AI — only counts and percentages.</div>
      </div>
      <div class="ae-sugg">
        <h4>Try one of these</h4>
        ${AI_PROMPTS.map(p => `<button class="ae-chip" data-action="ai-ask"
          data-q="${esc(p)}">${esc(p)}</button>`).join('')}
        ${aiLog.length ? `<button class="btn btn-sm btn-ghost" style="width:100%;margin-top:4px"
          data-action="ai-clear"><i class="bi bi-arrow-counterclockwise"></i> Start again</button>` : ''}
      </div>
    </div>`;
}

/* Ask, show the typing animation, then answer. */
function aiAsk(text){
  const q = String(text || '').trim();
  if (!q) return;
  aiLog.push({who:'me', text:q});
  showView('ai');
  const log = document.getElementById('ae-log');
  if (!log){ aiLog.push({who:'it', html:aiAnswer(q)}); return; }
  const wait = document.createElement('div');
  wait.className = 'ae-msg it';
  wait.innerHTML = `<div class="ae-who"><i class="bi bi-stars"></i> Eval360</div>
    <div class="ae-dots"><i></i><i></i><i></i></div>`;
  log.appendChild(wait);
  log.scrollTop = log.scrollHeight;
  setTimeout(() => {
    aiLog.push({who:'it', html:aiAnswer(q)});
    showView('ai');
    const l2 = document.getElementById('ae-log');
    if (l2) l2.scrollTop = l2.scrollHeight;
  }, 900);
}


/* ═══════════════════════════════════════════════════════════════════════════
   11. ROUTER & EVENTS
   One dispatcher. It toggles the view, updates the sidebar, topbar title and
   breadcrumb, then calls the view's renderer.
   ═══════════════════════════════════════════════════════════════════════════ */
let currentView = 'dashboard';

function buildSidebar(){
  const html = NAV.map(group => {
    const items = group.items.filter(i => access(i.key) !== 'none');
    if (!items.length) return '';
    return `
      <div class="sb-group">
        <span>${esc(group.group)}</span>${group.icon?`<i class="bi ${group.icon}"></i>`:''}
      </div>
      ${items.map(i => {
        const locked = i.key === 'cases' && !currentUser.caseAccess;
        return `<button class="nav-item${currentView===i.key?' active':''}" data-action="go" data-view="${i.key}">
          <i class="bi ${i.icon}"></i><span>${esc(i.label)}</span>
          ${locked ? '<i class="bi bi-lock-fill lockmark" title="Case detail restricted"></i>' : ''}
        </button>`;
      }).join('')}`;
  }).join('');
  document.getElementById('sb-nav').innerHTML = html;
}

function showView(name, meta){
  const detail = DETAIL_VIEWS[name];
  if (!detail && access(name) === 'none') { toast('That screen is not available for this role.','warn'); return; }

  destroyCharts();
  currentView = name;

  const nav = NAV.flatMap(g => g.items).find(i => i.key === name);
  const group = NAV.find(g => g.items.some(i => i.key === name));
  document.getElementById('tb-title').textContent = nav ? nav.label : (detail?.title || name);
  document.getElementById('tb-crumb').textContent = detail ? detail.crumb : (group?.group || '');

  pendingMounts = [];
  const renderer = VIEW_RENDERERS[name];
  document.getElementById('main').innerHTML =
    `<section class="view active" id="view-${name}">${renderer ? renderer(meta)
      : `<div class="empty"><i class="bi bi-compass"></i><h4>Nothing here</h4>
          <p>That screen does not exist. Use the menu on the left.</p></div>`}</section>`;

  // Charts can only be built once the canvases are in the document.
  pendingMounts.forEach(fn => { try { fn(); } catch(e){ console.warn('chart mount failed', e); } });
  pendingMounts = [];

  buildSidebar();
  brandApply();                       // a re-render must not drop the brand
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sb-backdrop').classList.remove('open');
  window.scrollTo(0,0);
}

/* Event delegation via data-action, rather than inline onclick (brief §12). */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const a = t.dataset.action;
  if (a === 'go')             showView(t.dataset.view, t.dataset.meta);
  if (a === 'close-modal')    closeModal();
  if (a === 'modal-backdrop' && e.target.id === 'modal-root') closeModal();
  if (a === 'open-sidebar'){  document.getElementById('sidebar').classList.add('open');
                              document.getElementById('sb-backdrop').classList.add('open'); }
  if (a === 'close-sidebar'){ document.getElementById('sidebar').classList.remove('open');
                              document.getElementById('sb-backdrop').classList.remove('open'); }
  if (a === 'show-checks')    showChecks();
  if (a === 'toast')         toast(t.dataset.msg || 'Done', 'ok');

  // ── Logframe ──
  if (a === 'lf-mode'){     logframeMode = t.dataset.mode; showView('logframe'); }
  if (a === 'lf-toggle'){   const c = t.dataset.code;
                            lfOpen.has(c) ? lfOpen.delete(c) : lfOpen.add(c);
                            showView('logframe'); }
  if (a === 'lf-expand'){   appData.logframe.nodes.forEach(n => lfOpen.add(n.code)); showView('logframe'); }
  if (a === 'lf-collapse'){ lfOpen = new Set(); showView('logframe'); }
  if (a === 'lf-export'){   toast('Export to Word is not part of this demonstration — the Report Centre documents export as .doc.','warn'); }

  // ── Indicators ──
  if (a === 'ind-toggle'){  indFilter[t.dataset.key] = !indFilter[t.dataset.key]; showView('indicators'); }
  if (a === 'ind-open'){    showView('indicator-detail', t.dataset.code); }

  // ── Activities ──
  if (a === 'wp-scope'){   wpScope = t.dataset.scope; showView('activities'); }
  if (a === 'act-open'){   showView('activity-detail', t.dataset.id); }
  if (a === 'act-new'){    newActivityModal(); }

  // ── Cases ──
  if (a === 'case-view'){   caseView = t.dataset.v; showView('cases'); }
  if (a === 'case-toggle'){ caseFilter[t.dataset.key] = !caseFilter[t.dataset.key]; showView('cases'); }
  if (a === 'case-open'){   showView('case-detail', t.dataset.id); }

  // ── Field forms, visits, actions ──
  if (a === 'exp-new'){     expenseModal(); }
  if (a === 'fin-fund'){    financeFund = t.dataset.fund; showView('finance'); }

  // ── Report centre ──
  if (a === 'rep-gen'){     repGenerate(t.dataset.id, t.dataset.period,
                              t.dataset.act ? {activity:appData.activities.find(x=>x.id===t.dataset.act)}
                            : t.dataset.visit ? {visit:appData.visits.find(x=>x.id===t.dataset.visit)} : {}); }
  // ── Quality check ──
  if (a === 'qc-apply'){
    const before = calcQualityScore().score;
    const r = applyQualityFix(t.dataset.id);
    const f = appData.qualityFindings.find(x => x.id === t.dataset.id);
    showView('quality');
    toast(r ? `${t.dataset.id} applied. Score ${before} to ${r.score}. ${f.applied}`
            : 'That finding has already been dealt with.', 'ok');
  }
  if (a === 'qc-ignore'){
    const f = appData.qualityFindings.find(x => x.id === t.dataset.id);
    if (f) f.state = 'ignored';
    showView('quality');
    toast(`${t.dataset.id} ignored. It stays on the list so the decision is visible, and does not change the score.`, 'warn');
  }
  if (a === 'qc-reset'){
    const f = appData.qualityFindings.find(x => x.id === t.dataset.id);
    if (f){ f.state = 'open'; delete f.applied; }
    showView('quality');
    toast(`${t.dataset.id} reopened.`, 'ok');
  }

  // ── Branding ──
  if (a === 'brand-reset'){ brandReset(); showView('config');
    toast('Colours reset to the provisional palette.', 'ok'); }
  if (a === 'brand-preset'){
    brandSet('--brand', t.dataset.brand); brandSet('--accent', t.dataset.accent);
    showView('config');
    toast('Palette applied. Charts and generated documents follow it.', 'ok');
  }
  if (a === 'brand-logo-clear'){
    appData.config.brand.logo = null;
    const mk = document.getElementById('sb-mark');
    if (mk){ mk.innerHTML = 'FPC'; mk.classList.remove('has-logo'); }
    showView('config'); toast('Logo removed.', 'ok');
  }

  // ── Naming the registry ──
  if (a === 'names-edit')  namesEditModal();
  if (a === 'names-paste') namesPasteModal();
  if (a === 'names-done'){ closeModal(); showView('config');
    toast(`${namedCount()} of ${namableCodes().length} names set.`, 'ok'); }
  if (a === 'names-import'){
    const box = document.getElementById('names-paste');
    const r = importNames(box ? box.value : '');
    closeModal(); showView('config');
    toast(r.set
      ? `${r.set} names imported.` + (r.unknown.length
          ? ` ${r.unknown.length} code${r.unknown.length===1?'':'s'} not recognised and skipped: ${r.unknown.slice(0,4).join(', ')}${r.unknown.length>4?'…':''}`
          : '')
      : 'Nothing was imported — each line needs a known code and a name.',
      r.set ? (r.unknown.length ? 'warn' : 'ok') : 'warn');
  }
  if (a === 'names-clear'){
    appData.config.names = {}; showView('config');
    toast('Names cleared. The codes stand in again.', 'warn');
  }

  if (a === 'guide-build') guideBuild();

  // ── Ask Eval360 ──
  if (a === 'ai-ask'){   aiAsk(t.dataset.q); }
  if (a === 'ai-clear'){ aiLog.length = 0; showView('ai'); }

  if (a === 'rep-pick'){
    const id = t.dataset.id, key = t.dataset.key;
    closeModal();
    const ctx2 = id === 'cssf-activity'
      ? {activity:appData.activities.find(x => x.id === key)}
      : {visit:appData.visits.find(x => x.id === key)};
    const per = ctx2.activity ? ctx2.activity.period
              : (ctx2.visit ? periodOf(ctx2.visit.date) : '2026-Q2');
    repGenerate(id, per, ctx2);
  }
  if (a === 'rep-sources'){ reportState.showSources = !reportState.showSources;
                            showView('report-preview'); }
  if (a === 'rep-print'){   repPrint(); }
  if (a === 'rep-doc'){     repDownloadDoc(); }
  if (a === 'rep-csv'){     repAnnex3Csv(); }
  if (a === 'rep-submit'){  reportState.submitted[reportState.open.id] = appData.config.today;
                            showView('report-preview');
                            toast(`${appData.reportTemplates[reportState.open.id].name} marked as submitted on ${fmtDate(appData.config.today)}.`, 'ok'); }
  if (a === 'rep-regen'){   delete (reportState.edits[reportState.open.id] || {})[t.dataset.sec];
                            showView('report-preview');
                            toast('Section redrafted from the current data.', 'ok'); }
  if (a === 'rep-edit'){    repEditSection(t.dataset.sec); }
  if (a === 'form-open'){   formOpen(t.dataset.id); }
  if (a === 'visit-open'){  showView('visit-detail', t.dataset.id); }
  if (a === 'remind'){
    const act = appData.actions.find(x => x.id === t.dataset.id);
    toast(`Reminder sent to ${t.dataset.owner}${act ? ` about ${act.id}, due ${fmtDate(act.due)}` : ''}.`,
          act && act.status === 'overdue' ? 'warn' : 'ok');
  }
});

/* Selects and text inputs need change/keydown, not click. */
document.addEventListener('change', e => {
  const t = e.target.closest('[data-action]');
  if (!t) return;

  /* Every colour in the system resolves from a token, so setting one on the
     root recolours the whole product — charts and generated documents too. */
  if (t.dataset.action === 'brand-colour'){
    brandSet(t.dataset.var, t.value);
    toast(`${t.dataset.var} set to ${t.value}. Charts and documents follow it.`, 'ok');
    return;
  }
  if (t.dataset.action === 'brand-logo'){
    const file = t.files && t.files[0];
    if (!file) return;
    const fr = new FileReader();
    fr.onload = () => {
      appData.config.brand.logo = String(fr.result);
      showView('config'); brandApply();
      toast('Logo loaded. It is in the sidebar and on every generated document.', 'ok');
    };
    fr.readAsDataURL(file);
    return;
  }
  if (t.dataset.action === 'name-set'){
    const v = t.value.trim();
    if (v) appData.config.names[t.dataset.code] = v;
    else   delete appData.config.names[t.dataset.code];
    return;                       // the modal stays open; the screen redraws on Done
  }
  if (t.dataset.action === 'cal-days'){
    const r = appData.config.calendar[t.dataset.id];
    if (r){ r.daysAfter = Math.max(0, Math.min(120, Number(t.value) || 0)); }
    showView('config');
    toast(`${appData.reportTemplates[t.dataset.id].name} now due ${r.daysAfter} days after the ${r.basis} ends. Countdowns updated.`, 'ok');
    return;
  }
  if (t.dataset.action === 'cal-confirm'){
    const r = appData.config.calendar[t.dataset.id];
    if (r) r.assumed = !t.checked;
    showView('config');
    toast(r.assumed ? 'Marked as an assumption again.'
                    : 'Confirmed against the grant agreement.', r.assumed ? 'warn' : 'ok');
    return;
  }
  if (t.dataset.action === 'ind-filter'){ indFilter[t.dataset.key] = t.value; showView('indicators'); }
  if (t.dataset.action === 'case-filter'){ caseFilter[t.dataset.key] = t.value; showView('cases'); }

  /* The §11.2 demo moment: move a case and the indicators move with it. The
     before/after delta is reported in the toast so the change is visible
     without navigating away from the case. */
  if (t.dataset.action === 'case-status'){
    const c = appData.cases.find(x => x.id === t.dataset.id);
    if (!c) return;
    const before = {so2:calcIndicator('SO2').value, so4:calcIndicator('SO4').value,
                    i21:calcIndicator('2.1').value};
    const was = c.status;
    c.status = t.value;

    // A conclusion needs a date, and reopening a case clears it again.
    if ((c.status === 'Concluded' || c.status === 'Closed – no further action') && !c.closedDate){
      c.closedDate = appData.config.today;
      c.timeline.push({date:c.closedDate, event:`Case ${c.status.toLowerCase()}`});
    }
    if (c.status !== 'Concluded' && c.status !== 'Closed – no further action'){
      c.closedDate = null;
      c.timeline = c.timeline.filter(x => !x.event.startsWith('Case '));
    }
    appData.auditLog.unshift({ts:nowStamp(), user:currentUser.title,
      action:`Changed status: ${was} to ${c.status}`, ref:c.id});

    const after = {so2:calcIndicator('SO2').value, so4:calcIndicator('SO4').value,
                   i21:calcIndicator('2.1').value};
    const moves = [];
    if (after.so2 !== before.so2) moves.push(`SO2 ${before.so2}% to ${after.so2}%`);
    if (after.i21 !== before.i21) moves.push(`2.1 ${before.i21}% to ${after.i21}%`);
    if (after.so4 !== before.so4) moves.push(`SO4 ${before.so4}% to ${after.so4}%`);

    showView(currentView, currentView === 'case-detail' ? c.id : undefined);
    toast(moves.length ? `${c.id} moved to ${c.status}. ${moves.join(' · ')}.`
                       : `${c.id} moved to ${c.status}.`, 'ok');
  }
});

document.addEventListener('keydown', e => {
  const t = e.target.closest('[data-action="variance"]');
  if (t && e.key === 'Enter'){
    e.preventDefault();
    appData.varianceComments[t.dataset.key] = t.value.trim();
    const ready = calcCompleteness('knh-quarterly');
    showView('target-groups');
    toast(`Variance recorded. KNH quarterly report now ${ready.pct}% ready.`, 'ok');
  }
});

/* Record-result form — updates appData, so every dependent screen moves. */
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-action="rec-submit"]');
  if (!f) return;
  e.preventDefault();
  const code = f.dataset.code;
  const ind  = appData.indicators.find(i => i.code === code);
  if (!ind) return;
  const fd = new FormData(f);
  const nu = Number(fd.get('num')), de = Number(fd.get('den')) || null;
  const period = String(fd.get('period'));
  const value = de ? Math.round(nu/de*1000)/10 : nu;

  const existing = ind.results.find(r => r.period === period);
  const entry = {period, num:nu, den:de, value, comment:String(fd.get('comment')||''), evidence:[]};
  if (existing) Object.assign(existing, entry); else ind.results.push(entry);
  ind.results.sort((a2,b2) => a2.period.localeCompare(b2.period));

  showView('indicator-detail', code);
  toast(`${code} recorded as ${value}${ind.unit==='percent'?'%':''} for ${period}. Dependent screens updated.`, 'ok');
});

/* Ask Eval360 — the question box. */
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-action="ai-send"]');
  if (!f) return;
  e.preventDefault();
  const ta = f.querySelector('textarea');
  const q = ta ? ta.value : '';
  if (ta) ta.value = '';
  aiAsk(q);
});

/* The expense form sits in a modal, not the phone frame. */
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-action="exp-submit"]');
  if (!f) return;
  e.preventDefault();
  postExpense(new FormData(f));
});

/* Field forms submitted from the phone frame. */
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-action="phone-submit"]');
  if (!f) return;
  e.preventDefault();
  const fd = new FormData(f);
  if (f.dataset.id === 'attendance')            submitAttendance(fd);
  else if (f.dataset.id === 'bylaws-checklist') submitBylaws(fd);
  else if (f.dataset.id === 'case-intake')      submitCaseIntake(fd);
  else if (f.dataset.id === 'visit-report')     submitVisit(fd);
  else { closeModal(); toast('This form is shown for its field layout only in the demo.', 'warn'); }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function showChecks(){
  const r = appData.checkSnapshot || runConsistencyChecks();
  const rows = r.results.map(c => `<tr>
      <td style="width:26px">${c.pass
        ? '<i class="bi bi-check-circle-fill" style="color:var(--ok)"></i>'
        : '<i class="bi bi-x-circle-fill" style="color:var(--bad)"></i>'}</td>
      <td>${esc(c.name)}</td>
      <td class="mono" style="font-size:11px;color:var(--ink-mute);text-align:right">
        ${c.pass ? '' : esc(JSON.stringify(c.got)) + ' &ne; ' + esc(JSON.stringify(c.want))}</td>
    </tr>`).join('');

  openModal({
    wide:true,
    title:`Data consistency checks — ${r.passed} of ${r.total} passed`,
    body:`<p style="margin:0 0 12px;color:var(--ink-soft);font-size:12.5px;line-height:1.6">
        Every figure in this demo is derived rather than typed, so these checks assert that the
        derivations agree with the project's own documents — attendance sums to the target-group
        table, activity costs sum to reported spend, case counts match the register.
        They were run against the data as it loaded; figures you change during a session are
        deliberately not re-asserted here.</p>
      <div class="tbl-scroll" style="max-height:52vh"><table class="dt"><tbody>${rows}</tbody></table></div>`,
    foot:`<button class="btn" data-action="close-modal">Close</button>`
  });
}

function buildRoleSelector(){
  const sel = document.getElementById('role-sel');
  sel.innerHTML = appData.users.map(u =>
    `<option value="${u.id}">${esc(u.name.length>34 ? u.title : u.name)}</option>`).join('');
  sel.value = currentUser.id;
  sel.addEventListener('change', () => {
    currentUser = appData.users.find(u => u.id === sel.value);
    document.getElementById('tb-avatar').textContent = currentUser.initials;
    // If the new role cannot reach the current view, fall back to the dashboard.
    const target = access(currentView) === 'none' ? 'dashboard' : currentView;
    showView(target);
    toast(`Viewing as ${currentUser.title}${currentUser.caseAccess ? ' · case detail unlocked' : ' · case detail restricted'}`,
          currentUser.caseAccess ? 'ok' : 'warn');
  });
}

function buildPeriodSelector(){
  const sel = document.getElementById('period-sel');
  sel.innerHTML = appData.periods.map(p =>
    `<option value="${p.id}">${esc(p.label)}${p.state==='due'?' — due':''}</option>`).join('');
  sel.value = currentPeriod.id;
  sel.addEventListener('change', () => {
    currentPeriod = appData.periods.find(p => p.id === sel.value);
    showView(currentView);
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   12. INIT
   ═══════════════════════════════════════════════════════════════════════════ */
(function init(){
  seedAll();
  const r = appData.checkSnapshot = runConsistencyChecks();
  document.getElementById('check-chip-text').textContent =
    r.failures.length ? `${r.failures.length} of ${r.total} data checks failed`
                      : `${r.passed} data checks passed`;
  if (r.failures.length)
    document.getElementById('check-chip').querySelector('i').className = 'bi bi-exclamation-triangle-fill';

  document.getElementById('tb-avatar').textContent = currentUser.initials;
  buildRoleSelector();
  buildPeriodSelector();
  buildSidebar();
  showView('dashboard');

  console.log('Eval360 · FPC demo.',
    appData.logframe.nodes.length + 2, 'logframe nodes,',
    Object.keys(appData.reportTemplates).length, 'report templates,',
    appData.users.length, 'users.');
})();
</script>
