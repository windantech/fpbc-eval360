/* ═══════════════════════════════════════════════════════════════════════════
   8h. CHILD RIGHTS COUNCILS — brief §7.6
   ═══════════════════════════════════════════════════════════════════════════ */
const COC_STATE = {
  in_use:    {label:'In use',    tone:'ok',   icon:'bi-check-circle-fill'},
  developed: {label:'Developed', tone:'warn', icon:'bi-file-earmark-check'},
  not_yet:   {label:'Not yet',   tone:'bad',  icon:'bi-dash-circle'}
};

function renderVcrcs(){
  const v = appData.registry.vcrcs;
  const inUse = v.filter(x => x.codeOfConduct === 'in_use').length;
  const developed = v.filter(x => x.codeOfConduct !== 'not_yet').length;
  const members = v.reduce((t,x) => t + x.members, 0);
  const avgFunc = Math.round(v.reduce((t,x) => t + x.functionality, 0) / v.length);

  afterRender(() => {
    const T = chartTheme();
    const sorted = v.slice().sort((a,b) => b.functionality - a.functionality);
    mountChart('ch-func', {type:'bar',
      data:{labels:sorted.map(x => x.code.replace('VCRC-','')),
            datasets:[{data:sorted.map(x => x.functionality),
              backgroundColor:sorted.map(x => x.functionality >= 70 ? T.ok : x.functionality >= 50 ? T.warn : T.bad),
              borderRadius:3}]},
      options:{scales:{y:{max:100, grid:{color:T.line}, ticks:{color:T.mute, font:{size:10}}},
                       x:{grid:{display:false}, ticks:{color:T.mute, font:{size:9}}}},
        plugins:{tooltip:{callbacks:{label:cx => ` Functionality ${cx.parsed.y}/100`}}}}});

    mountChart('ch-coc', {type:'doughnut',
      data:{labels:['In use','Developed, not yet used','Not developed'],
            datasets:[{data:[inUse, developed-inUse, v.length-developed],
              backgroundColor:[T.ok, T.warn, T.line], borderWidth:0}]},
      options:{cutout:'62%', scales:{x:{display:false}, y:{display:false}},
        plugins:{legend:{display:true, position:'bottom', labels:{color:T.ink, font:{size:10}, boxWidth:9, padding:8}}}}});
  });

  // Child participation — brief §7.6 and KNH annual §4.
  const implAct = appData.activities.filter(a => a.status === 'done' &&
    (a.attendance||[]).some(x => x.group === 'general_children'));
  const monAct = appData.activities.filter(a =>
    ['1.3.1.1','1.3.1.4','1.3.1.6','1.3.3.1'].includes(a.code) && a.status === 'done');

    t + (a.attendance||[]).filter(x=>x.group==='general_children').reduce((u,x)=>u+x.m+x.f,0), 0);

  const cards = v.map(x => {
    const cs = COC_STATE[x.codeOfConduct];
    const tone = x.functionality >= 70 ? 'ok' : x.functionality >= 50 ? 'warn' : 'bad';

      <div class="m-top">

          <div class="m-score" style="color:var(--${tone})">${x.functionality}</div>
          <div style="font-size:9.5px;color:var(--ink-mute)">functionality</div></div>
      </div>
      ${progressBar(x.functionality, tone)}
      <div class="m-rows">
        <div class="m-r"><span>Members</span><span>${x.members} · ${x.male}M / ${x.female}F</span></div>
        <div class="m-r"><span>Child leaders</span><span>${x.childLeaders}</span></div>
        <div class="m-r"><span>Code of conduct</span><span>${chip(cs.label, cs.tone, cs.icon)}</span></div>
        <div class="m-r"><span>Meetings this quarter</span><span>${x.meetingsThisQuarter}</span></div>
        <div class="m-r"><span>Last follow-up</span><span>${fmtDate(x.lastFollowUp)}</span></div>
      </div></div>`;
  }).join('');

  return `<div class="sec-title">Village Child Rights Councils</div>
    <div class="sec-sub">${v.length} councils across both GVHs. ${appData.registry.note}</div>

    <div class="kpi-row">
      ${kpiTile('Active VCRCs', `${v.length}/15`, 'Output 1.1.1 target met')}
      ${kpiTile('Child members', num(members),
        `${v.reduce((t,x)=>t+x.male,0)} boys · ${v.reduce((t,x)=>t+x.female,0)} girls`)}
      ${kpiTile('Codes of conduct in use', `${inUse}/15`,
        `Output 1.1.2 target 15 by March 2029`, inUse>=15?'ok':'warn')}
      ${kpiTile('Mean functionality', avgFunc + '/100',
        `${v.filter(x=>x.functionality>=70).length} councils at 70 or above`)}
    </div>

    <div class="panel-grid">
      <div class="card"><div class="card-head"><h3>Functionality score by council</h3>
        <span style="font-size:11px;color:var(--ink-mute)">${chip('70+','ok')} ${chip('50–69','warn')} ${chip('under 50','bad')}</span></div>
        <div class="chart-wrap"><canvas id="ch-func"></canvas></div></div>
      <div class="card"><div class="card-head"><h3>Codes of conduct</h3>
        <span style="font-size:11px;color:var(--ink-mute)">Output 1.1.2</span></div>
        <div class="chart-wrap"><canvas id="ch-coc"></canvas></div></div>
    </div>

    <div class="card" style="margin-bottom:18px">
      <div class="card-head"><h3>Child participation</h3>
        <span style="font-size:11px;color:var(--ink-mute)">KNH quarterly §4 · annual §4</span></div>
      <div class="card-body">
        <div class="panel-grid" style="margin:0">
          <div>
            <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
                        color:var(--ink-mute);margin-bottom:6px">§4.1 In implementation</div>
            <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:8px">
              ${childrenInImpl ? num(childrenInImpl) : 0} child participations across
              ${implAct.length} activities this project year.</div>
            ${implAct.map(a=>`<div style="font-size:12px;padding:5px 0;border-bottom:1px solid var(--line-soft)">
              <span class="mono" style="font-size:10.5px;color:var(--ink-mute)">${esc(a.code)}</span>
              ${esc(a.title.slice(0,54))}${a.title.length>54?'…':''}
              <span style="float:right;font-variant-numeric:tabular-nums">${num(
                (a.attendance||[]).filter(x=>x.group==='general_children').reduce((u,x)=>u+x.m+x.f,0))}</span>
            </div>`).join('')}
          </div>
          <div>
            <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
                        color:var(--ink-mute);margin-bottom:6px">§4.2 In monitoring and steering</div>
            <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:8px">
              Children led the Community Score Card issue selection and took part in joint
              stakeholder verification.</div>
            ${monAct.map(a=>`<div style="font-size:12px;padding:5px 0;border-bottom:1px solid var(--line-soft)">
              <span class="mono" style="font-size:10.5px;color:var(--ink-mute)">${esc(a.code)}</span>
              ${esc(a.title.slice(0,54))}${a.title.length>54?'…':''}</div>`).join('')}
            <div style="font-size:12px;margin-top:9px">
              ${chip(`${appData.csc.agreedActions.filter(x=>x.status==='delivered').length} community actions influenced`,'ok','bi-check-circle-fill')}
              <span style="color:var(--ink-mute);margin-left:4px">Output 1.3.3 target 20</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="sec-title" style="font-size:14px">Councils</div>
    <div class="card-grid">${cards}</div>`;
}

         backgroundColor:T.brand, borderRadius:3},

         backgroundColor:T.accent, borderRadius:3}]},
      options:{plugins:{legend:{display:true, labels:{color:T.ink, font:{size:10}, boxWidth:10}}},
        scales:{x:{stacked:true, grid:{display:false}, ticks:{color:T.mute, font:{size:10}}},

  const rows = cb.map(c => {

      <td class="mono" style="font-size:11px">${esc(c.code)}</td>

      <td style="min-width:96px">${progressBar(c.qualityScore, tone)}

      <td>${c.talkingWallPainted ? chip('Painted','ok','bi-check-circle-fill') : chip('Not yet','grey','bi-dash-circle')}</td>
      <td class="n">${c.transitionedToPrimary}</td>
      <td>${c.supportVisitDone ? fmtDate(c.lastSupportVisit) : chip('Not visited','warn','bi-exclamation-triangle-fill')}</td>
    </tr>`;

  // The indicators this screen drives.
  const indCodes = ['3.1','3.3','3.3.2','3.3.3','OO-b'];

    <div class="card" style="margin-bottom:18px">
      <div class="card-head"><h3>Indicators computed from this register</h3>
        <span style="font-size:11px;color:var(--ink-mute)">change a centre and these move</span></div>
      <div class="tbl-scroll"><table class="dt">

      <div class="tbl-scroll"><table class="dt">
        <thead><tr><th>Code</th><th>GVH</th><th class="n">Boys</th><th class="n">Girls</th>

          <th>Quality</th><th>Talking wall</th><th class="n">To primary</th><th>Last visit</th></tr></thead>

/* ═══════════════════════════════════════════════════════════════════════════
   8j. COMMUNITY SCORE CARD — brief §7.8
   ═══════════════════════════════════════════════════════════════════════════ */
function renderCsc(){
  const C = appData.csc;

  const progress = {MK:calcCscProgress('MK'), MJ:calcCscProgress('MJ')};

  const stepper = gvh => {
    const pr = progress[gvh];
    return `<div class="card" style="margin-bottom:16px">
      <div class="card-head">
        <h3>${esc(GVH_NAME[gvh])}</h3>
        <span style="font-size:11.5px;color:var(--ink-mute)">
          Service under assessment: <strong>${esc(pr.service)}</strong></span>
      </div>
      <div class="card-body">
        <div class="stepper">
          ${C.steps.map((s,i) => {
            const n = i+1;
            const cls = n <= pr.done ? 'done' : n === pr.inProgress ? 'doing' : 'todo';
            const ic  = n <= pr.done ? 'bi-check' : n === pr.inProgress ? 'bi-three-dots' : '';
            return `<div class="step ${cls}" title="${esc(s)}">
              <div class="s-n">${ic?`<i class="bi ${ic}"></i>`:n}</div>
              <div class="s-l">${esc(s)}</div></div>`;
          }).join('')}
        </div>
        <div style="font-size:11.5px;color:var(--ink-mute);margin-top:9px">
          ${pr.done} of ${C.steps.length} steps complete · step ${pr.inProgress}
          (${esc(C.steps[pr.inProgress-1])}) under way.
          Scoring and the interface meeting fall in Q3.
        </div>
      </div>
    </div>`;
  };

  // The scorecard itself only has meaning once scoring has happened, which it
  // has not. Showing it as provisional is more honest than showing it as data.
  const scoringReached = Math.max(progress.MK.done, progress.MJ.done) >= 6;
  const dots = (v, prov) => `<span class="dots">${[1,2,3,4,5].map(i =>
    `<i class="${i<=v?'on':''}${prov?' prov':''}"></i>`).join('')}</span>`;

  const scTable = `
    <div class="card" style="margin-bottom:18px">
      <div class="card-head"><h3>Scorecard</h3>
        ${scoringReached ? chip('Scored','ok','bi-check-circle-fill')
                         : chip('Illustrative — scoring is step 6','accent','bi-hourglass-split')}</div>
      <div class="tbl-scroll"><table class="sc-table">
        <thead><tr><th>Indicator</th><th style="text-align:center">Service users</th>
          <th style="text-align:center">Service providers</th><th style="text-align:center">Gap</th></tr></thead>
        <tbody>${C.scorecard.map(r => {
          const gap = Math.abs(r.provider - r.user);
          const cls = gap >= 2 ? 'big' : gap === 1 ? 'mid' : 'ok';
          return `<tr><td>${esc(r.indicator)}</td>
            <td class="n">${dots(r.user, !scoringReached)} <span style="margin-left:5px">${r.user}</span></td>
            <td class="n">${dots(r.provider, !scoringReached)} <span style="margin-left:5px">${r.provider}</span></td>
            <td class="n"><span class="gap-pill ${cls}">${gap>0?'+':''}${gap}</span></td></tr>`;
        }).join('')}</tbody>
      </table></div>
      <div class="card-body" style="padding-top:10px;font-size:11.5px;color:var(--ink-mute)">
        Scored 1–5 by service users and by providers separately. The gap is what the
        interface meeting negotiates. ${scoringReached ? '' :
        'These figures are placeholders until the step 6 and 7 scoring exercises run in Q3.'}
      </div>
    </div>`;

  const delivered = C.agreedActions.filter(a => a.status === 'delivered');
  const actions = `
    <div class="card">
      <div class="card-head"><h3>Agreed actions</h3>
        <span style="font-size:11.5px;color:var(--ink-mute)">
          feeds Output 1.3.3 — target 20 community actions by March 2029</span></div>
      <div class="card-body" style="padding-bottom:8px">
        <div style="display:flex;align-items:baseline;gap:9px;margin-bottom:4px">
          <span class="num-big" style="color:var(--brand)">${delivered.length}</span>
          <span style="font-size:12px;color:var(--ink-mute)">of 20 delivered</span>
        </div>
        ${progressBar(pct(delivered.length, 20), 'ok')}
      </div>
      <div class="tbl-scroll"><table class="dt">
        <thead><tr><th>Action</th><th>Owner</th><th>Status</th><th>Delivered</th></tr></thead>
        <tbody>${C.agreedActions.map(a => `<tr>
          <td>${esc(a.action)}</td><td>${esc(a.owner)}</td>
          <td>${a.status==='delivered' ? chip('Delivered','ok','bi-check-circle-fill')
                                       : chip('Pending','warn','bi-hourglass-split')}</td>
          <td>${a.date ? fmtDate(a.date) : '—'}</td></tr>`).join('')}
        </tbody></table></div>
    </div>`;

  return `<div class="sec-title">Community Score Card</div>
    <div class="sec-sub">FPC's nine-step scorecard process, run once per GVH per cycle.
      Activities 1.3.1.1 to 1.3.1.9 in the logframe.</div>
    ${stepper('MK')}${stepper('MJ')}${scTable}${actions}`;
}


/* ═══════════════════════════════════════════════════════════════════════════
   8k. CASE MANAGEMENT — brief §7.9. Restricted.
   ═══════════════════════════════════════════════════════════════════════════ */

const CASE_STATUSES = ['Reported','Assessed','Referred','Under follow-up','Concluded','Closed – no further action'];

/* Category severity drives only the card stripe, never the wording. */
const CAT_SEV = {
  'Sexual abuse':'high', 'Child marriage':'high', 'Physical violence':'high',
  'Child labour':'mid', 'Neglect':'mid', 'Emotional abuse':'mid',
  'School dropout / denial of education':'low', 'Other':'low'
};

/* Brief §9.4 — small-number suppression. Below GVH level, a cell holding one
   or two cases could identify a child, so it is never printed. */
function suppress(n){
  return (n > 0 && n < 3) ? '<span class="supp">&lt;3</span>' : num(n);
}

let caseView = 'kanban';            // 'kanban' | 'list'
let caseFilter = {category:'', gvh:'', sex:'', ageBand:'', pwd:false, reportedBy:'', framework:''};

function renderCases(){
  const stats = calcCaseStats({includeQ3:true});
  const canSee = currentUser.caseAccess;

  /* ── Aggregates — shown to every role (brief §7.9) ────────────────────── */
  const aggregate = `
    <div class="kpi-row">
      ${kpiTile('Cases reported', num(stats.total),
        `${appData.cases.filter(c=>c.period==='2026-Q1').length} in Q1 · ${appData.cases.filter(c=>c.period==='2026-Q2').length} in Q2 · ${appData.cases.filter(c=>c.period==='2026-Q3').length} in Q3`)}
      ${kpiTile('Followed to completion', calcCaseStats({}).pct.concluded + '%',
        `${calcCaseStats({}).concluded} of ${calcCaseStats({}).total} · SO2 target 70%`, 'warn')}
      ${kpiTile('Median first response', stats.medianResponse + ' days',
        'From report to first assessment visit')}
      ${kpiTile('Receiving PSS', num(calcCaseStats({}).pss),
        `${calcCaseStats({}).pct.pss}% of survivors · SO4 target 50%`)}
    </div>

    <div class="panel-grid">
      <div class="card"><div class="card-head"><h3>By category</h3>
        <span style="font-size:11px;color:var(--ink-mute)">anonymised counts</span></div>
        <div class="tbl-scroll"><table class="dt">
          <thead><tr><th>Category</th><th class="n">Mwakasangira</th><th class="n">Mwanjasi</th><th class="n">Total</th></tr></thead>
          <tbody>${Object.entries(stats.byCategory).sort((a,b)=>b[1]-a[1]).map(([cat,n]) => {
            const mk = stats.cases.filter(c=>c.category===cat && c.gvh==='MK').length;
            const mj = stats.cases.filter(c=>c.category===cat && c.gvh==='MJ').length;
            return `<tr><td>${esc(cat)}</td><td class="n">${suppress(mk)}</td>
              <td class="n">${suppress(mj)}</td><td class="n"><strong>${n}</strong></td></tr>`;
          }).join('')}</tbody></table></div>
        <div class="card-body" style="padding-top:9px;font-size:11px;color:var(--ink-mute)">
          Cells holding fewer than three cases show “&lt;3”, so no child can be identified
          from a published table.
        </div></div>

      <div class="card"><div class="card-head"><h3>Referral pathway</h3>
        <span style="font-size:11px;color:var(--ink-mute)">FPC community case management</span></div>
        <div class="card-body">${referralPathway(stats)}</div></div>
    </div>`;

  /* ── Locked state for the six roles without case access ───────────────── */
  if (!canSee){
    /* The teaser behind the lock holds NO case data. A CSS blur hides nothing —
       the rows would still be in the DOM, and village + sex + age + category
       for one case is enough to identify a child in a village of this size.
       So the columns are shown as redaction bars instead: the shape of the
       record, none of its content. */
    const bar = w => `<span class="redact" style="width:${w}px"></span>`;
    const widths = [[62,74,66,44,18,34,70],[62,86,58,44,18,30,64],
                    [62,66,66,44,18,34,78],[62,78,58,44,18,30,58]];
    return `<div class="sec-title">Case Management</div>
      <div class="sec-sub">Child protection cases across both GVHs.</div>

      <div class="locked">
        <div class="locked-blur" aria-hidden="true">
          <table class="dt"><thead><tr><th>Case</th><th>Category</th><th>GVH</th><th>Village</th>
            <th>Sex</th><th>Age</th><th>Status</th></tr></thead>
            <tbody>${widths.map(r => `<tr>${r.map(w => `<td>${bar(w)}</td>`).join('')}</tr>`).join('')}
            </tbody></table>
        </div>
        <div class="locked-msg">
          <i class="bi bi-lock-fill big"></i>
          <h4>Case details are restricted</h4>
          <p>Only the <strong>Designated Safeguarding Focal Person</strong> and the
             <strong>Executive Director</strong> may open individual case records, under the
             FPC Child Protection Policy. You are signed in as
             ${esc(currentUser.title)}.</p>
          <p style="margin-top:8px"><strong>You can view anonymised statistics below.</strong></p>
          <p style="margin-top:6px;font-size:11.5px;color:var(--ink-mute)">Nothing above is
            hidden by a blur — no case record is loaded into this page at all.</p>
        </div>
      </div>

      ${aggregate}`;
  }

  /* ── Full access ──────────────────────────────────────────────────────── */
  let list = stats.cases;
  if (caseFilter.category)   list = list.filter(c => c.category === caseFilter.category);
  if (caseFilter.gvh)        list = list.filter(c => c.gvh === caseFilter.gvh);
  if (caseFilter.sex)        list = list.filter(c => c.sex === caseFilter.sex);
  if (caseFilter.ageBand)    list = list.filter(c => c.ageBand === caseFilter.ageBand);
  if (caseFilter.pwd)        list = list.filter(c => c.disability);
  if (caseFilter.reportedBy) list = list.filter(c => c.reportedBy === caseFilter.reportedBy);
  if (caseFilter.framework)  list = list.filter(c => c.frameworkApplied === caseFilter.framework);

  const filters = `
    <div class="filterbar">
      <select data-action="case-filter" data-key="category"><option value="">All categories</option>
        ${Object.keys(stats.byCategory).sort().map(c=>`<option ${caseFilter.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <select data-action="case-filter" data-key="gvh"><option value="">Both GVHs</option>
        <option value="MK" ${caseFilter.gvh==='MK'?'selected':''}>Mwakasangira</option>
        <option value="MJ" ${caseFilter.gvh==='MJ'?'selected':''}>Mwanjasi</option></select>
      <select data-action="case-filter" data-key="sex"><option value="">Any sex</option>
        <option value="M" ${caseFilter.sex==='M'?'selected':''}>Boys</option>
        <option value="F" ${caseFilter.sex==='F'?'selected':''}>Girls</option></select>
      <select data-action="case-filter" data-key="ageBand"><option value="">Any age</option>
        ${['0–5','6–12','13–17'].map(a=>`<option ${caseFilter.ageBand===a?'selected':''}>${a}</option>`).join('')}</select>
      <select data-action="case-filter" data-key="reportedBy"><option value="">Any reporter</option>
        ${[...new Set(appData.cases.map(c=>c.reportedBy))].sort().map(r=>`<option ${caseFilter.reportedBy===r?'selected':''}>${esc(r)}</option>`).join('')}</select>
      <select data-action="case-filter" data-key="framework"><option value="">Any framework</option>
        <option value="ccpja" ${caseFilter.framework==='ccpja'?'selected':''}>CCPJA</option>
        <option value="bylaw" ${caseFilter.framework==='bylaw'?'selected':''}>Community by-law</option>
        <option value="both"  ${caseFilter.framework==='both'?'selected':''}>Both</option>
        <option value="none"  ${caseFilter.framework==='none'?'selected':''}>None yet</option></select>
      <button class="fpill ${caseFilter.pwd?'on':''}" data-action="case-toggle" data-key="pwd">With disability</button>
      <span style="flex:1"></span>
      <button class="fpill ${caseView==='kanban'?'on':''}" data-action="case-view" data-v="kanban">Kanban</button>
      <button class="fpill ${caseView==='list'?'on':''}" data-action="case-view" data-v="list">List</button>
      <span style="font-size:11.5px;color:var(--ink-mute)">${list.length} of ${stats.total}</span>
    </div>`;

  const kanban = `
    <div class="kanban">
      ${CASE_STATUSES.map(st => {
        const col = list.filter(c => c.status === st);
        return `<div class="kcol">
          <div class="kcol-h"><span>${esc(st)}</span><b>${col.length}</b></div>
          ${col.map(c => `<div class="kcard sev-${CAT_SEV[c.category]||'low'}"
              data-action="case-open" data-id="${esc(c.id)}">
            <div class="kc-id">${esc(c.id)}</div>
            <div class="kc-cat">${esc(c.category)}</div>
            <div class="kc-meta">${esc(GVH_NAME[c.gvh])} · ${c.sex==='M'?'Boy':'Girl'} ${esc(c.ageBand)}
              ${c.disability?' · PwD':''}</div>
            <div class="kc-meta">${fmtDate(c.dateReported)}</div>
          </div>`).join('') || '<div style="font-size:11px;color:var(--ink-mute);padding:4px 2px">None</div>'}
        </div>`;
      }).join('')}
    </div>`;

  const listView = `
    <div class="card"><div class="tbl-scroll"><table class="dt">
      <thead><tr><th>Case</th><th>Reported</th><th>Category</th><th>GVH</th><th>Child</th>
        <th>Reported by</th><th>Framework</th><th class="n">Response</th><th>PSS</th><th>Status</th></tr></thead>
      <tbody>${list.map(c => `<tr>
        <td class="mono clickable" data-action="case-open" data-id="${esc(c.id)}"
          style="color:var(--brand);cursor:pointer">${esc(c.id)}</td>
        <td style="white-space:nowrap">${fmtDate(c.dateReported)}</td>
        <td>${esc(c.category)}</td>
        <td>${esc(GVH_NAME[c.gvh])}</td>
        <td>${c.sex==='M'?'Boy':'Girl'} ${esc(c.ageBand)}${c.disability?' · PwD':''}</td>
        <td style="font-size:11.5px">${esc(c.reportedBy)}</td>
        <td>${frameworkChip(c.frameworkApplied)}</td>
        <td class="n">${c.daysToFirstResponse}d</td>
        <td>${c.pssProvided ? chip(c.pssOutcome, c.pssOutcome==='Improved'?'ok':'warn') : '—'}</td>
        <td><select class="sel" style="font-size:11px;padding:3px 6px"
              data-action="case-status" data-id="${esc(c.id)}">
          ${CASE_STATUSES.map(s2=>`<option ${c.status===s2?'selected':''}>${esc(s2)}</option>`).join('')}
        </select></td></tr>`).join('')}
      </tbody></table></div></div>`;

  return `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
    <div><div class="sec-title">Case Management</div>
    <div class="sec-sub">${stats.total} child protection cases. Records are anonymised —
      no names are held, and every open is written to the access log.</div></div>
    <button class="btn btn-primary" data-action="form-open" data-id="case-intake">
      <i class="bi bi-plus-lg"></i> Register a case</button></div>
    ${filters}
    ${caseView === 'kanban' ? kanban : listView}
    <div style="margin-top:18px">${aggregate}</div>`;
}

function frameworkChip(f){
  return {ccpja:chip('CCPJA','brand'), bylaw:chip('By-law','accent'),
          both:chip('Both','ok'), none:chip('None yet','grey')}[f] || '—';
}

/* FPC's community case management flow, with live counts on each step. */
function referralPathway(stats){
  const c = stats.cases;
  const n = {
    reported: c.length,
    vcpc:     c.filter(x => ['VCPC','VCRC child'].includes(x.reportedBy)).length,
    community:c.filter(x => !['VCPC','VCRC child'].includes(x.reportedBy)).length,
    dswo:     c.filter(x => x.referredTo.includes('DSWO')).length,
    vsu:      c.filter(x => x.referredTo.includes('Police VSU')).length,
    health:   c.filter(x => x.referredTo.includes('Health (HSA)')).length,
    concluded:c.filter(x => x.status === 'Concluded').length
  };
  const box = (x,y,w,h,title,count,cls='') => `
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" class="${cls}"/>
    <text class="ttl" x="${x+w/2}" y="${y+17}" text-anchor="middle">${esc(title)}</text>
    <text class="n" x="${x+w/2}" y="${y+31}" text-anchor="middle">${count}</text>`;
  const arrow = (x1,y1,x2,y2) => `<path d="M${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}"/>`;

  return `<svg class="pathway" viewBox="0 0 700 230" role="img"
    aria-label="Referral pathway with case counts">
    ${box(10,30,120,42,'VCRC / VCPC',n.vcpc,'src')}
    ${box(10,124,120,42,'Community, parent, teacher, HSA',n.community,'src')}
    ${box(200,77,118,42,'GVH CPC assessment',n.reported)}
    ${box(388,14,128,42,'DSWO case file',n.dswo)}
    ${box(388,86,128,42,'Police VSU',n.vsu)}
    ${box(388,158,128,42,'Health (HSA)',n.health)}
    ${box(576,77,114,42,'Concluded',n.concluded)}
    ${arrow(130,51,200,92)}
    ${arrow(130,145,200,104)}
    ${arrow(318,90,388,35)}
    ${arrow(318,98,388,107)}
    ${arrow(318,106,388,179)}
    ${arrow(516,35,576,92)}
    ${arrow(516,107,576,98)}
    ${arrow(516,179,576,104)}
    <text x="350" y="222" text-anchor="middle" style="fill:var(--ink-mute);font-size:8.5px">
      Counts are cases that passed through each step, not a snapshot of where they sit now.
    </text>
  </svg>`;
}

/* ── Case detail — every open is logged (brief §7.9) ──────────────────── */
function renderCaseDetail(id){
  if (!currentUser.caseAccess){
    appData.auditLog.unshift({ts:nowStamp(), user:currentUser.title,
      action:'Denied — case detail restricted', ref:id});
    return `<div class="banner warn" style="margin-bottom:14px">
        <i class="bi bi-lock-fill"></i>
        <div><strong>Access denied.</strong> Case detail is restricted to the Designated
        Safeguarding Focal Person and the Executive Director. This attempt has been logged.</div></div>
      <button class="btn btn-sm" data-action="go" data-view="cases">
        <i class="bi bi-arrow-left"></i> Back to anonymised statistics</button>`;
  }

  const c = appData.cases.find(x => x.id === id);
  if (!c) return `<div class="banner warn"><i class="bi bi-exclamation-triangle-fill"></i><div>Case not found.</div></div>`;

  // Log the access before rendering anything.
  appData.auditLog.unshift({ts:nowStamp(), user:currentUser.title, action:'Viewed case detail', ref:c.id});

  // Brief §7.9 — the village is withheld where too few cases make it identifying.
  const villageCount = appData.cases.filter(x => x.village === c.village).length;
  const villageCell = villageCount >= 5 ? esc(placeName(c.village))
    : `<span class="supp">withheld — fewer than 5 cases in this village</span>`;

  const sv = CAT_SEV[c.category] || 'low';

  return `
    <button class="btn btn-sm btn-ghost" data-action="go" data-view="cases" style="margin-bottom:12px">
      <i class="bi bi-arrow-left"></i> All cases</button>

    <div class="sec-title"><span class="mono">${esc(c.id)}</span></div>
    <div class="sec-sub">${esc(c.category)} ·
      ${chip(c.status, c.status==='Concluded'?'ok':c.status==='Reported'?'grey':'warn')}
      · opened ${fmtDate(c.dateReported)}</div>

    <div class="banner info" style="margin-bottom:16px">
      <i class="bi bi-shield-lock-fill"></i>
      <div>No name, date of birth or household identifier is held for any case. This record
        is a <strong>${esc(c.sex==='M'?'boy':'girl')} aged ${esc(c.ageBand)}</strong> in
        ${esc(GVH_NAME[c.gvh])}. Your access has been written to the log.</div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start">
      <div>
        <div class="card" style="margin-bottom:18px">
          <div class="card-head"><h3>Case record</h3></div><div class="card-body">
            <table class="kv">
              <tr><td>Category</td><td><strong>${esc(c.category)}</strong>
                ${sv==='high'?chip('Higher sensitivity','bad'):''}</td></tr>
              <tr><td>Sex</td><td>${c.sex==='M'?'Boy':'Girl'}</td></tr>
              <tr><td>Age band</td><td>${esc(c.ageBand)}</td></tr>
              <tr><td>Disability</td><td>${c.disability?chip('Yes','info'):'No'}</td></tr>
              <tr><td>GVH</td><td>${esc(GVH_NAME[c.gvh])}</td></tr>
              <tr><td>Village</td><td>${villageCell}</td></tr>
              <tr><td>Reported by</td><td>${esc(c.reportedBy)}</td></tr>
              <tr><td>Days to first response</td><td><strong>${c.daysToFirstResponse}</strong>
                ${c.daysToFirstResponse <= 3 ? chip('Within target','ok') : chip('Over 3 days','warn')}</td></tr>
              <tr><td>Framework applied</td><td>${frameworkChip(c.frameworkApplied)}</td></tr>
              <tr><td>Referred to</td><td>${c.referredTo.length?c.referredTo.map(r=>chip(r,'brand')).join(' '):'Not yet referred'}</td></tr>
              <tr><td>Psychosocial support</td><td>${c.pssProvided
                ? `${chip('Provided','ok')} outcome: <strong>${esc(c.pssOutcome)}</strong>`
                : 'Not provided'}</td></tr>
              <tr><td>Closed</td><td>${c.closedDate?fmtDate(c.closedDate):'Open'}</td></tr>
            </table>
            <div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
                        color:var(--ink-mute);margin:15px 0 4px">Case note</div>
            <div style="font-size:12.5px;line-height:1.6">${esc(c.note)}</div>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h3>Timeline</h3></div><div class="card-body">
            ${c.timeline.map(t => `<div class="feed-item">
              <div class="f-ic"><i class="bi bi-dot"></i></div>
              <div><div>${esc(t.event)}</div><div class="f-d">${fmtDate(t.date)}</div></div>
            </div>`).join('')}
          </div>
        </div>
      </div>

      <div>
        <div class="card" style="margin-bottom:18px">
          <div class="card-head"><h3>Change status</h3></div><div class="card-body">
            <select class="sel" style="width:100%" data-action="case-status" data-id="${esc(c.id)}">
              ${CASE_STATUSES.map(s=>`<option ${c.status===s?'selected':''}>${esc(s)}</option>`).join('')}
            </select>
            <div style="font-size:11.5px;color:var(--ink-mute);margin-top:9px;line-height:1.5">
              Changing status recalculates SO2, 2.1, 2.2, 2.4, 2.5 and SO4 immediately,
              along with the dashboard tiles and every report that cites them.
            </div>
          </div>
        </div>

        <div class="card"><div class="card-head"><h3>Indicators this case feeds</h3></div>
          <div class="card-body" style="padding-top:6px">
            ${['SO2','2.1','2.2','2.4','2.5','SO4','4.1'].map(code => {
              const r = calcIndicator(code, currentPeriod.id);
              if (!r) return '';
              return `<div class="m-r" style="padding:6px 0;border-bottom:1px solid var(--line-soft)">
                <span><span class="mono" style="font-size:10.5px">${esc(code)}</span></span>
                <span>${fmtVal(r.value, r.indicator.unit)} ${statusChip(r.status)}</span></div>`;
            }).join('')}
          </div></div>
      </div>
    </div>`;
}

function nowStamp(){
  return appData.config.today + ' ' +
    new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

/* ═══════════════════════════════════════════════════════════════════════════
   8l. PSYCHOSOCIAL SUPPORT — brief §7.10
   ═══════════════════════════════════════════════════════════════════════════ */
function renderPss(){
  const s = calcCaseStats({});
  const pssCases = s.cases.filter(c => c.pssProvided);
  const outcomes = {Improved:0,'No change':0,Pending:0};
  pssCases.forEach(c => outcomes[c.pssOutcome] = (outcomes[c.pssOutcome]||0)+1);
  const timely = pssCases.filter(c => c.referralTimely).length;

  afterRender(() => {
    const T = chartTheme();
    mountChart('ch-pss', {type:'doughnut',

  const sg = appData.safeguarding;
  const signed = sg.policyAcknowledgements.filter(a => a.signed).length;
  const withConsent = appData.evidence.filter(e => e.consent).length;

  const auditCard = isDirector ? `
    <div class="card" style="margin-bottom:18px">
      <div class="card-head"><h3>Case access log</h3>
        <span style="font-size:11px;color:var(--ink-mute)">visible to the Executive Director</span></div>

        <strong>Amos Chindamba</strong> to see it.</div></div>`;

  return `<div class="sec-title">Safeguarding</div>
    <div class="sec-sub"><strong>Organisational</strong> safeguarding — concerns involving staff,
      volunteers or partners. Children's cases are held separately under Case Management.
      This is what KNH §5 and CSSF §5 ask for.</div>

    <div class="kpi-row">
      ${kpiTile('Incidents this quarter', String(sg.incidents.length),
        'Involving staff, volunteers or partners', sg.incidents.length?'bad':'ok')}
      ${kpiTile('Policy acknowledgements', `${signed}/${sg.policyAcknowledgements.length}`,
        'Child Protection Policy signed by all staff', signed===sg.policyAcknowledgements.length?'ok':'warn')}
      ${kpiTile('Awareness activities', String(sg.awareness.length),
        `${num(sg.awareness.reduce((t,a)=>t+a.reached,0))} people reached this project year`)}
      ${kpiTile('Photo consent on file', `${withConsent}/${appData.evidence.length}`,
        noConsent.length?`${noConsent.length} excluded from donor exports`:'All cleared',
        noConsent.length?'warn':'ok')}

      <div class="card"><div class="card-head"><h3>Awareness activities</h3></div>
        <div class="tbl-scroll"><table class="dt">
          <thead><tr><th>Date</th><th>Activity</th><th>Audience</th><th class="n">Reached</th></tr></thead>

             ['bi-file-earmark-x','No names in reports','Generated reports carry counts and categories, never case identifiers or village-level case data.'],

/* ── Phone-frame form (brief §7.12, §11.4) ────────────────────────────── */
function formOpen(id){
  const f = appData.fieldForms[id];
  if (!f) return;
  if (f.restricted && !currentUser.caseAccess){
    toast('Case intake is restricted to the Safeguarding Focal Person and Director.', 'warn');
    return;
  }

  const body = id === 'attendance'   ? phoneAttendance()
             : id === 'bylaws-checklist' ? phoneBylaws()
             : id === 'case-intake'  ? phoneCaseIntake()
             : id === 'visit-report' ? phoneVisit()
             : phoneGeneric(f);

  openModal({
    title:`${f.name} — mobile`,
    body:`<div class="phone-wrap"><div class="phone">
        <div class="phone-notch"><i></i></div>
        <div class="phone-bar">

  });

function postExpense(fd){
  const amount = Math.round(Number(fd.get('amount')) || 0);
  if (amount <= 0){ toast('Enter the amount in MWK.', 'warn'); return; }
  const date = String(fd.get('date') || appData.config.today);
  const e = {
    id:'EXP-' + String(appData.expenses.length + 1).padStart(3,'0'),
    date, period:periodOf(date), fund:String(fd.get('fund')), costLine:String(fd.get('line')),
    actualCost:amount, description:String(fd.get('desc') || '').trim() || COST_LINE_LABEL[String(fd.get('line'))],
    voucher:String(fd.get('voucher') || '').trim(), doc:String(fd.get('doc') || '').trim(),
    by:currentUser.title, posted:nowStamp()
  };
  appData.expenses.push(e);
  seedFinance();                         // spend totals, dashboard tile and reports follow
  financeFund = e.fund;
  closeModal();
  showView('finance');
  const fx = e.fund === 'knh' ? appData.config.fx.EUR_MWK : appData.config.fx.GBP_MWK;
  const cur = e.fund === 'knh' ? 'EUR' : 'GBP';
  const reported = reportedExpenses(e.fund).includes(e);
  toast(`${e.id} posted: MWK ${num(amount)} (${money(cur, Math.round(amount/fx))}) to ${COST_LINE_LABEL[e.costLine]}.` +
        (reported ? ' Spend, the burn rate and the donor reports now include it.'
                  : ` Dated ${e.period.slice(5)} 2026, so it will appear in that quarter's report.`), 'ok');
}

function submitCaseIntake(fd){
  const reported = String(fd.get('reported') || appData.config.today);
  const first    = String(fd.get('first') || '');
  const village  = String(fd.get('village'));
  const referral = String(fd.get('referral') || '');
  const days = first ? Math.max(0, Math.round((new Date(first) - new Date(reported)) / 864e5)) : null;
  const maxNo = Math.max(...appData.cases.map(c => Number(c.id.slice(-4))));
  const c = {
    id:`FPC-CP-2026-${String(maxNo + 1).padStart(4,'0')}`,
    dateReported:reported, period:periodOf(reported), gvh:village.slice(0,2), village,
    sex:String(fd.get('sex')), ageBand:String(fd.get('age')), disability:fd.has('pwd'),
    category:String(fd.get('category')), reportedBy:String(fd.get('by')),
    status: referral ? 'Referred' : (first ? 'Assessed' : 'Reported'),
    referredTo: referral ? [referral] : [], frameworkApplied:String(fd.get('framework')),
    pssProvided:false, pssOutcome:null, daysToFirstResponse: days ?? 0, closedDate:null,
    note:String(fd.get('note') || '').trim(), timeline:[]
  };
  c.timeline.push({date:reported, event:`Reported by ${c.reportedBy}`});
  if (first)    c.timeline.push({date:first, event:'First response — VCPC assessment visit'});
  if (referral) c.timeline.push({date:first || reported, event:`Referred to ${referral}`});
  appData.cases.push(c);
  appData.fieldForms['case-intake'].submissions = appData.cases.length;
  appData.auditLog.unshift({ts:nowStamp(), user:currentUser.title, action:'Case registered', ref:c.id});
  closeModal();
  showView('case-detail', c.id);
  toast(`${c.id} registered — no name recorded.` +
        (c.period === '2026-Q3' ? ' It counts in Q3; the Q2 figures already reported do not change.'
                                : ' The SO2 and SO4 indicators have been recalculated.'), 'ok');
}

/* ═══════════════════════════════════════════════════════════════════════════
   8q. EVIDENCE & STORIES — brief §7.15
   No photographs of children. Thumbnails are generated geometry, derived from
   each item's id so they are stable but carry no likeness.
   ═══════════════════════════════════════════════════════════════════════════ */
function abstractThumb(seed){
  let h = 0; for (let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) & 0xffff;
  const r = () => { h = (h*1103515245 + 12345) & 0x7fffffff; return (h >>> 16) / 65535; };
  const pal = [['#0d4d2a','#e3efe4'],['#d9822b','#fbecd9'],['#0e7490','#d6f0f6'],['#7c5618','#f7eed8']];
  const [fg,bg] = pal[Math.floor(r()*pal.length)];
  const shapes = Array.from({length:5}, () => {
    const t = r();
    const x = 10+r()*150, y = 10+r()*70, s = 12+r()*34;
    return t < 0.4 ? `<circle cx="${x}" cy="${y}" r="${s/2}" fill="${fg}" opacity="${0.18+r()*0.4}"/>`
         : t < 0.75 ? `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="3" fill="${fg}" opacity="${0.16+r()*0.38}"/>`
         : `<path d="M${x} ${y+s} L${x+s/2} ${y} L${x+s} ${y+s} Z" fill="${fg}" opacity="${0.16+r()*0.36}"/>`;
  }).join('');
  return `<svg class="gthumb" viewBox="0 0 186 110" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="186" height="110" fill="${bg}"/>${shapes}</svg>`;
}

  return `<div class="sec-title">Evidence &amp; stories</div>
    <div class="sec-sub">Photographs and written case studies, with consent tracked on every item.

    <div class="kpi-row">

/* ── Submitting a field form (brief §11.4) ────────────────────────────────
   The register is filled in once and everything downstream moves: the
   activity closes, the target-group table gains the attendance, and the
   output indicator gains a result. Nothing is typed twice. */
function submitAttendance(fd){
  const act = appData.activities.find(a => a.id === String(fd.get('activity')));
  if (!act){ toast('That activity could not be found.', 'bad'); return; }

  const group = String(fd.get('group'));
  const m  = Number(fd.get('m'))||0,    f  = Number(fd.get('f'))||0;
  const mP = Number(fd.get('mPwd'))||0, fP = Number(fd.get('fPwd'))||0;
  const total = m + f;
  if (!total){ toast('Enter the attendance before submitting.', 'warn'); return; }

  act.attendance = (act.attendance || []).concat([{group, m, mPwd:mP, f, fPwd:fP}]);
  act.status  = 'done';
  act.date    = String(fd.get('date')) || act.date;
  act.venue   = String(fd.get('venue')) || act.venue;
  act.outputs = String(fd.get('outputs')) || act.outputs;

  /* The output indicator is the activity's parent in the logframe —
     activity 1.3.1.4 reports into output 1.3.1. Attendance is only written
     where the indicator counts the people reached. An indicator that
     measures demonstrated skill or changed behaviour is NOT satisfied by a
     register, so it is left for a verification result and said so. */
  const outCode = act.code.split('.').slice(0,-1).join('.');
  const ind = appData.indicators.find(i => i.code === outCode);
  let move = '';
  if (ind && ind.unit !== 'number'){
    move = ` ${outCode} measures demonstrated change, so it still needs a verification result.`;
  } else if (ind){
    const was = calcIndicator(outCode, act.period);
    const prev  = ind.results.find(r => r.period === act.period);
    /* A count like "100 duty-bearers engaged" is cumulative, so the register
       adds to whatever the last reported quarter stood at — starting from
       zero would silently erase the 12 already engaged in Q2. */
    const prior = ind.results.filter(r => r.period < act.period).slice(-1)[0];
    const base  = prev ? prev.num : (prior ? prior.num : 0);
    const den  = (prev && prev.den) || (prior && prior.den) || ind.target || null;
    const newNum = base + total;
    const entry = {period:act.period, num:newNum, den,
                   comment:`Attendance register submitted from the field for ${act.id}.`, evidence:[]};
    if (prev) Object.assign(prev, entry); else ind.results.push(entry);
    ind.results.sort((a,b) => a.period.localeCompare(b.period));
    const now = calcIndicator(outCode, act.period);
    move = ` ${outCode} ${fmtVal(was.value, ind.unit)} to ${fmtVal(now.value, ind.unit)}.`;
  }

  // The register belongs to its own quarter, so the view follows it there.
  const movedPeriod = act.period !== currentPeriod.id;
  if (movedPeriod){
    currentPeriod = appData.periods.find(x => x.id === act.period) || currentPeriod;
    const sel = document.getElementById('period-sel');
    if (sel) sel.value = currentPeriod.id;
  }

  closeModal();
  showView('target-groups');
  toast(`${num(total)} participants recorded against ${act.id}.${move}` +
        (movedPeriod ? ` Now showing ${currentPeriod.label.split(' · ')[0]}.` : ''), 'ok');
}

function submitBylaws(fd){
  const f = appData.fieldForms['bylaws-checklist'];
  const answers = f.questions.map((_,i) => String(fd.get('q'+i) || 'no'));
  const gvh = String(fd.get('gvh'));
  const n = appData.bylawSubmissions.length + 1;

  const before = calcBylawScore(gvh).score;
  appData.bylawSubmissions.push({
    id:'BL-' + String(n).padStart(2,'0'), gvh, date:String(fd.get('date')),
    by:currentUser.title, answers,
    casesHandled:Number(fd.get('cases'))||0, minutes:true, photos:0
  });
  const after = calcBylawScore(gvh).score;
  appData.fieldForms['bylaws-checklist'].submissions = appData.bylawSubmissions.length;

  closeModal();
  showView('bylaws');
  toast(`Checklist recorded for ${GVH_NAME[gvh]}. Compliance ${before}% to ${after}%, ` +
        `and indicators 2.3 and 2.3.1 have moved with it.`, 'ok');
}


/* ═══════════════════════════════════════════════════════════════════════════
   9. REPORT GENERATORS — brief §8, §10
   One generator, six templates. Every quantitative block is built from
   appData, so a document can never state a figure the system does not hold.
   Narrative is drafted from the same figures and marked as a draft.
   ═══════════════════════════════════════════════════════════════════════════ */

/* A number in a narrative carries where it came from, so "Show data sources"
   can underline it and name the query (brief §10). */
function dn(value, source){
  return `<span class="dnum" data-src="${esc(source)}" title="${esc(source)}">${
    typeof value === 'number' ? num(value) : esc(String(value))}</span>`;
}
const pcN = (v, src) => dn(v + '%', src);

/* ── Shared building blocks ──────────────────────────────────────────── */
function blockAbbreviations(){
  const a = appData.abbreviations;
  const half = Math.ceil(a.length / 2);
  const col = rows => `<table><tbody>${rows.map(([k,v]) =>
    `<tr><th style="width:74px">${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table>`;
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    ${col(a.slice(0,half))}${col(a.slice(half))}</div>`;
}

function blockTargetGroups(period, cumulative){
  const rows = calcTargetGroups(period);
  const tot = k => rows.reduce((t,r) => t + r[k].m + r[k].f, 0);
  return `<table><thead><tr>
      <th rowspan="2" style="width:26%">Target group</th>
      <th colspan="2" class="n">Planned this quarter</th>
      <th colspan="2" class="n">Reached this quarter</th>
      ${cumulative ? '<th colspan="2" class="n">Cumulative to date</th>' : ''}
      <th rowspan="2" class="n">%</th></tr>
      <tr><th class="n">M</th><th class="n">F</th><th class="n">M</th><th class="n">F</th>
      ${cumulative ? '<th class="n">M</th><th class="n">F</th>' : ''}</tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${esc(r.label)}${r.source === 'enrolment'
        ? '<br><span style="font-size:10px;color:#7a8a81">standing enrolment, not attendance</span>' : ''}</td>
      <td class="n">${num(r.planned.m)}</td><td class="n">${num(r.planned.f)}</td>
      <td class="n">${num(r.reached.m)}</td><td class="n">${num(r.reached.f)}</td>
      ${cumulative ? `<td class="n">${num(r.cumulative.m)}</td><td class="n">${num(r.cumulative.f)}</td>` : ''}
      <td class="n">${r.achievement === null ? '—' : r.achievement + '%'}</td></tr>
      ${r.needsVariance ? `<tr><td colspan="${cumulative?8:6}" style="background:#fdf6dd;font-size:11px">
        <strong>Variance:</strong> ${r.varianceComment
          ? esc(r.varianceComment)
          : '<span style="color:#a32424">⚠ Explanation required — achievement below 80%.</span>'}</td></tr>` : ''}`).join('')}
    </tbody>
    <tfoot><tr><th>Total</th>
      <th class="n">${num(rows.reduce((t,r)=>t+r.planned.m,0))}</th>
      <th class="n">${num(rows.reduce((t,r)=>t+r.planned.f,0))}</th>
      <th class="n">${num(rows.reduce((t,r)=>t+r.reached.m,0))}</th>
      <th class="n">${num(rows.reduce((t,r)=>t+r.reached.f,0))}</th>
      ${cumulative ? `<th class="n">${num(rows.reduce((t,r)=>t+r.cumulative.m,0))}</th>
        <th class="n">${num(rows.reduce((t,r)=>t+r.cumulative.f,0))}</th>` : ''}
      <th class="n">${Math.round(tot('reached')/Math.max(1,tot('planned'))*100)}%</th></tr></tfoot>
  </table>
  <p style="font-size:11px;color:#5c6b63">Persons with disabilities are counted within the
    figures above: ${num(rows.reduce((t,r)=>t+r.reached.mPwd,0))} male and
    ${num(rows.reduce((t,r)=>t+r.reached.fPwd,0))} female this quarter.</p>`;
}

/* The indicator matrix in the donor's own column order:
   indicator | target at end | baseline | current value (cumulative) | observations */
function blockIndicatorMatrix(period){
  const rows = calcAllIndicators(period);
  const order = ['overall_objective','sub_objective','use_of_output','output'];
  const group = {};
  rows.forEach(r => { (group[r.indicator.level] = group[r.indicator.level] || []).push(r); });
  const label = {overall_objective:'Overall objective', sub_objective:'Sub-objectives',
                 use_of_output:'Use of Output indicators', output:'Output indicators'};

  return `<table><thead><tr><th style="width:40%">Indicator as in the logframe</th>
      <th class="n">Target at end</th><th class="n">Baseline</th>
      <th class="n">Current value</th><th style="width:24%">Observations</th></tr></thead>
    <tbody>${order.filter(l => group[l]).map(l => `
      <tr><th colspan="5" style="background:#e7ece8">${esc(label[l])}</th></tr>
      ${group[l].map(r => `<tr>
        <td><strong>${esc(r.indicator.code)}</strong> ${esc(r.indicator.text)}</td>
        <td class="n">${r.indicator.target === null ? '—'
          : num(r.indicator.target) + (r.indicator.unit === 'percent' ? '%' : '')}</td>
        <td class="n">${r.indicator.baseline === null
          ? '<span style="color:#a32424">none</span>' : num(r.indicator.baseline)}</td>
        <td class="n">${r.value === null ? '—' : fmtVal(r.value, r.indicator.unit)}</td>
        <td>${esc(r.note || r.status.label)}</td></tr>`).join('')}`).join('')}
    </tbody></table>`;
}

function blockCaseSummary(period){
  const s = calcCaseStats({period});
  const cats = Object.entries(s.byCategory).sort((a,b) => b[1]-a[1]);
  return `<table><thead><tr><th>Category of case</th><th class="n">Boys</th><th class="n">Girls</th>
      <th class="n">Total</th><th class="n">Referred</th><th class="n">Concluded</th></tr></thead>
    <tbody>${cats.map(([c,n2]) => {
      const set = s.cases.filter(x => x.category === c);
      const b = set.filter(x => x.sex === 'M').length, g = set.filter(x => x.sex === 'F').length;
      return `<tr><td>${esc(c)}</td>
        <td class="n">${suppress(b)}</td><td class="n">${suppress(g)}</td>
        <td class="n"><strong>${n2}</strong></td>
        <td class="n">${set.filter(x => x.referredTo.length).length}</td>
        <td class="n">${set.filter(x => x.status === 'Concluded').length}</td></tr>`;
    }).join('')}</tbody>
    <tfoot><tr><th>Total</th>
      <th class="n">${s.bySex.M || 0}</th><th class="n">${s.bySex.F || 0}</th>
      <th class="n">${s.total}</th><th class="n">${s.referredInPeriod}</th>
      <th class="n">${s.concludedInPeriod}</th></tr></tfoot></table>
  <p style="font-size:11px;color:#5c6b63">No case identifiers, names or village-level figures are
    included in this report. Totals are given in full; the boys/girls split is shown as
    “&lt;3” where it falls below three, because category and sex together are what could identify
    an individual child in a community of this size. Referral and conclusion counts are process
    figures and are given in full.</p>`;
}

function blockAttendanceTable(act){
  const rows = (act.attendance || []);
  const t = k => rows.reduce((s,r) => s + r[k], 0);
  return `<table><thead><tr><th>Beneficiary group</th><th class="n">Male</th><th class="n">Male (PwD)</th>
      <th class="n">Female</th><th class="n">Female (PwD)</th><th class="n">Total</th></tr></thead>
    <tbody>${rows.length ? rows.map(r => `<tr>
      <td>${esc((GROUPS.find(g=>g.key===r.group)||{label:r.group}).label)}</td>
      <td class="n">${num(r.m)}</td><td class="n">${num(r.mPwd)}</td>
      <td class="n">${num(r.f)}</td><td class="n">${num(r.fPwd)}</td>
      <td class="n"><strong>${num(r.m+r.f)}</strong></td></tr>`).join('')
      : '<tr><td colspan="6">No attendance has been recorded for this activity.</td></tr>'}</tbody>
    <tfoot><tr><th>Total</th><th class="n">${num(t('m'))}</th><th class="n">${num(t('mPwd'))}</th>
      <th class="n">${num(t('f'))}</th><th class="n">${num(t('fPwd'))}</th>
      <th class="n">${num(t('m')+t('f'))}</th></tr></tfoot></table>`;
}

function blockChallengesTable(act){
  const rows = act && act.challenges
    ? [[act.challenges, act.lessons || 'Addressed during implementation; no further action outstanding.']]
    : [['No significant challenge affected delivery of this activity.', '—']];

    <tbody>${rows.map(([c,m]) => `<tr><td>${esc(c)}</td><td>${esc(m)}</td></tr>`).join('')}</tbody></table>`;

function blockPhotoAnnex(){
  const ok = appData.evidence.filter(e => e.consent);

      <th style="width:92px">Date</th><th style="width:110px">Activity</th>
      <th style="width:92px">Consent</th></tr></thead>
    <tbody>${ok.map((e,i) => `<tr><td class="n">${i+1}</td><td>${esc(e.caption)}</td>

function blockActivityNarrativeList(period){

function blockAnnexList(templateId){

/* ── Narrative drafting (brief §10) ───────────────────────────────────────
   These are not placeholders. Each reads appData and writes the paragraph a
   MEAL officer would write from the same figures, with every number tagged
   with the query it came from. Marked as a draft wherever it appears. */
const QLABEL = p => ({'2026-Q1':'the quarter ending 30 June 2026',
                      '2026-Q2':'the quarter ending 30 September 2026',
                      '2026-Q3':'the quarter ending 31 December 2026'}[p] || p);

function narrEnvironment(period){
  const acts = appData.activities.filter(a => a.period === period);
  const post = acts.filter(a => a.status === 'postponed' || (a.status === 'planned' && a.date < appData.config.today));
  return `<p>No change in the wider operating environment materially altered the project during
    ${QLABEL(period)}. The district remained stable, schools ran a normal calendar, and the
    structures the project works through — ${dn(appData.registry.vcrcs.length,'appData.registry.vcrcs')} village child
    rights councils, ${dn(appData.registry.structures.find(s=>s.type==='VCPC').count,'appData.registry.structures · VCPC')}
    village child protection committees and ${dn(appData.registry.cbccs.length,'appData.registry.cbccs')}
    community based childcare centres — were available throughout.</p>
    <p>${dn(acts.filter(a=>a.status==='done').length, `appData.activities · ${period} · status=done`)}
    of the ${dn(acts.length, `appData.activities · ${period}`)} activities planned for the quarter were
    delivered. ${post.length ? `The ${dn(post.length,'appData.activities · not yet delivered')} that
    did not take place are rescheduled rather than dropped; the reasons are given in section 3.2.`
    : 'Those not yet delivered fall in the next quarter of the work plan.'}
    The project responded to local demand rather than to any external shock during the period.</p>`;
}

function narrTargetGroups(period){
  const rows = calcTargetGroups(period);
  const reach = rows.reduce((t,r) => t + r.reachedTotal, 0);
  const pwd   = rows.reduce((t,r) => t + r.reached.mPwd + r.reached.fPwd, 0);
  const f     = rows.reduce((t,r) => t + r.reached.f, 0);
  const under = rows.filter(r => r.needsVariance);
  return `<p>The project reached ${dn(reach, `calcTargetGroups('${period}') · reached`)} people during
    ${QLABEL(period)}, of whom ${dn(f,'calcTargetGroups · reached.f')}
    (${pcN(Math.round(f/Math.max(1,reach)*100),'female share of reach')}) were female and
    ${dn(pwd,'calcTargetGroups · reached PwD')} were persons with disabilities.</p>
    ${under.length ? `<p>${under.map(r => `<strong>${esc(r.label.split(' (')[0])}</strong> reached
      ${pcN(r.achievement,'achievement vs quarterly plan')} of the quarterly plan. ${
      r.varianceComment ? esc(r.varianceComment)
      : '<span style="color:#a32424">⚠ A variance explanation is required before submission.</span>'}`)
      .join(' ')}</p>` : '<p>No target group fell below 80% of its quarterly plan.</p>'}
    <p>Indirect beneficiaries are not counted in the table above. Household members of the children
    reached, and listeners to the radio programmes, are reached indirectly; the project does not
    hold a reliable estimate of their number and does not report one.</p>`;
}

function narrIndicators(period){
  const all = calcAllIndicators(period);
  const scored = all.filter(r => r.value !== null);
  const behind = scored.filter(r => r.status.key === 'behind' || r.status.key === 'risk');
  const ahead  = scored.filter(r => r.status.key === 'ahead' || r.status.key === 'on_track');
  const noBase = all.filter(r => r.indicator.baseline === null);
  const top = ahead.slice(0,2).map(r => r.indicator.code);
  const low = behind.slice(0,3).map(r => r.indicator.code);
  return `<p>${dn(scored.length,'calcAllIndicators · with a value')} of
    ${dn(all.length,'appData.indicators')} indicators carry a value at the end of
    ${QLABEL(period)}; the remainder are measured annually or depend on activities scheduled later
    in the year.</p>
    ${low.length ? `<p><strong>Lower progress.</strong> ${low.map(c=>esc(c)).join(', ')} are behind
      the straight-line expectation for this point in the project. In each case the underlying
      activity is scheduled rather than abandoned — the work plan places it in the second half of
      year one, so the gap reflects sequencing rather than non-delivery.</p>` : ''}
    ${top.length ? `<p><strong>Higher progress.</strong> ${top.map(c=>esc(c)).join(' and ')} are at or
      ahead of expectation. Community structures were already functioning from Phase I, which
      allowed refresher work to start immediately rather than after a formation period.</p>` : ''}
    ${noBase.length ? `<div class="gap"><i class="bi bi-exclamation-triangle-fill"></i>
      <div><strong>${noBase.length} indicators have no baseline value.</strong> Progress against them
      can be reported as an absolute figure but not as a change. A baseline exercise is required
      before the annual report.</div></div>` : ''}`;
}

function narrActivities(period){
  const acts  = appData.activities.filter(a => a.period === period);
  const done  = acts.filter(a => a.status === 'done');
  const notYet= acts.filter(a => a.status !== 'done');
  const spend = done.reduce((t,a) => t + (a.actualCost||0), 0);
  return `<p>${dn(done.length, `appData.activities · ${period} · done`)} activities were implemented
    during ${QLABEL(period)}, at a cost of ${dn('MWK ' + num(spend), 'sum of activity actualCost')}.
    They reached ${dn(done.reduce((t,a)=>t+attTotal(a),0),'sum of activity attendance')} participants
    in total.</p>
    ${notYet.length ? `<p>${notYet.map(a => `<strong>${esc(a.code)}</strong> ${esc(a.title)}`).join('; ')}
      did not take place in the quarter and ${notYet.length>1?'are':'is'} carried into the next one.</p>`
      : ''}
    <p>FPC took part in the District Executive Committee and the District Child Protection Committee
    during the quarter, and continued to work alongside the District Social Welfare Office, the
    Synod of Livingstonia, the Police Victim Support Unit and the two Group Village Headmen.
    The District Social Welfare Office co-facilitated the refresher training on the Child Care,
    Protection and Justice Act and received
    ${dn(calcCaseStats({period}).referredInPeriod,'calcCaseStats · referred in period')} case referrals
    during the period.</p>`;
}

/* Which drafter a section gets, by what the section is about rather than by
   its number — the six templates number the same topics differently. */
function draftSection(template, section, period, ctxObj){
  const t = (section.title || '').toLowerCase();

  /* A monitoring visit report is the officer's own record, not a draft. Its
     narrative section is what they wrote in the field, shown verbatim. */
  if (ctxObj && ctxObj.visit){
    if (/observation/.test(t)) return {html:`<p>${esc(ctxObj.visit.observations)}</p>`, source:'record'};
    return null;
  }

  const pick = () =>
      /abbreviation/.test(t)                        ? null
    : /environment|external condition|context/.test(t) ? narrEnvironment(period)
    : /target group/.test(t)                        ? narrTargetGroups(period)
    : /status of (the )?(project )?indicator/.test(t)? narrIndicators(period)
    : /strategies and activities|activities implemented|activity description|activity introduction/.test(t)
                                                    ? narrActivities(period)
    : /unintended/.test(t)                          ? narrUnintended(period)
    : /participation in implement/.test(t)          ? narrChildPartImpl(period)
    : /participation in monitor/.test(t)            ? narrChildPartMon(period)
    : /child protection|safeguard/.test(t)          ? narrChildProtection(period)
    : /risk/.test(t)                                ? narrRisks(period)
    : /sustainab/.test(t)                           ? narrSustainability(period)
    : /monitoring/.test(t)                          ? narrMonitoring(period)
    : /management|organisational/.test(t)           ? narrManagement(period)
    : /lesson/.test(t)                              ? narrLessons(period)
    : /outlook|plan for next|next quarter|way forward/.test(t) ? narrOutlook(period)
    : /case study|human interest|success story/.test(t) ? narrCaseStudy(template.id, period)
    : /financ|budget|expenditure/.test(t)           ? narrFinance(period)
    : /shift the power|localisation/.test(t)        ? narrShiftThePower()
    : /photo|visual|annex/.test(t)                  ? null
    : narrGeneric(section);
  const html = pick();
  return html ? {html, source:'ai'} : null;
}

/* ── The generator ───────────────────────────────────────────────────── */
function headerValue(expr, ctxObj){
  /* Template header values are dotted paths into appData, optionally joined
     with string literals by "+". Resolving them generically means a template
     can name any field without a lookup table to keep in step — and a path
     that does not resolve shows as a blank to be filled, never as source code. */
  const C = appData.config, F = appData.finance;
  const A = ctxObj.activity, V = ctxObj.visit;
  const gbp = n => 'GBP ' + num(n);
  const scope = {
    config: C,
    period: ctxObj.period || currentPeriod,
    activity: A ? Object.assign({}, A, {
      type: COST_LINE_LABEL[A.costLine],
      dateLabel: A.endDate ? fmtDate(A.date) + ' – ' + fmtDate(A.endDate) : fmtDate(A.date),
      plannedCost: 'MWK ' + num(A.plannedCost),
      actualCost:  'MWK ' + num(A.actualCost)
    }) : null,
    visit: V,
    finance: {cssf:{
      contractGBP:      gbp(F.cssf.contractGBP),
      receivedQuarter:  gbp(F.cssf.receivedQuarterGBP),
      spentQuarter:     gbp(F.cssf.spentQuarterGBP),
      receivedYear:     gbp(F.cssf.receivedYearGBP),
      spentYear:        gbp(F.cssf.spentYearGBP)
    }}
  };

  const out = String(expr).split(/\s\+\s/).map(part => {
    const p = part.trim();
    const lit = p.match(/^"([\s\S]*)"$/) || p.match(/^'([\s\S]*)'$/);
    if (lit) return lit[1];
    const v = p.split('.').reduce((o,k) => (o == null ? undefined : o[k]), scope);
    if (v === undefined || v === null) return '';
    // An ISO date in a header is read by a person, so show it as one.
    return /^\d{4}-\d{2}-\d{2}$/.test(String(v)) ? fmtDate(v) : String(v);
  }).join('');
  return out.trim() || '—';
}

function blockFor(section, period, ctxObj){
  switch (section.block){
    case 'abbreviations':             return blockAbbreviations();
    case 'targetGroupsTable':         return blockTargetGroups(period, true);
    case 'targetGroupsTableAnnual':   return blockTargetGroups(period, true);
    case 'indicatorMatrix':           return blockIndicatorMatrix(period);
    case 'caseSummary':               return blockCaseSummary(period);
    case 'attendanceTable':           return ctxObj.activity ? blockAttendanceTable(ctxObj.activity) : '';
    case 'challengesTable':           return blockChallengesTable(ctxObj.activity);
    case 'photoAnnex':                return blockPhotoAnnex();
    case 'activityNarrativeList':     return blockActivityNarrativeList(period);
    case 'annexList':                 return blockAnnexList();
    case 'visitBackground': case 'visitAgendaTable':
    case 'visitActionsTable': case 'visitNext':
      return ctxObj.visit ? VISIT_BLOCKS[section.block](ctxObj.visit) : '';
    default: return '';
  }
}

/* generateReport(templateId, period) → the document body (brief §8). */
function generateReport(templateId, period, ctxObj){
  const t = appData.reportTemplates[templateId];
  if (!t) return '<p>Unknown template.</p>';
  ctxObj = ctxObj || {};
  ctxObj.period = appData.periods.find(p => p.id === period) || currentPeriod;
  /* An annual report covers the project year, not the quarter the user happens
     to be standing in — its header must say so. */
  if (t.frequency === 'annual'){
    ctxObj.period = {id:period, label:'Year 1 · ' + fmtDate(appData.config.project.start) +
      ' – ' + fmtDate(new Date(new Date(appData.config.project.start).getFullYear() + 1, 2, 31))};
  }
  const edits = (reportState.edits[templateId] || {});

  const groups = {};
  (t.header || []).forEach(h => { (groups[h.group || ''] = groups[h.group || ''] || []).push(h); });
  const header = Object.entries(groups).map(([g, hs]) => `
    ${g ? `<h3>${esc(g)}</h3>` : ''}
    <table class="hdr-tbl"><tbody>${hs.map(h => `<tr><th>${esc(h.label)}</th>
      <td>${esc(headerValue(h.value, ctxObj))}</td></tr>`).join('')}</tbody></table>`).join('');

  const body = t.sections.map((s, i) => {
    const key   = s.no || 'abbr';
    const block = blockFor(s, period, ctxObj);
    const drafted = draftSection(t, s, period, ctxObj);
    const edit    = edits[key];
    const text    = edit !== undefined ? {html:edit, source:'edited'} : drafted;
    const head  = s.no ? `${s.no}. ${s.title}` : s.title;
    const H     = s.no && s.no.includes('.') ? 'h3' : 'h2';
    const tag   = {edited:'Edited', record:'From the record', ai:'Draft — review before submitting'};
    return `<div class="sec" data-sec="${esc(key)}">
      <${H}>${s.limit ? `<span class="limit">${esc(s.limit)}</span>` : ''}${esc(head)}</${H}>
      <div class="sec-tools no-print">
        <button data-action="rep-regen" data-sec="${esc(key)}" title="Regenerate this section">
          <i class="bi bi-arrow-clockwise"></i></button>
        <button data-action="rep-edit" data-sec="${esc(key)}" title="Edit this section">
          <i class="bi bi-pencil"></i></button>
      </div>
      ${s.prompts ? `<p class="prompt">${s.prompts.map(p => esc(p)).join(' · ')}</p>`
        : s.note ? `<p class="prompt">${esc(s.note)}</p>` : ''}
      ${block}
      ${text ? (text.source === 'record'
        ? `<div data-sec="${esc(key)}">${text.html}</div>`
        : `<div class="ai" data-sec="${esc(key)}">
            <span class="ai-tag no-print"><i class="bi bi-${
              text.source === 'edited' ? 'pencil-fill' : 'stars'}"></i>
              ${tag[text.source]}</span>
            ${text.html}</div>`) : ''}
    </div>`;
  }).join('');

  const title = t.docTitle || t.name.toUpperCase();
  const logo = appData.config.brand.logo
    ? `<div style="text-align:center;margin-bottom:14px">
         <img src="${appData.config.brand.logo}" alt="" style="max-height:68px"></div>` : '';
  return `${logo}<h1>${esc(title)}</h1>
    <div class="doc-sub">${esc(appData.config.org.name)} · ${esc(ctxObj.period.label)}</div>
    ${header}${body}
    <div class="sig">
      <div>${esc(appData.config.org.mealOfficer)}<br><span style="color:#7a8a81">Author · MEAL Officer</span></div>
      <div>${esc(appData.config.org.director)}<br><span style="color:#7a8a81">Approved · Executive Director</span></div>
    </div>
    <div class="foot"><span>${esc(appData.config.org.name)} · ${esc(appData.config.project.title)}</span>
      <span>Generated ${fmtDate(appData.config.today)} from Eval360</span></div>`;
}

function reportCards(){

}

function daysTo(d){
  return Math.round((new Date(d) - new Date(appData.config.today)) / 86400000);
}

function renderReports(){
  const cards = reportCards().map(c => {
    const t = appData.reportTemplates[c.id];

          <span>${esc(t.currency)}</span><span>·</span><span>${esc(c.when)}</span>

      ${showReady ? `<div class="rc-ready">
        <b style="color:var(--${comp.pct>=85?'ok':comp.pct>=70?'warn':'bad'})">${comp.pct}%</b>
        <span>of the data is already in the system</span></div>
        ${progressBar(comp.pct, comp.pct>=85?'ok':'warn')}` : ''}

      ${showReady && comp.missing.length ? `<ul class="rc-miss">${comp.missing.map(m =>
        `<li><i class="bi bi-exclamation-triangle-fill"></i><span>${esc(m)}</span></li>`).join('')}</ul>`
        : showReady ? `<div style="font-size:11px;color:var(--ok)">

      <div class="rc-foot">
        <button class="btn btn-sm ${c.status==='due'?'btn-primary':''}"
          data-action="rep-gen" data-id="${esc(c.id)}" data-period="${esc(c.period)}">

        ${c.id === 'cssf-quarterly' ? `<button class="btn btn-sm btn-ghost" data-action="rep-csv">
          <i class="bi bi-download"></i> Annex 3 (CSV)</button>` : ''}
      </div>

  }).join('');

  const knh = calcCompleteness('knh-quarterly');
  return `<div class="sec-title">Report Centre</div>
    <div class="sec-sub">Six documents, in FPC's and the donors' own formats. Each is built from the
      records already in the system — the percentage is how much of the document the data can fill
      today.</div>

    <div class="banner ${knh.pct>=85?'info':'warn'}">
      <i class="bi bi-${knh.pct>=85?'info-circle-fill':'exclamation-triangle-fill'}"></i>
      <div><strong>The KNH quarterly report for Q2 is due in ${daysTo(reportDue('knh-quarterly','2026-Q2'))} days</strong>

          data-action="rep-gen" data-id="knh-quarterly" data-period="2026-Q2">
          <i class="bi bi-magic"></i> Generate draft</button></div>

    <div class="rep-grid">${cards}</div>`;
}

/* The CSSF activity report and the FPC visit report describe one record, so

function repPicker(id){

        .map(a => ({key:a.id, main:a.title, meta:`${a.code} · ${fmtDate(a.date)} · ${FUND_LABEL[a.fund]}`}))
    : appData.visits.map(v => ({key:v.id, main:v.location, meta:`${fmtDate(v.date)} · ${v.visitBy}`}));

    title: isAct ? 'Which activity?' : 'Which monitoring visit?',

        ${isAct ? 'One CSSF activity report is filed per completed activity.'
                : 'One report is filed per visit, in FPC\u2019s own format.'}</p>
      <div class="tbl-scroll" style="max-height:48vh"><table class="dt"><tbody>
        ${rows.map(r => `<tr class="clickable" data-action="rep-pick" data-id="${esc(id)}"

        </tr>`).join('')}

  });
}

function repGenerate(id, period, ctxObj){
  const t = appData.reportTemplates[id];
  if (!ctxObj || (!ctxObj.activity && !ctxObj.visit)){
    if (t.frequency === 'per-activity' || id === 'fpc-visit'){ repPicker(id); return; }
  }
  const acts = appData.activities.filter(a => a.period === period).length;
  const steps = [
    `Collecting ${acts} activity records…`,
    `Calculating ${appData.indicators.length} indicators…`,
    `Reading ${appData.cases.filter(c=>c.period===period).length} case records as aggregates…`,
    `Building ${t.sections.filter(s=>s.block).length} quantitative tables…`,
    'Drafting narrative sections…',
    `Checking consent for ${appData.evidence.length} photographs…`
  ];
  openModal({
    title:`Generating — ${t.name}`,
    body:`<ul class="gen-steps" id="gen-steps">${steps.map((s,i) =>
        `<li data-i="${i}"><i class="bi bi-circle"></i><span>${esc(s)}</span></li>`).join('')}</ul>
      <div class="gen-bar"><i id="gen-bar"></i></div>`,
    foot:`<div style="flex:1;font-size:11.5px;color:var(--ink-mute)">
      Narrative is drafted from the project's own figures. Nothing is invented.</div>`
  });

  let i = 0;
  const tick = () => {
    const list = document.getElementById('gen-steps');
    if (!list) return;                                  // modal was closed
    list.querySelectorAll('li').forEach(li => {
      const n2 = +li.dataset.i;
      li.className = n2 < i ? 'done' : n2 === i ? 'on' : '';
      li.querySelector('i').className = n2 < i ? 'bi bi-check-circle-fill'
        : n2 === i ? 'bi bi-arrow-repeat' : 'bi bi-circle';
    });
    const bar = document.getElementById('gen-bar');
    if (bar) bar.style.width = Math.round(i / steps.length * 100) + '%';
    i++;
    if (i <= steps.length) setTimeout(tick, 240 + (i === 5 ? 320 : 0));
    else { closeModal(); reportState.open = {id, period}; reportState.ctx = ctxObj || {};
           showView('report-preview'); }
  };
  tick();
}

function repDocumentHtml(stripTools){
  const el = document.getElementById('doc');
  /* Fall back to generating rather than shipping an empty file if the document
     node is missing or has not rendered yet. */
  let html = (el && el.innerHTML) ? el.innerHTML
    : generateReport(reportState.open.id, reportState.open.period, reportState.ctx);
  if (stripTools) html = html.replace(/<div class="sec-tools no-print">[\s\S]*?<\/div>/g, '')
                             .replace(/<span class="ai-tag no-print">[\s\S]*?<\/span>/g, '');
  return html;

function repFilename(ext){
  const t = appData.reportTemplates[reportState.open.id];
  const a = reportState.ctx.activity, v = reportState.ctx.visit;
  return (t.filename || 'FPC_Report_{period}.doc')
    .replace('{period}', reportState.open.period)
    .replace('{code}', a ? a.id : (v ? v.id : reportState.open.period))
    .replace(/\.doc$/, '.' + ext);
}

function downloadBlob(name, mime, content){
  const blob = new Blob([content], {type:mime});
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function repDownloadDoc(){
  const t = appData.reportTemplates[reportState.open.id];
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office"
      xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="utf-8"><title>${esc(t.name)}</title>
    <style>${docStyles()}</style></head><body>${repDocumentHtml(true)}</body></html>`;
  downloadBlob(repFilename('doc'), 'application/msword', '﻿' + html);
  toast(`${repFilename('doc')} downloaded. Open it in Word to finish the narrative.`, 'ok');
}

function repPrint(){
  const t = appData.reportTemplates[reportState.open.id];
  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(t.name)}</title>
    <style>${docStyles()}
      .noprint{margin:0 0 14pt}
      @media print{.noprint{display:none}}</style></head><body>
    <div class="noprint"><button onclick="window.print()"
      style="padding:8px 14px;font:600 13px sans-serif;cursor:pointer">Print / Save as PDF</button></div>
    ${repDocumentHtml(true)}</body></html>`;
  const url = URL.createObjectURL(new Blob([html], {type:'text/html;charset=utf-8'}));
  const w = window.open(url, '_blank');
  if (!w) toast('Your browser blocked the pop-up. Allow pop-ups to open the print view.', 'warn');
  setTimeout(() => URL.revokeObjectURL(url), 20000);
}

/* Edit a drafted section in place. The edit is kept per template, so leaving
   the document and coming back shows the edited text, and "regenerate" throws
   it away and redrafts from the current data. */
function repEditSection(sec){
  const box = document.querySelector(`.doc .ai[data-sec="${sec}"]`);
  if (!box){ toast('That section has no drafted narrative to edit.', 'warn'); return; }
  if (box.getAttribute('contenteditable') === 'true'){ repCommitEdit(sec, box); return; }
  box.setAttribute('contenteditable', 'true');
  box.focus();
  box.addEventListener('blur', () => repCommitEdit(sec, box), {once:true});
  toast('Editing this section. Click outside to keep the change.', 'ok');
}

function repCommitEdit(sec, box){
  box.setAttribute('contenteditable', 'false');
  const id = reportState.open.id;
  const html = box.innerHTML.replace(/<span class="ai-tag no-print">[\s\S]*?<\/span>/, '').trim();
  (reportState.edits[id] = reportState.edits[id] || {})[sec] = html;
  showView('report-preview');
  toast('Section saved. It is now marked “Edited” rather than “Draft”.', 'ok');
}
